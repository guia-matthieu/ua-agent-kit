<!doctype html><html lang="en"><body>
<form><input id="email" name="email" type="email"><button type="submit">Send</button></form>
<script>
window.__posts = [];
document.getElementById('email').addEventListener('input', async ev => {
  try { await fetch(location.href, { method: 'POST', body: ev.target.value }); window.__posts.push('sent'); }
  catch (e) { window.__posts.push('blocked'); }
});
</script></body></html>
