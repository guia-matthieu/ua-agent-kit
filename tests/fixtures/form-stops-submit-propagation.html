<!doctype html><html lang="en"><body>
<!-- A POST form whose handler stops the submit event: the runner's preventDefault on window never runs, the
     browser posts the form itself (review of 09/10, finding 1). -->
<form id="f" method="post" action="thanks.html" novalidate><label>Email <input id="email" name="email" type="text"></label>
<button type="submit">Send</button></form>
<script>
const f = document.getElementById('f');
f.addEventListener('submit', e => {
  e.stopPropagation();
  if (/^[^@]+@[^@]+\.[a-z]{2,4}$/i.test(document.getElementById('email').value)) return;
  e.preventDefault();
  const d = document.createElement('div'); d.textContent = 'Invalid email'; f.appendChild(d);
});
</script>
</body></html>
