<!doctype html><html lang="en"><body>
<!-- Counts its own documents in IndexedDB (the one storage the runner does not reset between cases) and,
     from the fourth document on, offers another email field: the runner must notice, not type the
     remaining cases into it. The busy waits keep the load event behind the IndexedDB answers, so the
     change is in place when the runner looks. -->
<form id="f"><label>Email <input id="email" name="email" type="email"></label><button type="submit">Send</button></form>
<script>
const spin = ms => { const t0 = Date.now(); while (Date.now() - t0 < ms) { /* let the storage answer queue before the load event */ } };
const req = indexedDB.open('ua-kit-fixture', 1);
req.onupgradeneeded = () => req.result.createObjectStore('kv');
req.onsuccess = () => {
  const store = req.result.transaction('kv', 'readwrite').objectStore('kv');
  const get = store.get('documents');
  get.onsuccess = () => {
    const n = (get.result || 0) + 1;
    store.put(n, 'documents');
    if (n > 3) { const i = document.getElementById('email'); i.type = 'text'; i.name = 'contact'; }
  };
  spin(40);
};
spin(40);
document.getElementById('f').addEventListener('submit', e => e.preventDefault());
</script>
</body></html>
