<!doctype html><html lang="en"><body>
<!-- A dedicated worker fed the field's value on a timer sends it in bursts. The guard holds it while its document
     lives; it is cut off while that document goes away, before the worker stops (review of PR #10). -->
<form id="f" novalidate><label>Email <input id="email" name="email" type="text"></label><button type="submit">Send</button></form>
<script>
const code = `let v = ''; onmessage = e => { v = e.data; };
  setInterval(() => { if (v) for (let i = 0; i < 3; i++) fetch(location.origin + '/leak-wk?v=' + encodeURIComponent(v) + '&i=' + i).catch(() => {}); }, 5);`;
const w = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
setInterval(() => w.postMessage(document.getElementById('email').value), 5);
document.getElementById('f').addEventListener('submit', e => e.preventDefault());
</script>
</body></html>
