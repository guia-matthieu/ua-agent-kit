<!doctype html><html lang="en"><body>
<!-- Keeps its count of submits in IndexedDB and refuses every value past two of them: a reload that keeps
     IndexedDB reads every case after the baseline and the second value as refused (review of PR #9). -->
<form id="f" novalidate><label>Email <input id="email" name="email" type="text"></label><div id="err"></div><button type="submit">Send</button></form>
<script>
const spin = ms => { const t0 = Date.now(); while (Date.now() - t0 < ms) { /* let the storage answer queue before the load event */ } };
let count = 0, db = null;
const req = indexedDB.open('ua-kit-fixture-limit', 1);
req.onupgradeneeded = () => req.result.createObjectStore('kv');
req.onsuccess = () => {
  db = req.result;
  const get = db.transaction('kv').objectStore('kv').get('n');
  get.onsuccess = () => { count = get.result || 0; };
  spin(40);
};
spin(40);
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  count += 1;
  if (db) db.transaction('kv', 'readwrite').objectStore('kv').put(count, 'n');
  const em = document.getElementById('email');
  const refused = count > 2;
  if (refused) em.setAttribute('aria-invalid', 'true'); else em.removeAttribute('aria-invalid');
  document.getElementById('err').textContent = refused ? 'Too many attempts.' : '';
});
</script>
</body></html>
