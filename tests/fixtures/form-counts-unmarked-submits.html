<!doctype html><html lang="en"><body>
<!-- Counts, in IndexedDB (the one storage the runner does not reset), the submits it receives in a document the
     runner has not marked as probed, and shows the count of the documents before this one in window.__submitted.
     Every submit of the runner, the baseline included, must come after its marker. -->
<form id="f" novalidate><label>Email <input id="email" name="email" type="text"></label><button type="submit">Send</button></form>
<script>
const spin = ms => { const t0 = Date.now(); while (Date.now() - t0 < ms) { /* let the storage answer queue before the load event */ } };
const req = indexedDB.open('ua-kit-fixture-unmarked', 1);
let db = null;
req.onupgradeneeded = () => req.result.createObjectStore('kv');
req.onsuccess = () => {
  db = req.result;
  const get = db.transaction('kv').objectStore('kv').get('unmarked');
  get.onsuccess = () => { window.__submitted = get.result || 0; };
  spin(40);
};
spin(40);
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  if (window.__uaProbed === true || !db) return;
  const store = db.transaction('kv', 'readwrite').objectStore('kv');
  const get = store.get('unmarked');
  get.onsuccess = () => store.put((get.result || 0) + 1, 'unmarked');
});
</script>
</body></html>
