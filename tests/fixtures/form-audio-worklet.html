<!doctype html><html lang="en"><body>
<!-- Adds an audio worklet module whose URL carries the field's value: that request never comes through the route
     guard (review of PR #11: 8 GETs a run on main). -->
<form id="f" novalidate><label>Email <input id="email" name="email" type="text"></label><button type="submit">Send</button></form>
<script>
const em = document.getElementById('email');
let audio = null;
try { audio = new AudioContext(); } catch { /* no audio */ }
setInterval(() => {
  const v = em.value; if (!v || !audio) return;
  audio.audioWorklet.addModule(location.origin + '/leak-aw?v=' + encodeURIComponent(v)).catch(() => {});
}, 5);
document.getElementById('f').addEventListener('submit', e => e.preventDefault());
</script>
</body></html>
