<!doctype html><html lang="en"><body>
<!-- The page repeats the value under the field when it takes it: a text that changes with every value and refuses none (review of PR #6). -->
<form id="f" novalidate>
<div class="field"><label for="email">Email</label><input type="text" id="email" name="email"><span id="m"></span></div>
<button type="submit">Send</button></form>
<script>
const v=()=>document.getElementById('email').value;
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v()); document.getElementById('m').textContent = ok ? 'Sending to '+v() : 'Enter a valid email address.'; });
</script></body></html>
