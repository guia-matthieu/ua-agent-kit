<!doctype html><html lang="en"><body style="margin:0">
<!-- An app shell: a box of the viewport's height that hides overflow, a <main> inside it that scrolls. The form is
     below the fold of <main>: a person scrolls to it, its name field must be filled (review of PR #8). The page
     stops at its first error, so an empty name would read as a refusal of every value. -->
<div style="height:100vh; overflow:hidden; display:flex; flex-direction:column"><main style="flex:1; overflow:auto">
<div style="height:1500px">Intro</div>
<form id="f" novalidate><label>Email <input id="email" name="email" type="text"></label>
<label>Your full name <input id="name" name="fullname"></label><button type="submit">Send</button></form>
</main></div>
<script>
const f = document.getElementById('f');
f.addEventListener('submit', e => {
  e.preventDefault();
  f.querySelectorAll('.err').forEach(x => x.remove());
  const say = t => { const d = document.createElement('div'); d.className = 'err'; d.textContent = t; f.appendChild(d); };
  if (!document.getElementById('name').value) return say('Please fill in all fields');
  if (!/^[^@]+@[^@]+\.[a-z]{2,4}$/i.test(document.getElementById('email').value)) say('Invalid email');
});
</script>
</body></html>
