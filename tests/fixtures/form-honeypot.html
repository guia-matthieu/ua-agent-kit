<!doctype html><html lang="en"><body>
<!-- Anti-spam traps a person never sees: a submit with any of them filled is dropped without a word, so a
     runner that fills them reads every value as accepted (review of 09/10, finding 5). The name field is
     visible and required: it must still be filled. -->
<style>.trap { position: absolute; left: -9999px; } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }</style>
<form id="f" novalidate><label>Name <input id="name" name="name" type="text"></label>
<label>Email <input id="email" name="email" type="text"></label>
<div class="trap"><label>Website <input name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
<div style="display:none"><input name="url" type="url"></div>
<div class="sr"><input name="fax" type="tel"></div>
<input name="contact_email" type="hidden">
<input name="company" type="text" style="visibility:hidden">
<input name="nickname" type="text" style="width:0; height:0; padding:0; border:0">
<button type="submit">Send</button></form>
<script>
const f = document.getElementById('f');
f.addEventListener('submit', e => {
  e.preventDefault();
  for (const n of ['website', 'url', 'fax', 'contact_email', 'company', 'nickname']) if (f.elements[n].value !== '') return;
  const err = [];
  if (!document.getElementById('name').value) err.push('Name required');
  if (!/^[^@]+@[^@]+\.[a-z]{2,4}$/i.test(document.getElementById('email').value)) err.push('Invalid email');
  for (const t of err) { const d = document.createElement('div'); d.textContent = t; f.appendChild(d); }
});
</script>
</body></html>
