<!doctype html><html lang="en"><body>
<!-- novalidate, and a script that asks the field itself: the browser's rule for type=email is applied by the page.
     The refusal is the page's (nothing else blocks the submit), its cause is the field type. -->
<form id="f" novalidate><label>Name <input id="name" name="name" type="text" required></label>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<div id="err-email" hidden>Invalid email address</div>
<label>Password <input id="pw" name="password" type="password" required></label>
<button type="submit">Send</button></form>
<script>
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('email');
  const bad = email.validity.typeMismatch || email.validity.valueMissing;
  email.setAttribute('aria-invalid', bad ? 'true' : 'false');
  document.getElementById('err-email').hidden = !bad;
});
</script>
</body></html>
