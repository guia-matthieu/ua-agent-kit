<!doctype html><html lang="en"><body>
<!-- Once the time in its query string has passed, the email field is read-only (finding 3 on the reload path the
     runner uses: a context per reload). -->
<form id="f" novalidate><label>Email <input id="email" name="email" type="email"></label><button type="submit">Send</button></form>
<script>
const until = +new URLSearchParams(location.search).get('until');
if (Date.now() > until) document.getElementById('email').readOnly = true;
document.getElementById('f').addEventListener('submit', e => e.preventDefault());
</script>
</body></html>
