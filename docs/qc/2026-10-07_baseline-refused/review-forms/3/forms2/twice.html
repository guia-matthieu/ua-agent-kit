<!doctype html><html lang="en"><body>
<form id="f" novalidate>
<div class="field"><label for="email">Email</label><input type="text" id="email" name="email"><span id="m"></span></div>
<button type="submit">Send</button></form>
<script>
const v=()=>document.getElementById('email').value;
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); const x=v(); const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)&&!/\.\./.test(x); document.getElementById('m').textContent = ok ? 'Sending '+x+' to '+x : 'Enter a valid email address.'; });
</script></body></html>
