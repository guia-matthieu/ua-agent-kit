<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="website">Website</label><input type="text" id="website" name="website" autocomplete="off"><span id="w"></span></div><button type="submit">Send</button></form><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=website.value,m=document.getElementById('w');if(!/^https?:\/\/[a-z0-9.-]+\.[a-z]{2,}/i.test(v)){m.textContent='Enter a valid URL (https://...).';return;}let u=v;try{u=new URL(v).href}catch(e){}m.textContent='Link: '+u;});</script></body></html>
