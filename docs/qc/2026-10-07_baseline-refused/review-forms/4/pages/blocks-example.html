<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="email">Email</label><input type="text" id="email" name="email" autocomplete="off"><span id="m"></span></div><button type="submit">Send</button></form><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=email.value,m=document.getElementById('m');const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);const blocked=/@example\.com$/i.test(v);email.setAttribute('aria-invalid',!ok||blocked);m.textContent=!ok?'Enter a valid email address.':blocked?'Use your real address.':'Sending to '+v;});</script></body></html>
