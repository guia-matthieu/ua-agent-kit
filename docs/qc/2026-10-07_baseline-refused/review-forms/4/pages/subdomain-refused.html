<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="website">Website</label><input type="text" id="website" name="website" autocomplete="off"><span id="w"></span></div><button type="submit">Send</button></form><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=website.value,m=document.getElementById('w');const bad=!/^([a-z0-9\u00a1-\uffff-]+\.)+[a-z0-9\u00a1-\uffff-]{2,}$/i.test(v)||v.replace(/^https?:\/\//,'').split('.').length>2;m.textContent=bad?'Subdomains are not accepted.':'';});</script></body></html>
