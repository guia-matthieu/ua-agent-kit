<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="website">Website</label><input type="text" id="website" name="website" autocomplete="off"><span id="w"></span></div><button type="submit">Send</button></form><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=website.value,m=document.getElementById('w');const bad=!/^([a-z0-9\u00a1-\uffff-]+\.)+[a-z0-9\u00a1-\uffff-]{2,}$/i.test(v)||/^(https?:\/\/)?www\./i.test(v);website.setAttribute('aria-invalid',bad);m.textContent=bad?'Enter the domain without www.':'';});</script></body></html>
