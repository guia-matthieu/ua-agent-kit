<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="email">Email</label><input type="text" id="email" name="email" autocomplete="off"><span id="m"></span></div><button type="submit">Send</button></form><script>const dbq=new Promise(r=>{const q=indexedDB.open('x',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=email.value,m=document.getElementById('m');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.textContent='Enter a valid email address.';return;}dbq.then(db=>{const s=db.transaction('kv','readwrite').objectStore('kv');const g=s.get('done');g.onsuccess=()=>{if(g.result)m.textContent='You are already subscribed.';else{s.put(1,'done');m.textContent='';}}});});</script></body></html>
