<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="email">Email</label><input type="text" id="email" name="email" autocomplete="off"><span id="m"></span></div><button type="submit">Send</button></form><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=email.value,m=document.getElementById('m');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.textContent='Enter a valid email address.';return;}const [l,d]=v.split('@');m.textContent='Hello '+l+' from '+d;});</script></body></html>
