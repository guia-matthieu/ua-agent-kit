<!doctype html><html lang="en"><body><form id="f" novalidate><div class="field"><label for="website">Website</label><input type="text" id="website" name="website" autocomplete="off"><span id="w"></span></div><button type="submit">Send</button></form><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=website.value,m=document.getElementById('w');m.textContent=/^([a-z0-9\u00a1-\uffff-]+\.)+[a-z0-9\u00a1-\uffff-]{2,}$/i.test(v)?'':'Enter a valid website.';});</script></body></html>
