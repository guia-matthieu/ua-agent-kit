<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #172033;
      background: #f1f5f9;
    }
    main {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px #17203312;
    }
    h1 { margin: 0 0 8px; }
    .intro { margin: 0 0 28px; color: #475569; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 7px; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #64748b;
      border-radius: 7px;
      font: inherit;
      background: white;
      color: inherit;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }
    input[aria-invalid="true"] { border-color: #b91c1c; }
    .hint, .error { margin: 7px 0 0; font-size: 0.875rem; }
    .hint { color: #475569; }
    .error { color: #b91c1c; }
    .error:empty { display: none; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      font: inherit;
      font-weight: 600;
      color: white;
      background: #1d4ed8;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    #status { margin: 18px 0 0; line-height: 1.5; }
    #status:empty { display: none; }
    .notice { margin: 20px 0 0; font-size: 0.875rem; color: #475569; }
    @media (max-width: 420px) {
      main { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p class="intro">All fields are required.</p>

    <form id="signup" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" type="text"
               autocomplete="name" required
               aria-describedby="full-name-error">
        <p class="error" id="full-name-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <!-- Text preserves internationalized addresses across browsers. -->
        <input id="email" name="email" type="text" inputmode="email"
               autocomplete="email" autocapitalize="none" spellcheck="false"
               required aria-describedby="email-hint email-error">
        <p class="hint" id="email-hint">International characters are welcome.</p>
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="website">Website</label>
        <input id="website" name="website" type="url"
               autocomplete="url" autocapitalize="none" spellcheck="false"
               placeholder="https://example.com" required
               aria-describedby="website-hint website-error">
        <p class="hint" id="website-hint">Include https:// or http://.</p>
        <p class="error" id="website-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password" required
               aria-describedby="password-hint password-error">
        <p class="hint" id="password-hint">Use at least 12 characters.</p>
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>

      <button type="submit">Sign up</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="notice">Demo only: this page does not send or store your information.</p>
    <noscript><p>Enable JavaScript to validate this form.</p></noscript>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("signup");
    const status = document.getElementById("status");
    const fields = Array.from(form.querySelectorAll("input"));
    const touched = new Set();

    function isValidAsciiDomain(domain) {
      if (!domain || domain.length > 253) return false;

      const labels = domain.split(".");
      if (labels.length < 2) return false;

      // These checks apply only AFTER Unicode-to-ASCII conversion.
      for (const label of labels) {
        if (
          label.length < 1 ||
          label.length > 63 ||
          !/^[a-z0-9-]+$/i.test(label) ||
          label.startsWith("-") ||
          label.endsWith("-")
        ) {
          return false;
        }
      }

      const tld = labels[labels.length - 1];
      // No arbitrary TLD-length cap or hard-coded TLD allow-list.
      return /^[a-z]{2,}$/i.test(tld) ||
             /^xn--[a-z0-9-]+$/i.test(tld);
    }

    function domainToASCII(originalDomain) {
      // Prevent URL syntax from being interpreted as part of a domain.
      if (
        !originalDomain ||
        /[\s\u0000-\u001f\u007f-\u009f/\\:?#@%\[\]]/u.test(originalDomain)
      ) {
        throw new Error("Invalid domain");
      }

      // The browser's WHATWG URL parser performs UTS #46 IDNA conversion.
      const parsed = new URL("https://" + originalDomain + "/");
      const asciiDomain = parsed.hostname.toLowerCase();

      if (!isValidAsciiDomain(asciiDomain)) {
        throw new Error("Invalid domain");
      }
      return asciiDomain;
    }

    function parseEmail(original) {
      const parts = original.split("@");
      if (parts.length !== 2) throw new Error("Invalid email");

      const [localPart, originalDomain] = parts;
      if (
        !localPart ||
        /[\s\u0000-\u001f\u007f-\u009f]/u.test(localPart)
      ) {
        throw new Error("Invalid email");
      }

      const asciiDomain = domainToASCII(originalDomain);

      // Preserve the original text and local-part case alongside IDNA form.
      return {
        original,
        localPart,
        originalDomain,
        asciiDomain,
        normalized: localPart + "@" + asciiDomain
      };
    }

    function parseWebsite(original) {
      if (
        !/^https?:\/\//i.test(original) ||
        /[\s\u0000-\u001f\u007f-\u009f\\]/u.test(original)
      ) {
        throw new Error("Invalid website");
      }

      const parsed = new URL(original);
      if (
        !["http:", "https:"].includes(parsed.protocol) ||
        !parsed.hostname ||
        parsed.username ||
        parsed.password
      ) {
        throw new Error("Invalid website");
      }

      const asciiHost = parsed.hostname.toLowerCase();
      // IP literals have already been validated by the URL parser.
      const isIPv6 = asciiHost.startsWith("[") && asciiHost.endsWith("]");
      const isIPv4 = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(asciiHost);

      // A final DNS root dot is valid in a website hostname.
      const domain = asciiHost.endsWith(".")
        ? asciiHost.slice(0, -1)
        : asciiHost;

      if (!isIPv4 && !isIPv6 && !isValidAsciiDomain(domain)) {
        throw new Error("Invalid website domain");
      }

      return {
        original,
        asciiHost,
        normalized: parsed.href
      };
    }

    function getError(field) {
      const value = field.value;

      switch (field.id) {
        case "full-name":
          if (!value.trim()) return "Enter your full name.";
          if (/[\u0000-\u001f\u007f-\u009f]/u.test(value)) {
            return "Remove control characters from your name.";
          }
          return "";

        case "email":
          if (!value) return "Enter your email address.";
          try {
            parseEmail(value);
            return "";
          } catch {
            return "Enter an address with one @, no spaces, and a domain such as example.com.";
          }

        case "website":
          if (!value) return "Enter your website.";
          try {
            parseWebsite(value);
            return "";
          } catch {
            return "Enter a complete http:// or https:// URL with a valid domain or IP address and no login credentials.";
          }

        case "password":
          if (!value) return "Enter a password.";
          if (Array.from(value).length < 12) {
            return "Use at least 12 characters.";
          }
          if (!value.trim()) return "Use more than just whitespace.";
          return "";

        default:
          return "";
      }
    }

    function validateField(field) {
      const message = getError(field);
      document.getElementById(field.id + "-error").textContent = message;
      field.setAttribute("aria-invalid", String(Boolean(message)));
      return !message;
    }

    fields.forEach((field) => {
      field.addEventListener("blur", () => {
        touched.add(field.id);
        validateField(field);
      });

      field.addEventListener("input", () => {
        status.textContent = "";
        if (touched.has(field.id)) validateField(field);
      });
    });

    form.addEventListener("submit", (event) => {
      // No backend is configured; never transmit credentials in this demo.
      event.preventDefault();
      status.textContent = "";

      let firstInvalid = null;
      for (const field of fields) {
        touched.add(field.id);
        if (!validateField(field) && !firstInvalid) firstInvalid = field;
      }

      if (firstInvalid) {
        status.textContent = "Please correct the highlighted fields.";
        firstInvalid.focus();
        return;
      }

      // In production, send originals and normalized forms over HTTPS,
      // repeat validation on the server, and verify email ownership.
      // Syntax validation does not prove that a domain or mailbox exists.
      status.textContent =
        "All fields passed validation. This demo has not created an account or sent your information.";
    });
  </script>
</body>
</html>
