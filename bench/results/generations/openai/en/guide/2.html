<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #172033;
      background: #f1f5f9;
    }
    main {
      width: 100%;
      max-width: 30rem;
      padding: 2rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 8px 32px #17203314;
    }
    h1 { margin: 0 0 .5rem; }
    .intro { margin: 0 0 1.5rem; color: #475569; }
    .field { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: .35rem; font-weight: 600; }
    input {
      width: 100%;
      padding: .75rem;
      font: inherit;
      color: inherit;
      border: 1px solid #64748b;
      border-radius: .4rem;
      background: #fff;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }
    input[aria-invalid="true"] { border: 2px solid #b91c1c; }
    .hint { margin: .35rem 0 0; color: #475569; font-size: .875rem; }
    .error {
      display: block;
      margin-top: .35rem;
      color: #b91c1c;
      font-size: .875rem;
    }
    .error:empty { display: none; }
    button {
      width: 100%;
      padding: .8rem 1rem;
      border: 0;
      border-radius: .4rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #1d4ed8;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    #status { margin: 1rem 0 0; }
    #status:empty { display: none; }
    noscript { display: block; margin-bottom: 1rem; color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p class="intro">All fields are required. This demo validates your details without sending them.</p>

    <noscript>JavaScript is required to validate this demo form.</noscript>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" type="text"
               autocomplete="name" required aria-describedby="name-error">
        <span id="name-error" class="error"></span>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <!-- Text preserves internationalized addresses across browsers. -->
        <input id="email" name="emailOriginal" type="text" inputmode="email"
               autocomplete="email" autocapitalize="none" spellcheck="false"
               required aria-describedby="email-hint email-error">
        <p id="email-hint" class="hint">International addresses, such as 用户@例子.中国, are welcome.</p>
        <span id="email-error" class="error"></span>
      </div>

      <div class="field">
        <label for="website">Website</label>
        <input id="website" name="websiteOriginal" type="url" inputmode="url"
               autocomplete="url" autocapitalize="none" spellcheck="false"
               placeholder="https://example.com" required
               aria-describedby="website-hint website-error">
        <p id="website-hint" class="hint">Include https:// or http://. International domain names are supported.</p>
        <span id="website-error" class="error"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password" required
               aria-describedby="password-hint password-error">
        <p id="password-hint" class="hint">Use at least 12 characters. Spaces and Unicode characters are allowed.</p>
        <span id="password-error" class="error"></span>
      </div>

      <!-- Preserve original inputs separately from normalized values. -->
      <input id="email-normalized" name="emailNormalized" type="hidden">
      <input id="website-normalized" name="websiteNormalized" type="hidden">

      <button type="submit">Sign up</button>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("signup-form");
    const status = document.getElementById("status");
    const emailNormalized = document.getElementById("email-normalized");
    const websiteNormalized = document.getElementById("website-normalized");
    const forbiddenWhitespace = /[\s\u0000-\u001f\u007f-\u009f]/u;

    /*
     * The browser's WHATWG URL parser performs UTS #46 domain-to-ASCII
     * conversion. DNS label limits are checked AFTER that conversion.
     * These checks establish syntax, not domain existence or deliverability.
     */
    function validDNSLabels(hostname) {
      if (!hostname || hostname.length > 253) return false;

      return hostname.split(".").every(label =>
        label.length >= 1 &&
        label.length <= 63 &&
        /^[a-z0-9-]+$/i.test(label) &&
        !label.startsWith("-") &&
        !label.endsWith("-")
      );
    }

    function emailDomainToASCII(domain) {
      // Prevent URL syntax, escaping, or port numbers from entering a domain.
      if (!domain ||
          forbiddenWhitespace.test(domain) ||
          /[\/\\:@?#%\[\]]/u.test(domain)) {
        throw new Error("Invalid domain");
      }

      const hostname = new URL("https://" + domain + "/").hostname.toLowerCase();
      const labels = hostname.split(".");
      const tld = labels[labels.length - 1];

      if (!validDNSLabels(hostname) ||
          labels.length < 2 ||
          !/^(?:[a-z]{2,}|xn--[a-z0-9-]+)$/i.test(tld)) {
        throw new Error("Invalid domain");
      }

      return hostname;
    }

    const fields = [
      {
        input: document.getElementById("full-name"),
        error: document.getElementById("name-error"),
        validate(value) {
          return value.trim() ? "" : "Enter your full name.";
        }
      },
      {
        input: document.getElementById("email"),
        error: document.getElementById("email-error"),
        validate(value) {
          emailNormalized.value = "";
          if (!value) return "Enter your email address.";

          const parts = value.split("@");
          if (parts.length !== 2 || !parts[0] || forbiddenWhitespace.test(parts[0])) {
            return "Use one @, a non-empty local part, and no spaces.";
          }

          try {
            const domain = emailDomainToASCII(parts[1]);
            // Preserve Unicode and case in the local part.
            emailNormalized.value = parts[0] + "@" + domain;
            return "";
          } catch {
            return "Enter an email with a valid domain, such as 用户@例子.中国.";
          }
        }
      },
      {
        input: document.getElementById("website"),
        error: document.getElementById("website-error"),
        validate(value) {
          websiteNormalized.value = "";
          if (!value) return "Enter your website address.";

          if (!/^https?:\/\//i.test(value) ||
              forbiddenWhitespace.test(value) ||
              value.includes("\\")) {
            return "Enter a complete http:// or https:// URL without spaces.";
          }

          try {
            const url = new URL(value);
            if (!["http:", "https:"].includes(url.protocol) || !url.hostname) {
              throw new Error("Invalid URL");
            }

            // The URL parser validates IP literals, including IPv6.
            const isIPv6 = url.hostname.startsWith("[");
            const hostname = url.hostname.replace(/\.$/, "");
            if (!isIPv6 && !validDNSLabels(hostname)) {
              throw new Error("Invalid hostname");
            }

            websiteNormalized.value = url.href;
            return "";
          } catch {
            return "Enter a valid website URL, such as https://société.fr.";
          }
        }
      },
      {
        input: document.getElementById("password"),
        error: document.getElementById("password-error"),
        validate(value) {
          if (!value) return "Enter a password.";
          return Array.from(value).length >= 12
            ? ""
            : "Use at least 12 characters.";
        }
      }
    ];

    function validateField(field) {
      const message = field.validate(field.input.value);
      field.error.textContent = message;
      field.input.setAttribute("aria-invalid", String(Boolean(message)));
      return !message;
    }

    for (const field of fields) {
      field.input.addEventListener("blur", () => validateField(field));

      field.input.addEventListener("input", () => {
        status.textContent = "";
        if (field.input.id === "email") emailNormalized.value = "";
        if (field.input.id === "website") websiteNormalized.value = "";

        if (field.input.hasAttribute("aria-invalid")) {
          validateField(field);
        }
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const invalidFields = fields.filter(field => !validateField(field));

      if (invalidFields.length) {
        status.textContent = "Please correct the highlighted fields.";
        invalidFields[0].input.focus();
        return;
      }

      /*
       * Demo only: nothing is transmitted or persisted.
       * A production endpoint must repeat validation server-side, verify
       * email ownership, and securely hash passwords. Client checks and
       * hidden normalized values must never be trusted by the server.
       */
      status.textContent = "All fields are valid. This demo has not created an account or sent your details.";
    });
  </script>
</body>
</html>
