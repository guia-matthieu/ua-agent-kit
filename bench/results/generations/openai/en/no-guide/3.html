<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f3f5f9;
      color: #172033;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 460px;
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgb(0 0 0 / 8%);
    }

    h1 { margin: 0 0 8px; }
    .intro { margin: 0 0 24px; color: #536078; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #778297;
      border-radius: 6px;
      font: inherit;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    input[aria-invalid="true"] { border: 2px solid #b42318; }

    .hint {
      margin: 6px 0 0;
      color: #536078;
      font-size: 0.875rem;
    }

    .error {
      margin: 6px 0 0;
      color: #b42318;
      font-size: 0.875rem;
    }

    .error:empty { display: none; }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #1e40af; }
    #status { margin: 16px 0 0; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p class="intro">All fields are required.</p>

    <form id="signup-form" method="post" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input
          id="full-name"
          name="fullName"
          type="text"
          autocomplete="name"
          required
          aria-describedby="full-name-error"
          aria-invalid="false"
        >
        <p id="full-name-error" class="error"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          required
          aria-describedby="email-error"
          aria-invalid="false"
        >
        <p id="email-error" class="error"></p>
      </div>

      <div class="field">
        <label for="website">Website</label>
        <input
          id="website"
          name="website"
          type="url"
          autocomplete="url"
          autocapitalize="none"
          spellcheck="false"
          required
          aria-describedby="website-hint website-error"
          aria-invalid="false"
        >
        <p id="website-hint" class="hint">Include http:// or https://, such as https://example.com.</p>
        <p id="website-error" class="error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
          aria-describedby="password-hint password-error"
          aria-invalid="false"
        >
        <p id="password-hint" class="hint">Use at least 8 characters. Spaces are allowed.</p>
        <p id="password-error" class="error"></p>
      </div>

      <button type="submit">Sign up</button>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>

    <noscript>
      <p>JavaScript is required to validate this demonstration form. No account will be created.</p>
      <style>#signup-form { display: none; }</style>
    </noscript>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("signup-form");
    const fields = Array.from(form.querySelectorAll("input"));
    const status = document.getElementById("status");
    const touched = new Set();

    function getError(field) {
      // Never trim or otherwise modify the password.
      const value = field.id === "password"
        ? field.value
        : field.value.trim();

      switch (field.id) {
        case "full-name":
          return value ? "" : "Enter your full name.";

        case "email":
          if (!value) return "Enter your email address.";
          return field.validity.typeMismatch
            ? "Enter a valid email address, such as name@example.com."
            : "";

        case "website":
          if (!value) return "Enter your website address.";
          try {
            const url = new URL(value);
            if (
              !/^https?:\/\//i.test(value) ||
              !["http:", "https:"].includes(url.protocol) ||
              !url.hostname ||
              field.validity.typeMismatch
            ) {
              return "Enter a valid website URL beginning with http:// or https://.";
            }
          } catch {
            return "Enter a valid website URL, such as https://example.com.";
          }
          return "";

        case "password":
          if (!value) return "Enter a password.";
          return value.length < 8
            ? "Your password must contain at least 8 characters."
            : "";

        default:
          return "";
      }
    }

    function validateField(field) {
      const error = getError(field);
      document.getElementById(field.id + "-error").textContent = error;
      field.setAttribute("aria-invalid", String(Boolean(error)));
      return !error;
    }

    fields.forEach((field) => {
      field.addEventListener("blur", () => {
        touched.add(field);
        validateField(field);
      });

      field.addEventListener("input", () => {
        status.textContent = "";
        if (touched.has(field)) validateField(field);
      });
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      status.textContent = "";

      let firstInvalid = null;

      fields.forEach((field) => {
        touched.add(field);
        if (!validateField(field) && !firstInvalid) {
          firstInvalid = field;
        }
      });

      if (firstInvalid) {
        status.textContent = "Please correct the highlighted fields.";
        firstInvalid.focus();
        return;
      }

      // Demo only: no endpoint is configured and no data is transmitted.
      // A real signup endpoint must also validate all fields server-side.
      status.textContent =
        "All fields are valid. This is a demonstration; no data was submitted and no account was created.";
    });
  </script>
</body>
</html>
