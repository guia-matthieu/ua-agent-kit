<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #182230;
      background: #f3f5f9;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .intro {
      margin: 0 0 24px;
      color: #526071;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #8994a3;
      border-radius: 6px;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    input[aria-invalid="true"] {
      border: 2px solid #b42318;
    }

    .hint,
    .error {
      margin: 6px 0 0;
      font-size: 0.875rem;
    }

    .hint {
      color: #526071;
    }

    .error {
      color: #b42318;
    }

    .error:empty {
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #1d4ed8;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    #status {
      margin: 16px 0 0;
      color: #166534;
    }

    #status:empty {
      display: none;
    }

    @media (max-width: 400px) {
      main {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p class="intro">All fields are required.</p>

    <form id="signup-form" method="post">
      <div class="field">
        <label for="full-name">Full name</label>
        <input
          id="full-name"
          name="fullName"
          type="text"
          autocomplete="name"
          required
          aria-describedby="full-name-error"
        >
        <p id="full-name-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          required
          aria-describedby="email-error"
        >
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="website">Website</label>
        <input
          id="website"
          name="website"
          type="url"
          autocomplete="url"
          autocapitalize="none"
          spellcheck="false"
          placeholder="https://example.com"
          required
          aria-describedby="website-hint website-error"
        >
        <p id="website-hint" class="hint">Include https:// or http://.</p>
        <p id="website-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
          aria-describedby="password-hint password-error"
        >
        <p id="password-hint" class="hint">Use at least 12 characters.</p>
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>

      <button id="submit-button" type="submit" disabled>Sign up</button>
      <p id="status" role="status"></p>
    </form>

    <noscript>
      <p>JavaScript is required to validate this signup form.</p>
    </noscript>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("signup-form");
    const status = document.getElementById("status");
    const fields = [
      document.getElementById("full-name"),
      document.getElementById("email"),
      document.getElementById("website"),
      document.getElementById("password")
    ];
    const touchedFields = new Set();

    // Use inline JavaScript validation rather than browser error popups.
    form.noValidate = true;

    function getError(field) {
      const value = field.value;

      switch (field.id) {
        case "full-name":
          return value.trim() ? "" : "Enter your full name.";

        case "email":
          if (!value.trim()) {
            return "Enter your email address.";
          }
          return field.validity.typeMismatch
            ? "Enter a valid email address, such as name@example.com."
            : "";

        case "website":
          if (!value.trim()) {
            return "Enter your website address.";
          }

          try {
            const url = new URL(value.trim());

            if (
              !["http:", "https:"].includes(url.protocol) ||
              !url.hostname ||
              !/^https?:\/\//i.test(value.trim())
            ) {
              return "Enter a valid website URL beginning with https:// or http://.";
            }
          } catch {
            return "Enter a valid website URL, such as https://example.com.";
          }

          return "";

        case "password":
          if (!value) {
            return "Enter a password.";
          }
          return value.length < 12
            ? "Your password must contain at least 12 characters."
            : "";

        default:
          return "";
      }
    }

    function validateField(field) {
      const message = getError(field);
      const error = document.getElementById(field.id + "-error");

      error.textContent = message;

      if (message) {
        field.setAttribute("aria-invalid", "true");
      } else {
        field.removeAttribute("aria-invalid");
      }

      return message === "";
    }

    fields.forEach(function (field) {
      field.addEventListener("blur", function () {
        touchedFields.add(field);
        validateField(field);
      });

      field.addEventListener("input", function () {
        status.textContent = "";

        if (touchedFields.has(field)) {
          validateField(field);
        }
      });
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      status.textContent = "";

      let firstInvalidField = null;

      fields.forEach(function (field) {
        // Preserve passwords exactly as entered.
        if (field.type !== "password") {
          field.value = field.value.trim();
        }

        touchedFields.add(field);

        if (!validateField(field) && !firstInvalidField) {
          firstInvalidField = field;
        }
      });

      if (firstInvalidField) {
        firstInvalidField.focus();
        return;
      }

      // No backend is configured. Real signup requires server-side
      // validation and secure password handling over HTTPS.
      status.textContent =
        "Your details are valid. This demo has not sent or stored them, and no account has been created.";
    });

    document.getElementById("submit-button").disabled = false;
  </script>
</body>
</html>
