<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulaire d’inscription</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      background: #f1f5f9;
      color: #172033;
    }

    main {
      width: 100%;
      max-width: 620px;
      padding: clamp(20px, 5vw, 40px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 36px #17203314;
    }

    h1 { margin: 0 0 8px; }
    .intro { margin: 0 0 28px; color: #475569; }
    .field { margin-bottom: 22px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 250px;
      min-width: 0;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #64748b;
      border-radius: 7px;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    input[aria-invalid="true"] {
      border: 2px solid #b91c1c;
    }

    .hint {
      margin: 6px 0 0;
      font-size: 0.875rem;
      color: #475569;
    }

    .error {
      flex: 1 1 160px;
      font-size: 0.875rem;
      color: #b91c1c;
    }

    .error:empty { display: none; }

    button {
      width: 100%;
      padding: 12px 20px;
      border: 0;
      border-radius: 7px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #1d4ed8;
      cursor: pointer;
    }

    button:hover { background: #1e40af; }

    #status {
      margin: 18px 0 0;
      color: #166534;
      font-weight: 600;
    }

    #status:empty { margin: 0; }

    noscript {
      display: block;
      margin-bottom: 20px;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main>
    <h1>Créer un compte</h1>
    <p class="intro">Tous les champs sont obligatoires.</p>

    <noscript>
      Activez JavaScript pour valider ce formulaire. Aucun envoi n’est effectué sur cette page de démonstration.
    </noscript>

    <form id="registration-form" method="post" novalidate>
      <div class="field">
        <label for="full-name">Nom complet</label>
        <div class="control">
          <input
            id="full-name"
            name="fullName"
            type="text"
            autocomplete="name"
            required
            aria-describedby="full-name-error"
          >
          <span id="full-name-error" class="error" aria-live="polite"></span>
        </div>
      </div>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <div class="control">
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            required
            aria-describedby="email-error"
          >
          <span id="email-error" class="error" aria-live="polite"></span>
        </div>
      </div>

      <div class="field">
        <label for="website">Site web</label>
        <div class="control">
          <input
            id="website"
            name="website"
            type="url"
            autocomplete="url"
            autocapitalize="none"
            spellcheck="false"
            required
            aria-describedby="website-hint website-error"
          >
          <span id="website-error" class="error" aria-live="polite"></span>
        </div>
        <p id="website-hint" class="hint">Adresse complète, par exemple https://exemple.fr.</p>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="control">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            aria-describedby="password-hint password-error"
          >
          <span id="password-error" class="error" aria-live="polite"></span>
        </div>
        <p id="password-hint" class="hint">Au moins 8 caractères. Privilégiez un mot de passe long et unique.</p>
      </div>

      <button id="submit-button" type="submit" disabled>S’inscrire</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("registration-form");
    const status = document.getElementById("status");
    const fields = Array.from(form.querySelectorAll("input"));

    function getError(field) {
      const value = field.type === "password"
        ? field.value
        : field.value.trim();

      if (!value) {
        const requiredMessages = {
          "full-name": "Veuillez saisir votre nom complet.",
          email: "Veuillez saisir votre adresse e-mail.",
          website: "Veuillez saisir l’adresse de votre site web.",
          password: "Veuillez saisir un mot de passe."
        };
        return requiredMessages[field.id];
      }

      switch (field.id) {
        case "email":
          if (field.validity.typeMismatch) {
            return "Veuillez saisir une adresse e-mail valide.";
          }
          break;

        case "website":
          try {
            const url = new URL(value);
            if (
              !["http:", "https:"].includes(url.protocol) ||
              !url.hostname ||
              !/^https?:\/\//i.test(value)
            ) {
              return "Utilisez une adresse valide commençant par http:// ou https://.";
            }
          } catch {
            return "Veuillez saisir une URL valide, par exemple https://exemple.fr.";
          }
          break;

        case "password":
          if (value.length < 8) {
            return "Le mot de passe doit contenir au moins 8 caractères.";
          }
          if (!value.trim()) {
            return "Le mot de passe ne peut pas contenir uniquement des espaces.";
          }
          break;
      }

      return "";
    }

    function validateField(field) {
      const message = getError(field);
      document.getElementById(field.id + "-error").textContent = message;
      field.setAttribute("aria-invalid", message ? "true" : "false");
      return message === "";
    }

    fields.forEach((field) => {
      field.addEventListener("blur", () => {
        if (field.type !== "password") {
          field.value = field.value.trim();
        }
        validateField(field);
      });

      field.addEventListener("input", () => {
        status.textContent = "";
        if (field.getAttribute("aria-invalid") === "true") {
          validateField(field);
        }
      });
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      status.textContent = "";

      let firstInvalidField = null;

      fields.forEach((field) => {
        if (field.type !== "password") {
          field.value = field.value.trim();
        }

        if (!validateField(field) && !firstInvalidField) {
          firstInvalidField = field;
        }
      });

      if (firstInvalidField) {
        firstInvalidField.focus();
        return;
      }

      // Démonstration autonome : aucune donnée n’est transmise ou stockée.
      // Un véritable envoi doit utiliser HTTPS et être également validé côté serveur.
      status.textContent =
        "Formulaire valide ! Cette page de démonstration n’envoie aucune donnée et ne crée aucun compte.";
    });

    document.getElementById("submit-button").disabled = false;
  </script>
</body>
</html>
