<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f7;
    --card: #ffffff;
    --text: #1b1f27;
    --muted: #5d6675;
    --border: #c3c9d4;
    --accent: #2f5bd8;
    --accent-text: #ffffff;
    --error: #b42318;
    --success: #17663a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card: #1c2029;
      --text: #eceef2;
      --muted: #a3acbb;
      --border: #475063;
      --accent: #8eabff;
      --accent-text: #10131a;
      --error: #ff9d92;
      --success: #7fdca4;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main {
    width: 100%;
    max-width: 440px;
    padding: 32px 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    line-height: 1.25;
  }
  .intro {
    margin: 0 0 24px;
    color: var(--muted);
  }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .optional {
    font-weight: 400;
    color: var(--muted);
  }

  input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input:focus-visible,
  button:focus-visible,
  #success:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  input[aria-invalid="true"] {
    border-color: var(--error);
    box-shadow: 0 0 0 1px var(--error);
  }

  .password-row {
    display: flex;
    gap: 8px;
  }
  .password-row input {
    flex: 1;
    min-width: 0;
  }
  .toggle {
    flex: none;
    min-width: 64px;
    padding: 0 12px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }

  .hint,
  .error {
    margin: 6px 0 0;
    font-size: 0.875rem;
  }
  .hint { color: var(--muted); }
  .error {
    color: var(--error);
    font-weight: 600;
  }
  .error::before { content: "\26A0\FE0E\00A0"; }

  .submit {
    width: 100%;
    margin-top: 6px;
    padding: 12px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .submit:hover { filter: brightness(1.08); }

  #success h2 {
    margin: 0 0 8px;
    font-size: 1.25rem;
    color: var(--success);
  }
  #success p { margin: 0; }
</style>
</head>
<body>
<main>
  <!-- The novalidate attribute is added by the script, so the browser's
       built-in validation still works as a fallback if JavaScript is off. -->
  <form id="signup-form" method="post" action="">
    <h1>Create your account</h1>
    <p class="intro">Fill in your details to sign up.</p>

    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" autocomplete="name"
             required maxlength="100" aria-describedby="name-error">
      <p class="error" id="name-error" hidden></p>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email"
             inputmode="email" autocapitalize="off" spellcheck="false"
             required aria-describedby="email-error">
      <p class="error" id="email-error" hidden></p>
    </div>

    <div class="field">
      <label for="website">Website <span class="optional">(optional)</span></label>
      <input type="text" id="website" name="website" autocomplete="url"
             inputmode="url" autocapitalize="off" spellcheck="false"
             placeholder="https://example.com" aria-describedby="website-error">
      <p class="error" id="website-error" hidden></p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-row">
        <input type="password" id="password" name="password"
               autocomplete="new-password" required minlength="8"
               aria-describedby="password-hint password-error">
        <button type="button" class="toggle" id="toggle-password"
                aria-label="Show password" aria-controls="password">Show</button>
      </div>
      <p class="hint" id="password-hint">At least 8 characters, including a letter and a number.</p>
      <p class="error" id="password-error" hidden></p>
    </div>

    <button type="submit" class="submit">Sign up</button>
  </form>

  <div id="success" tabindex="-1" role="status" hidden>
    <h2>Account created</h2>
    <p id="success-text"></p>
  </div>
</main>

<script>
(function () {
  'use strict';

  var form = document.getElementById('signup-form');
  var success = document.getElementById('success');
  var successText = document.getElementById('success-text');
  var toggle = document.getElementById('toggle-password');
  var fields = ['name', 'email', 'website', 'password'].map(function (id) {
    return document.getElementById(id);
  });

  // Use our own validation and messages instead of the browser's bubbles.
  form.noValidate = true;

  // Returns a URL object for a valid http(s) address, or null.
  // A missing scheme is tolerated ("example.com" is read as "https://example.com").
  function parseWebsite(value) {
    var text = value.trim();
    if (!/^https?:\/\//i.test(text)) {
      text = 'https://' + text;
    }
    var url;
    try {
      url = new URL(text);
    } catch (e) {
      return null;
    }
    if (url.username || url.password) {
      return null;
    }
    var labels = url.hostname.split('.');
    var tld = labels[labels.length - 1];
    var hasEmptyLabel = labels.some(function (label) { return label === ''; });
    if (labels.length < 2 || hasEmptyLabel || tld.length < 2 || /^\d+$/.test(tld)) {
      return null;
    }
    return url;
  }

  // Each validator returns an error message, or an empty string when valid.
  var validators = {
    name: function (value) {
      var v = value.trim();
      if (!v) return 'Enter your full name.';
      if (v.length < 2 || !/\p{L}/u.test(v)) return 'Enter a valid name (at least 2 characters).';
      if (v.length > 100) return 'Name must be 100 characters or fewer.';
      return '';
    },
    email: function (value) {
      var v = value.trim();
      if (!v) return 'Enter your email address.';
      if (v.length > 254 || !/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(v)) {
        return 'Enter a valid email address, like name@example.com.';
      }
      return '';
    },
    website: function (value) {
      var v = value.trim();
      if (!v) return ''; // optional field
      if (!parseWebsite(v)) return 'Enter a valid web address, like https://example.com.';
      return '';
    },
    password: function (value) {
      if (!value) return 'Enter a password.';
      if (value.length < 8) return 'Password must be at least 8 characters.';
      if (!/\p{L}/u.test(value) || !/\d/.test(value)) {
        return 'Password must include at least one letter and one number.';
      }
      return '';
    }
  };

  function setError(input, message) {
    var error = document.getElementById(input.id + '-error');
    error.textContent = message;
    error.hidden = !message;
    if (message) {
      input.setAttribute('aria-invalid', 'true');
    } else {
      input.removeAttribute('aria-invalid');
    }
  }

  function validateField(input) {
    var message = validators[input.name](input.value);
    setError(input, message);
    return !message;
  }

  fields.forEach(function (input) {
    // Check a field when the user leaves it, but don't nag about fields
    // they have only tabbed through without typing anything.
    input.addEventListener('blur', function () {
      if (input.value !== '' || input.hasAttribute('aria-invalid')) {
        validateField(input);
      }
    });
    // Once a field shows an error, clear it as soon as the value is fixed.
    input.addEventListener('input', function () {
      if (input.hasAttribute('aria-invalid')) {
        validateField(input);
      }
    });
  });

  toggle.addEventListener('click', function () {
    var password = document.getElementById('password');
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    var firstInvalid = null;
    fields.forEach(function (input) {
      if (!validateField(input) && !firstInvalid) {
        firstInvalid = input;
      }
    });

    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }

    var data = {
      name: form.elements.name.value.trim(),
      email: form.elements.email.value.trim(),
      website: form.elements.website.value.trim(),
      password: form.elements.password.value
    };
    if (data.website && !/^https?:\/\//i.test(data.website)) {
      data.website = 'https://' + data.website;
    }

    // All fields are valid. This page has no backend, so it only shows a
    // confirmation. To send the data for real, replace the lines below with
    // a request to your server, e.g. fetch('/signup', { method: 'POST', ... }),
    // and always repeat the validation on the server.
    successText.textContent =
      'Thanks, ' + data.name.split(/\s+/)[0] + '. We have your details for ' + data.email + '.';
    form.hidden = true;
    success.hidden = false;
    success.focus();
  });
})();
</script>
</body>
</html>
