<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.3rem;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #334155;
    }

    input {
      font-size: 0.95rem;
      padding: 0.75rem 0.9rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.error {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input.error:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-msg {
      font-size: 0.8rem;
      color: #dc2626;
      margin-top: 0.35rem;
      min-height: 1.1rem;
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    .success-alert {
      display: none;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 0.9rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Crear una cuenta</h1>
    <p class="subtitle">Completa el formulario para registrarte.</p>

    <div id="alertSuccess" class="success-alert" role="status" aria-live="polite">
      ¡Registro exitoso! Todos los campos son válidos.
    </div>

    <form id="registroForm" novalidate>
      <div class="form-group">
        <label for="fullName">Nombre completo</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Ej. Juan Pérez" 
          autocomplete="name"
          aria-describedby="fullNameError"
        >
        <span class="error-msg" id="fullNameError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="text" 
          id="email" 
          name="email" 
          inputmode="email"
          placeholder="usuario@ejemplo.com o josé@société.fr" 
          autocomplete="email"
          aria-describedby="emailError"
        >
        <span class="error-msg" id="emailError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="website">Sitio web</label>
        <input 
          type="text" 
          id="website" 
          name="website" 
          inputmode="url"
          placeholder="https://ejemplo.com o société.fr" 
          autocomplete="url"
          aria-describedby="websiteError"
        >
        <span class="error-msg" id="websiteError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Mínimo 8 caracteres" 
          autocomplete="new-password"
          aria-describedby="passwordError"
        >
        <span class="error-msg" id="passwordError" aria-live="polite"></span>
      </div>

      <button type="submit">Registrarse</button>
    </form>
  </main>

  <script>
    (function () {
      const form = document.getElementById('registroForm');
      const alertSuccess = document.getElementById('alertSuccess');

      const fields = {
        fullName: document.getElementById('fullName'),
        email: document.getElementById('email'),
        website: document.getElementById('website'),
        password: document.getElementById('password')
      };

      const errors = {
        fullName: document.getElementById('fullNameError'),
        email: document.getElementById('emailError'),
        website: document.getElementById('websiteError'),
        password: document.getElementById('passwordError')
      };

      function setError(fieldKey, message) {
        fields[fieldKey].classList.add('error');
        errors[fieldKey].textContent = message;
      }

      function clearError(fieldKey) {
        fields[fieldKey].classList.remove('error');
        errors[fieldKey].textContent = '';
      }

      function validateFullName(value) {
        const trimmed = value.trim();
        if (!trimmed) {
          return 'El nombre completo es obligatorio.';
        }
        if (trimmed.length < 3) {
          return 'El nombre debe contener al menos 3 caracteres.';
        }
        return '';
      }

      /**
       * Valida un dominio respetando Universal Acceptance:
       * - Admite U-labels (Unicode) y A-labels (xn--...).
       * - Rechaza etiquetas vacías, puntos consecutivos y guiones al inicio o final.
       * - TLD de 2 o más caracteres sin límite artificial superior.
       */
      function validateDomainLabels(domain) {
        if (!domain) {
          return 'El dominio no puede estar vacío.';
        }
        if (domain.includes('..')) {
          return 'El dominio no puede contener puntos consecutivos.';
        }
        if (domain.startsWith('.') || domain.endsWith('.')) {
          return 'El dominio no puede comenzar ni terminar con un punto.';
        }

        const labels = domain.split('.');
        if (labels.length < 2) {
          return 'El dominio debe contener al menos una extensión (TLD).';
        }

        for (let i = 0; i < labels.length; i++) {
          const label = labels[i];
          if (!label) {
            return 'Las etiquetas del dominio no pueden estar vacías.';
          }
          if (label.length > 63) {
            return 'Ninguna etiqueta del dominio puede exceder los 63 caracteres.';
          }
          if (label.startsWith('-') || label.endsWith('-')) {
            return 'Las etiquetas del dominio no pueden iniciar ni terminar con guion.';
          }
          if (/[ /\\:?#@!$&'()*+,;=~%^[\]{}|"<>]/.test(label)) {
            return 'El dominio contiene caracteres no válidos.';
          }
        }

        const tld = labels[labels.length - 1];
        if (tld.length < 2) {
          return 'La extensión de dominio (TLD) debe tener al menos 2 caracteres.';
        }

        return '';
      }

      /**
       * Validación compatible con Universal Acceptance (RFC 6530/6531):
       * - Permite caracteres Unicode tanto en la parte local como en el dominio.
       * - Rechaza espacios, puntos consecutivos y formatos mal estructurados.
       */
      function validateEmail(raw) {
        if (!raw || raw.trim().length === 0) {
          return 'El correo electrónico es obligatorio.';
        }

        // Rechazar cualquier espacio en blanco en cualquier posición
        if (/\s/.test(raw)) {
          return 'El correo no puede contener espacios en blanco.';
        }

        const trimmed = raw.trim();
        const atParts = trimmed.split('@');
        if (atParts.length !== 2) {
          return 'El correo debe contener exactamente un símbolo "@".';
        }

        const [local, domain] = atParts;

        if (!local) {
          return 'La parte antes del "@" no puede estar vacía.';
        }
        if (local.includes('..')) {
          return 'La dirección no puede tener puntos consecutivos en la parte local.';
        }
        if (local.startsWith('.') || local.endsWith('.')) {
          return 'La parte local no puede comenzar ni terminar con un punto.';
        }

        // Validación estructural del dominio
        const domainError = validateDomainLabels(domain);
        if (domainError) {
          return domainError;
        }

        return '';
      }

      /**
       * Valida URLs rechazando espacios internos y respetando Universal Acceptance.
       */
      function validateWebsite(raw) {
        if (!raw || raw.trim().length === 0) {
          return 'El sitio web es obligatorio.';
        }

        // Rechaza terminantemente cualquier espacio en blanco en la cadena original
        if (/\s/.test(raw)) {
          return 'La dirección web no puede contener espacios en blanco.';
        }

        const trimmed = raw.trim();

        // Extraer protocolo si existe, o usar https por defecto para análisis
        let candidate = trimmed;
        if (!/^https?:\/\//i.test(candidate)) {
          if (candidate.includes('://')) {
            return 'Solo se admiten protocolos http:// o https://.';
          }
          candidate = 'https://' + candidate;
        }

        let parsed;
        try {
          parsed = new URL(candidate);
        } catch {
          return 'El formato de la dirección web no es válido.';
        }

        // Validar que el hostname no esté vacío
        const hostname = parsed.hostname;
        if (!hostname) {
          return 'La dirección web debe contener un nombre de servidor válido.';
        }

        // Validar las etiquetas del hostname
        const domainError = validateDomainLabels(hostname);
        if (domainError) {
          return 'Sitio web no válido: ' + domainError;
        }

        return '';
      }

      function validatePassword(raw) {
        if (!raw) {
          return 'La contraseña es obligatoria.';
        }
        if (raw.length < 8) {
          return 'La contraseña debe tener al menos 8 caracteres.';
        }
        return '';
      }

      function validateField(fieldKey) {
        const val = fields[fieldKey].value;
        let error = '';

        switch (fieldKey) {
          case 'fullName':
            error = validateFullName(val);
            break;
          case 'email':
            error = validateEmail(val);
            break;
          case 'website':
            error = validateWebsite(val);
            break;
          case 'password':
            error = validatePassword(val);
            break;
        }

        if (error) {
          setError(fieldKey, error);
          return false;
        } else {
          clearError(fieldKey);
          return true;
        }
      }

      // Validación en tiempo real
      Object.keys(fields).forEach((key) => {
        fields[key].addEventListener('input', () => {
          if (fields[key].classList.contains('error')) {
            validateField(key);
          }
        });

        fields[key].addEventListener('blur', () => {
          if (fields[key].value.trim() !== '') {
            validateField(key);
          }
        });
      });

      // Envío del formulario
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alertSuccess.style.display = 'none';

        let isValid = true;
        let firstInvalidField = null;

        Object.keys(fields).forEach((key) => {
          const fieldValid = validateField(key);
          if (!fieldValid) {
            isValid = false;
            if (!firstInvalidField) {
              firstInvalidField = fields[key];
            }
          }
        });

        if (isValid) {
          alertSuccess.style.display = 'block';
          form.reset();
          Object.keys(fields).forEach(clearError);
        } else if (firstInvalidField) {
          firstInvalidField.focus();
        }
      });
    })();
  </script>
</body>
</html>
