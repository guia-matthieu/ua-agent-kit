<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111827;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-message {
      font-size: 0.8rem;
      color: #dc2626;
      margin-top: 0.35rem;
      min-height: 1.1rem;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .success-alert {
      display: none;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Ingresa tus datos para registrarte en la plataforma.</p>

    <div id="successMessage" class="success-alert" role="alert">
      ¡Registro completado con éxito!
    </div>

    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="fullName">Nombre completo</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          autocomplete="name"
          aria-describedby="fullNameError"
          placeholder="Ej. María Dupont"
        >
        <span id="fullNameError" class="error-message" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="text" 
          id="email" 
          name="email" 
          inputmode="email"
          autocomplete="email"
          aria-describedby="emailError"
          placeholder="ejemplo@dominio.com o josé@société.fr"
        >
        <span id="emailError" class="error-message" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="website">Sitio web</label>
        <input 
          type="text" 
          id="website" 
          name="website" 
          inputmode="url"
          autocomplete="url"
          aria-describedby="websiteError"
          placeholder="https://ejemplo.com o https://société.fr"
        >
        <span id="websiteError" class="error-message" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          autocomplete="new-password"
          aria-describedby="passwordError"
          placeholder="Mínimo 8 caracteres"
        >
        <span id="passwordError" class="error-message" role="alert"></span>
      </div>

      <button type="submit">Registrarse</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const successMessage = document.getElementById('successMessage');

    // Validador de etiqueta de dominio compatible con Universal Acceptance (Unicode y Punycode)
    const domainLabelRegex = /^[\p{L}\p{N}](?:[\p{L}\p{N}-]*[\p{L}\p{N}])?$/u;

    function validateDomain(domain) {
      if (!domain) return 'Falta la parte del dominio.';
      if (domain.startsWith('.') || domain.endsWith('.')) {
        return 'El dominio no puede iniciar ni terminar con un punto.';
      }
      if (domain.includes('..')) {
        return 'El dominio no puede contener puntos consecutivos.';
      }

      const labels = domain.split('.');
      if (labels.length < 2) {
        return 'El dominio debe contener al menos un punto y una extensión (TLD).';
      }

      for (const label of labels) {
        if (!label) {
          return 'Las etiquetas del dominio no pueden estar vacías.';
        }
        if (label.length > 63) {
          return 'Cada etiqueta del dominio debe tener como máximo 63 caracteres.';
        }
        if (!domainLabelRegex.test(label)) {
          return `La etiqueta "${label}" contiene caracteres inválidos o inicia/termina con guion.`;
        }
      }

      const tld = labels[labels.length - 1];
      if (tld.length < 2) {
        return 'El dominio de nivel superior (TLD) debe tener al menos 2 caracteres.';
      }
      if (/^\p{N}+$/u.test(tld)) {
        return 'El dominio de nivel superior (TLD) no puede ser totalmente numérico.';
      }

      return null;
    }

    const fields = {
      fullName: {
        input: document.getElementById('fullName'),
        error: document.getElementById('fullNameError'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return 'El nombre completo es obligatorio.';
          if (val.length < 2) return 'El nombre debe tener al menos 2 caracteres.';
          return null;
        }
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('emailError'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return 'La dirección de correo electrónico es obligatoria.';
          if (/\s/.test(val)) return 'El correo electrónico no puede contener espacios en blanco.';

          const atCount = (val.match(/@/g) || []).length;
          if (atCount !== 1) {
            return 'El correo debe contener exactamente un símbolo "@".';
          }

          const [localPart, domainPart] = val.split('@');

          if (!localPart) return 'Falta la parte del usuario antes de "@".';
          if (localPart.length > 64) return 'La parte del usuario no puede superar los 64 caracteres.';
          if (localPart.startsWith('.') || localPart.endsWith('.')) {
            return 'La parte del usuario no puede comenzar ni terminar con un punto.';
          }
          if (localPart.includes('..')) {
            return 'La parte del usuario no puede contener puntos consecutivos.';
          }

          // Validación del dominio (Universal Acceptance: IDN, A-labels, nuevos TLDs)
          return validateDomain(domainPart);
        }
      },
      website: {
        input: document.getElementById('website'),
        error: document.getElementById('websiteError'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return 'La dirección del sitio web es obligatoria.';
          if (/\s/.test(val)) return 'La dirección del sitio web no puede contener espacios en blanco.';

          let urlToParse = val;
          if (!/^https?:\/\//i.test(urlToParse)) {
            if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(urlToParse)) {
              return 'El protocolo debe ser HTTP o HTTPS.';
            }
            urlToParse = 'https://' + urlToParse;
          }

          let parsedUrl;
          try {
            parsedUrl = new URL(urlToParse);
          } catch (e) {
            return 'Ingresa una URL válida (ej. https://ejemplo.com).';
          }

          if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
            return 'El protocolo debe ser HTTP o HTTPS.';
          }

          // Validar el hostname para evitar dominios defectuosos como "exa..com"
          const hostname = parsedUrl.hostname;
          if (!hostname) return 'La URL debe incluir un nombre de host válido.';

          return validateDomain(hostname);
        }
      },
      password: {
        input: document.getElementById('password'),
        error: document.getElementById('passwordError'),
        validate: (value) => {
          if (!value) return 'La contraseña es obligatoria.';
          if (value.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
          return null;
        }
      }
    };

    function validateField(name) {
      const field = fields[name];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.input.classList.add('invalid');
        field.error.textContent = errorMessage;
        field.error.classList.add('visible');
        return false;
      } else {
        field.input.classList.remove('invalid');
        field.error.textContent = '';
        field.error.classList.remove('visible');
        return true;
      }
    }

    Object.keys(fields).forEach((fieldName) => {
      const field = fields[fieldName];
      field.input.addEventListener('blur', () => validateField(fieldName));
      field.input.addEventListener('input', () => {
        if (field.input.classList.contains('invalid')) {
          validateField(fieldName);
        }
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successMessage.style.display = 'none';

      let isValid = true;
      let firstInvalidInput = null;

      Object.keys(fields).forEach((fieldName) => {
        const isFieldValid = validateField(fieldName);
        if (!isFieldValid) {
          isValid = false;
          if (!firstInvalidInput) {
            firstInvalidInput = fields[fieldName].input;
          }
        }
      });

      if (isValid) {
        successMessage.style.display = 'block';
        form.reset();
        Object.keys(fields).forEach((fieldName) => {
          fields[fieldName].input.classList.remove('invalid');
          fields[fieldName].error.classList.remove('visible');
        });
      } else if (firstInvalidInput) {
        firstInvalidInput.focus();
      }
    });
  </script>
</body>
</html>
