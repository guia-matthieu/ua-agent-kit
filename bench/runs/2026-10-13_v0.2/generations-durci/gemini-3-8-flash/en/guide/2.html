<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111827;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-message {
      display: none;
      font-size: 0.8125rem;
      color: #dc2626;
      margin-top: 0.375rem;
      line-height: 1.3;
    }

    .error-message.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background-color 0.15s ease;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .success-banner {
      display: none;
      padding: 1rem;
      background-color: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      border-radius: 0.375rem;
      margin-bottom: 1.25rem;
      font-size: 0.925rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Please fill in your details to get started.</p>

    <div id="success-banner" class="success-banner" role="status">
      Registration successful! Welcome aboard.
    </div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Jane Doe" 
          autocomplete="name"
          aria-describedby="fullName-error"
        >
        <div id="fullName-error" class="error-message" role="alert"></div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <!-- type="text" with inputmode="email" enables internationalized email input (RFC 6531) -->
        <input 
          type="text" 
          id="email" 
          name="email" 
          inputmode="email"
          placeholder="jane@example.com or josé@société.fr" 
          autocomplete="email"
          aria-describedby="email-error"
        >
        <div id="email-error" class="error-message" role="alert"></div>
      </div>

      <div class="form-group">
        <label for="website">Website</label>
        <input 
          type="text" 
          id="website" 
          name="website" 
          placeholder="https://example.com or https://société.fr" 
          autocomplete="url"
          aria-describedby="website-error"
        >
        <div id="website-error" class="error-message" role="alert"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="At least 8 characters" 
          autocomplete="new-password"
          aria-describedby="password-error"
        >
        <div id="password-error" class="error-message" role="alert"></div>
      </div>

      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const successBanner = document.getElementById('success-banner');

    function validateDomainLabels(domain) {
      if (domain.startsWith('.') || domain.endsWith('.')) {
        return 'Domain cannot start or end with a dot.';
      }
      if (domain.includes('..')) {
        return 'Domain cannot contain consecutive dots.';
      }

      const labels = domain.split('.');
      if (labels.length < 2) {
        return 'Domain must include at least two labels (e.g. name.tld).';
      }

      for (const label of labels) {
        if (!label) {
          return 'Domain labels cannot be empty.';
        }
        if (label.startsWith('-') || label.endsWith('-')) {
          return 'Domain labels cannot start or end with a hyphen.';
        }
        if (label.length > 63) {
          return 'Domain labels cannot exceed 63 characters.';
        }
      }

      const tld = labels[labels.length - 1];
      if (tld.length < 2) {
        return 'Top-level domain must be at least 2 characters.';
      }
      if (/^\d+$/.test(tld)) {
        return 'Top-level domain cannot be purely numeric.';
      }

      return '';
    }

    const fields = {
      fullName: {
        input: document.getElementById('fullName'),
        error: document.getElementById('fullName-error'),
        validate(value) {
          const trimmed = value.trim();
          if (!trimmed) {
            return 'Please enter your full name.';
          }
          if (trimmed.length < 2) {
            return 'Full name must be at least 2 characters.';
          }
          return '';
        }
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('email-error'),
        validate(value) {
          const trimmed = value.trim();
          if (!trimmed) {
            return 'Please enter your email address.';
          }
          if (/\s/.test(trimmed)) {
            return 'Email address cannot contain spaces.';
          }

          const parts = trimmed.split('@');
          if (parts.length !== 2) {
            return 'Email must contain exactly one "@" symbol.';
          }

          const [localPart, domainPart] = parts;

          if (!localPart) {
            return 'Email username cannot be empty.';
          }
          if (localPart.startsWith('.') || localPart.endsWith('.')) {
            return 'Email username cannot start or end with a dot.';
          }
          if (localPart.includes('..')) {
            return 'Email username cannot contain consecutive dots.';
          }

          if (!domainPart) {
            return 'Email domain cannot be empty.';
          }

          const domainError = validateDomainLabels(domainPart);
          if (domainError) {
            return domainError;
          }

          return '';
        }
      },
      website: {
        input: document.getElementById('website'),
        error: document.getElementById('website-error'),
        validate(value) {
          const trimmed = value.trim();
          if (!trimmed) {
            return 'Please enter your website URL.';
          }
          if (/\s/.test(trimmed)) {
            return 'Website URL cannot contain spaces.';
          }

          if (!/^https?:\/\//i.test(trimmed)) {
            return 'Website URL must begin with http:// or https://.';
          }

          let parsedUrl;
          try {
            parsedUrl = new URL(trimmed);
          } catch {
            return 'Please enter a valid URL.';
          }

          if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
            return 'Website URL must use http:// or https://.';
          }

          const hostname = parsedUrl.hostname;
          if (!hostname) {
            return 'Website URL must include a valid hostname.';
          }

          // Strip enclosing IPv6 brackets if present
          if (hostname.startsWith('[') && hostname.endsWith(']')) {
            return '';
          }

          const domainError = validateDomainLabels(hostname);
          if (domainError) {
            return domainError;
          }

          return '';
        }
      },
      password: {
        input: document.getElementById('password'),
        error: document.getElementById('password-error'),
        validate(value) {
          if (!value) {
            return 'Please enter a password.';
          }
          if (value.length < 8) {
            return 'Password must be at least 8 characters long.';
          }
          return '';
        }
      }
    };

    function validateField(name) {
      const field = fields[name];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.input.classList.add('invalid');
        field.input.setAttribute('aria-invalid', 'true');
        field.error.textContent = errorMessage;
        field.error.classList.add('visible');
        return false;
      } else {
        field.input.classList.remove('invalid');
        field.input.removeAttribute('aria-invalid');
        field.error.textContent = '';
        field.error.classList.remove('visible');
        return true;
      }
    }

    Object.keys(fields).forEach((name) => {
      const field = fields[name];
      field.input.addEventListener('input', () => {
        if (field.input.classList.contains('invalid')) {
          validateField(name);
        }
      });
      field.input.addEventListener('blur', () => {
        validateField(name);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successBanner.style.display = 'none';

      let isFormValid = true;
      let firstInvalidInput = null;

      Object.keys(fields).forEach((name) => {
        const isValid = validateField(name);
        if (!isValid) {
          isFormValid = false;
          if (!firstInvalidInput) {
            firstInvalidInput = fields[name].input;
          }
        }
      });

      if (!isFormValid) {
        firstInvalidInput.focus();
      } else {
        successBanner.style.display = 'block';
        form.reset();
      }
    });
  </script>
</body>
</html>
