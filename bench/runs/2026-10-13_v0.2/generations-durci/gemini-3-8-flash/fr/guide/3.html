<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #1a202c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    p.subtitle {
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: #334155;
    }

    input {
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-message {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.35rem;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .success-alert {
      display: none;
      background-color: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Créer un compte</h1>
    <p class="subtitle">Remplissez les informations ci-dessous pour vous inscrire.</p>

    <form id="registration-form" novalidate>
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="ex. Marie Curie">
        <span class="error-message" id="error-name" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="text" id="email" name="email" inputmode="email" autocomplete="email" placeholder="ex. marie@société.corsica">
        <span class="error-message" id="error-email" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="website">Site web</label>
        <input type="text" id="website" name="website" inputmode="url" autocomplete="url" placeholder="ex. https://société.corsica">
        <span class="error-message" id="error-website" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="8 caractères minimum">
        <span class="error-message" id="error-password" aria-live="polite"></span>
      </div>

      <button type="submit">S'inscrire</button>
    </form>

    <div class="success-alert" id="success-alert" role="status">
      Inscription réussie !
    </div>
  </main>

  <script>
    const form = document.getElementById('registration-form');
    const successAlert = document.getElementById('success-alert');

    function validateDomainLabels(domain) {
      if (!domain) return "Le nom de domaine est manquant.";
      if (domain.startsWith('.') || domain.endsWith('.')) {
        return "Le nom de domaine ne peut pas commencer ou se terminer par un point.";
      }
      if (domain.includes('..')) {
        return "Le nom de domaine ne peut pas contenir de points consécutifs.";
      }

      const labels = domain.split('.');
      if (labels.length < 2) {
        return "Le nom de domaine doit comporter au moins un sous-domaine et une extension.";
      }

      for (const label of labels) {
        if (label.length === 0 || label.length > 63) {
          return "Chaque élément du domaine doit comporter entre 1 et 63 caractères.";
        }
        if (label.startsWith('-') || label.endsWith('-')) {
          return "Un élément du domaine ne peut pas commencer ou se terminer par un tiret.";
        }
      }

      const tld = labels[labels.length - 1];
      if (tld.length < 2) {
        return "L'extension du domaine (TLD) doit comporter au moins 2 caractères.";
      }
      if (/^\d+$/.test(tld)) {
        return "L'extension du domaine ne peut pas être uniquement numérique.";
      }

      return '';
    }

    const fields = {
      name: {
        input: document.getElementById('name'),
        error: document.getElementById('error-name'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return "Le nom complet est requis.";
          if (val.length < 2) return "Le nom doit contenir au moins 2 caractères.";
          return "";
        }
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('error-email'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return "L'adresse e-mail est requise.";
          if (/\s/.test(val)) return "L'adresse e-mail ne doit pas contenir d'espaces.";

          const atIndex = val.indexOf('@');
          if (atIndex === -1 || atIndex !== val.lastIndexOf('@')) {
            return "L'adresse e-mail doit comporter exactement un symbole '@'.";
          }

          const local = val.slice(0, atIndex);
          const domain = val.slice(atIndex + 1);

          if (!local) return "La partie locale de l'e-mail est requise.";
          if (local.startsWith('.') || local.endsWith('.')) {
            return "La partie locale ne peut pas commencer ou se terminer par un point.";
          }
          if (local.includes('..')) {
            return "La partie locale ne peut pas contenir de points consécutifs.";
          }

          return validateDomainLabels(domain);
        }
      },
      website: {
        input: document.getElementById('website'),
        error: document.getElementById('error-website'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return "L'URL du site web est requise.";
          if (/\s/.test(val)) return "L'URL ne doit pas contenir d'espaces.";

          let url;
          try {
            url = new URL(val);
          } catch {
            return "Veuillez saisir une URL valide (ex. https://exemple.fr).";
          }

          if (url.protocol !== 'http:' && url.protocol !== 'https:') {
            return "L'URL doit commencer par http:// ou https://";
          }

          return validateDomainLabels(url.hostname);
        }
      },
      password: {
        input: document.getElementById('password'),
        error: document.getElementById('error-password'),
        validate: (value) => {
          if (!value) return "Le mot de passe est requis.";
          if (value.length < 8) return "Le mot de passe doit comporter au moins 8 caractères.";
          return "";
        }
      }
    };

    function validateField(key) {
      const field = fields[key];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.input.classList.add('invalid');
        field.error.textContent = errorMessage;
        field.error.classList.add('visible');
        return false;
      } else {
        field.input.classList.remove('invalid');
        field.error.textContent = '';
        field.error.classList.remove('visible');
        return true;
      }
    }

    Object.keys(fields).forEach(key => {
      const field = fields[key];
      field.input.addEventListener('input', () => {
        if (field.input.classList.contains('invalid')) {
          validateField(key);
        }
      });
      field.input.addEventListener('blur', () => {
        validateField(key);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successAlert.style.display = 'none';

      let isValid = true;
      let firstInvalid = null;

      Object.keys(fields).forEach(key => {
        const fieldValid = validateField(key);
        if (!fieldValid) {
          isValid = false;
          if (!firstInvalid) {
            firstInvalid = fields[key].input;
          }
        }
      });

      if (isValid) {
        successAlert.style.display = 'block';
        form.reset();
        Object.keys(fields).forEach(key => {
          fields[key].input.classList.remove('invalid');
          fields[key].error.classList.remove('visible');
        });
      } else if (firstInvalid) {
        firstInvalid.focus();
      }
    });
  </script>
</body>
</html>
