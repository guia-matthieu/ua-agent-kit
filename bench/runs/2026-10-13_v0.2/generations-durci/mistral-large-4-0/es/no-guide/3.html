<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        input.error {
            border-color: #f44336;
            background-color: #ffebee;
        }

        input.success {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }

        .error-message {
            color: #f44336;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crear Cuenta</h1>

        <div id="formAlert" class="alert"></div>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Nombre Completo</label>
                <input type="text" id="fullName" name="fullName" placeholder="Ej: Juan Pérez García" autocomplete="name">
                <div id="fullNameError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email">
                <div id="emailError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="website">Sitio Web (opcional)</label>
                <input type="url" id="website" name="website" placeholder="https://www.ejemplo.com" autocomplete="url">
                <div id="websiteError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                <div id="passwordError" class="error-message"></div>
                <div class="hint">Debe contener al menos 8 caracteres, una mayúscula, una minúscula y un número.</div>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            clearErrors();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();
            const password = document.getElementById('password').value;

            let isValid = true;

            // Validación de nombre completo
            if (!fullName) {
                showError('fullName', 'El nombre completo es obligatorio.');
                isValid = false;
            } else if (fullName.length < 3) {
                showError('fullName', 'El nombre debe tener al menos 3 caracteres.');
                isValid = false;
            } else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(fullName)) {
                showError('fullName', 'El nombre solo puede contener letras y espacios.');
                isValid = false;
            } else if (fullName.split(/\s+/).filter(word => word.length > 0).length < 2) {
                showError('fullName', 'Por favor ingresa nombre y apellido.');
                isValid = false;
            } else {
                showSuccess('fullName');
            }

            // Validación de email (estricta)
            if (!email) {
                showError('email', 'El correo electrónico es obligatorio.');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('email', 'Por favor ingresa un correo electrónico válido (sin puntos consecutivos ni espacios).');
                isValid = false;
            } else {
                showSuccess('email');
            }

            // Validación de sitio web (estricta)
            if (website) {
                if (!isValidURL(website)) {
                    showError('website', 'Por favor ingresa una URL válida sin espacios (ej: https://ejemplo.com).');
                    isValid = false;
                } else {
                    showSuccess('website');
                }
            }

            // Validación de contraseña
            if (!password) {
                showError('password', 'La contraseña es obligatoria.');
                isValid = false;
            } else if (password.length < 8) {
                showError('password', 'La contraseña debe tener al menos 8 caracteres.');
                isValid = false;
            } else if (!/[A-Z]/.test(password)) {
                showError('password', 'La contraseña debe contener al menos una letra mayúscula.');
                isValid = false;
            } else if (!/[a-z]/.test(password)) {
                showError('password', 'La contraseña debe contener al menos una letra minúscula.');
                isValid = false;
            } else if (!/[0-9]/.test(password)) {
                showError('password', 'La contraseña debe contener al menos un número.');
                isValid = false;
            } else {
                showSuccess('password');
            }

            const alertDiv = document.getElementById('formAlert');

            if (isValid) {
                alertDiv.className = 'alert alert-success show';
                alertDiv.textContent = '¡Registro exitoso! Todos los campos son válidos.';
            } else {
                alertDiv.className = 'alert alert-error show';
                alertDiv.textContent = 'Por favor corrige los errores en el formulario.';
                const firstError = document.querySelector('.error');
                if (firstError) {
                    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstError.focus();
                }
            }
        });

        function isValidEmail(email) {
            // Rechazar si contiene espacios en blanco
            if (/\s/.test(email)) return false;

            // Debe tener exactamente un @
            const parts = email.split('@');
            if (parts.length !== 2) return false;

            const localPart = parts[0];
            const domain = parts[1];

            // Validar parte local (antes del @)
            if (!localPart || localPart.length > 64) return false;
            if (localPart.startsWith('.') || localPart.endsWith('.')) return false;
            if (localPart.includes('..')) return false;
            if (!/^[a-zA-Z0-9._%+-]+$/.test(localPart)) return false;

            // Validar dominio (después del @)
            if (!domain || domain.length > 255) return false;
            if (domain.startsWith('.') || domain.endsWith('.')) return false;
            if (domain.startsWith('-') || domain.endsWith('-')) return false;
            if (domain.includes('..')) return false;

            // El dominio debe tener al menos un punto (para separar subdominio de TLD)
            if (!domain.includes('.')) return false;

            // Dividir el dominio en etiquetas
            const domainParts = domain.split('.');
            if (domainParts.length < 2) return false;

            // Validar cada etiqueta del dominio
            for (const part of domainParts) {
                if (!part || part.length > 63) return false;
                if (part.startsWith('-') || part.endsWith('-')) return false;
                if (!/^[a-zA-Z0-9-]+$/.test(part)) return false;
            }

            // El TLD (última parte) debe ser alfabético y tener al menos 2 caracteres
            const tld = domainParts[domainParts.length - 1];
            if (!/^[a-zA-Z]{2,}$/.test(tld)) return false;

            return true;
        }

        function isValidURL(string) {
            // Rechazar inmediatamente si contiene espacios en blanco (incluyendo tabs, etc.)
            if (/\s/.test(string)) return false;

            // Rechazar si contiene caracteres de control
            if (/[\x00-\x1f\x7f]/.test(string)) return false;

            try {
                // Normalizar: agregar protocolo si falta
                let normalizedUrl = string;
                if (!/^https?:\/\//i.test(normalizedUrl)) {
                    normalizedUrl = 'http://' + normalizedUrl;
                }

                const url = new URL(normalizedUrl);

                // Validar protocolo (solo http o https)
                if (url.protocol !== 'http:' && url.protocol !== 'https:') return false;

                // Validar que tenga hostname
                if (!url.hostname || url.hostname.length === 0) return false;

                // Rechazar si el hostname es solo puntos o vacío
                if (url.hostname === '.' || url.hostname === '..' || url.hostname === '') return false;

                // Rechazar si el hostname contiene puntos consecutivos
                if (url.hostname.includes('..')) return false;

                // Rechazar si el hostname termina en punto
                if (url.hostname.endsWith('.')) return false;

                // Validar que el hostname tenga estructura de dominio válida (al menos un punto para TLD)
                // Excepción: permitir localhost para desarrollo si se desea, pero aquí exigimos dominio real
                if (!url.hostname.includes('.')) {
                    // Si es localhost o IP, podría ser válido, pero para este formulario exigimos dominio con TLD
                    return false;
                }

                // Validar cada etiqueta del hostname
                const hostnameParts = url.hostname.split('.');
                for (const part of hostnameParts) {
                    if (!part || part.length === 0) return false;
                    if (part.startsWith('-') || part.endsWith('-')) return false;
                    // Permitir letras, números, guiones y puntos (pero no puntos consecutivos ya validado arriba)
                    if (!/^[a-zA-Z0-9-]+$/.test(part)) return false;
                }

                // El TLD debe ser alfabético (no numérico puro) y tener al menos 2 caracteres
                const tld = hostnameParts[hostnameParts.length - 1];
                if (!/^[a-zA-Z]{2,}$/.test(tld)) return false;

                return true;
            } catch (_) {
                return false;
            }
        }

        function showError(fieldId, message) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + 'Error');

            input.classList.add('error');
            input.classList.remove('success');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function showSuccess(fieldId) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + 'Error');

            input.classList.remove('error');
            input.classList.add('success');
            errorDiv.classList.remove('show');
        }

        function clearErrors() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.classList.remove('error', 'success');
            });

            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(msg => {
                msg.classList.remove('show');
                msg.textContent = '';
            });

            document.getElementById('formAlert').className = 'alert';
        }
    </script>
</body>
</html>
