<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        input.error {
            border-color: #f44336;
            background-color: #ffebee;
        }

        input.success {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }

        .error-message {
            color: #f44336;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crear Cuenta</h1>

        <div id="formAlert" class="alert"></div>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Nombre Completo</label>
                <input type="text" id="fullName" name="fullName" placeholder="Ej: Juan Pérez García" autocomplete="name">
                <div id="fullNameError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email">
                <div id="emailError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="website">Sitio Web (opcional)</label>
                <input type="url" id="website" name="website" placeholder="https://www.ejemplo.com" autocomplete="url">
                <div id="websiteError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                <div id="passwordError" class="error-message"></div>
                <div class="hint">Debe contener al menos 8 caracteres, una mayúscula, una minúscula y un número.</div>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            clearErrors();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();
            const password = document.getElementById('password').value;

            let isValid = true;

            if (!fullName) {
                showError('fullName', 'El nombre completo es obligatorio.');
                isValid = false;
            } else if (fullName.length < 3) {
                showError('fullName', 'El nombre debe tener al menos 3 caracteres.');
                isValid = false;
            } else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(fullName)) {
                showError('fullName', 'El nombre solo puede contener letras y espacios.');
                isValid = false;
            } else if (fullName.split(/\s+/).length < 2) {
                showError('fullName', 'Por favor ingresa nombre y apellido.');
                isValid = false;
            } else {
                showSuccess('fullName');
            }

            if (!email) {
                showError('email', 'El correo electrónico es obligatorio.');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('email', 'Por favor ingresa un correo electrónico válido.');
                isValid = false;
            } else {
                showSuccess('email');
            }

            if (website) {
                if (!isValidURL(website)) {
                    showError('website', 'Por favor ingresa una URL válida (ej: https://ejemplo.com).');
                    isValid = false;
                } else {
                    showSuccess('website');
                }
            }

            if (!password) {
                showError('password', 'La contraseña es obligatoria.');
                isValid = false;
            } else if (password.length < 8) {
                showError('password', 'La contraseña debe tener al menos 8 caracteres.');
                isValid = false;
            } else if (!/[A-Z]/.test(password)) {
                showError('password', 'La contraseña debe contener al menos una letra mayúscula.');
                isValid = false;
            } else if (!/[a-z]/.test(password)) {
                showError('password', 'La contraseña debe contener al menos una letra minúscula.');
                isValid = false;
            } else if (!/[0-9]/.test(password)) {
                showError('password', 'La contraseña debe contener al menos un número.');
                isValid = false;
            } else {
                showSuccess('password');
            }

            const alertDiv = document.getElementById('formAlert');

            if (isValid) {
                alertDiv.className = 'alert alert-success show';
                alertDiv.textContent = '¡Registro exitoso! Todos los campos son válidos.';
            } else {
                alertDiv.className = 'alert alert-error show';
                alertDiv.textContent = 'Por favor corrige los errores en el formulario.';
                const firstError = document.querySelector('.error');
                if (firstError) {
                    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function isValidURL(string) {
            try {
                if (!/^https?:\/\//i.test(string)) {
                    string = 'http://' + string;
                }
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function showError(fieldId, message) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + 'Error');

            input.classList.add('error');
            input.classList.remove('success');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function showSuccess(fieldId) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + 'Error');

            input.classList.remove('error');
            input.classList.add('success');
            errorDiv.classList.remove('show');
        }

        function clearErrors() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.classList.remove('error', 'success');
            });

            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(msg => {
                msg.classList.remove('show');
                msg.textContent = '';
            });

            document.getElementById('formAlert').className = 'alert';
        }
    </script>
</body>
</html>
