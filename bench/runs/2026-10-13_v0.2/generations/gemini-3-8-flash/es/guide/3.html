<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: #111827;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #374151;
    }

    input {
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.35rem;
      min-height: 1.2em;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    .success-alert {
      display: none;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Completa el formulario para registrarte.</p>

    <div id="successMessage" class="success-alert" role="alert">
      ¡Registro completado con éxito!
    </div>

    <!-- novalidate desactiva la validación nativa para evitar que bloquee correos internacionales válidos -->
    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="fullName">Nombre completo</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Ej. Ana Pérez"
          autocomplete="name"
        >
        <span class="error-msg" id="fullNameError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Dirección de correo electrónico</label>
        <!-- type="text" con inputmode="email" permite caracteres internacionales (RFC 6531) sin restricciones del navegador -->
        <input 
          type="text" 
          id="email" 
          name="email" 
          inputmode="email" 
          placeholder="Ej. josé.dupont@société.fr"
          autocomplete="email"
        >
        <span class="error-msg" id="emailError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="website">Sitio web</label>
        <input 
          type="text" 
          id="website" 
          name="website" 
          placeholder="https://ejemplo.com o https://société.fr"
          autocomplete="url"
        >
        <span class="error-msg" id="websiteError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password"
        >
        <span class="error-msg" id="passwordError" aria-live="polite"></span>
      </div>

      <button type="submit">Registrarse</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const successMsg = document.getElementById('successMessage');

    const fields = {
      fullName: {
        input: document.getElementById('fullName'),
        error: document.getElementById('fullNameError'),
        validate: (value) => {
          if (!value.trim()) return 'El nombre completo es obligatorio.';
          if (value.trim().length < 2) return 'El nombre debe tener al menos 2 caracteres.';
          return '';
        }
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('emailError'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return 'El correo electrónico es obligatorio.';

          // Universal Acceptance: Soporta local-parts con Unicode (RFC 6531) y TLDs largos / IDN
          const parts = val.split('@');
          if (parts.length !== 2) {
            return 'El correo debe tener un único signo "@".';
          }

          const [localPart, domainPart] = parts;
          if (!localPart || /\s/.test(localPart)) {
            return 'La parte local del correo no es válida o contiene espacios.';
          }

          if (!domainPart || /\s/.test(domainPart)) {
            return 'El dominio no es válido o contiene espacios.';
          }

          const domainLabels = domainPart.split('.');
          if (domainLabels.length < 2) {
            return 'El dominio debe contener al menos un punto.';
          }

          const tld = domainLabels[domainLabels.length - 1];
          if (tld.length < 2) {
            return 'La extensión de dominio (TLD) debe tener al menos 2 caracteres.';
          }

          for (const label of domainLabels) {
            if (!label || label.startsWith('-') || label.endsWith('-')) {
              return 'Las etiquetas del dominio contienen caracteres o guiones inválidos.';
            }
          }

          return '';
        }
      },
      website: {
        input: document.getElementById('website'),
        error: document.getElementById('websiteError'),
        validate: (value) => {
          const val = value.trim();
          if (!val) return 'La dirección del sitio web es obligatoria.';

          let url;
          try {
            url = new URL(val);
          } catch {
            return 'Debe ser una URL válida, incluyendo protocolo (ej. https://ejemplo.com).';
          }

          if (url.protocol !== 'http:' && url.protocol !== 'https:') {
            return 'El protocolo debe ser http:// o https://.';
          }

          if (!url.hostname || !url.hostname.includes('.')) {
            return 'El nombre de dominio debe contener una extensión válida.';
          }

          return '';
        }
      },
      password: {
        input: document.getElementById('password'),
        error: document.getElementById('passwordError'),
        validate: (value) => {
          if (!value) return 'La contraseña es obligatoria.';
          if (value.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
          return '';
        }
      }
    };

    function validateField(key) {
      const field = fields[key];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.input.classList.add('invalid');
        field.error.textContent = errorMessage;
        field.error.classList.add('visible');
        return false;
      } else {
        field.input.classList.remove('invalid');
        field.error.textContent = '';
        field.error.classList.remove('visible');
        return true;
      }
    }

    // Validación interactiva al modificar los campos
    Object.keys(fields).forEach((key) => {
      const field = fields[key];
      field.input.addEventListener('input', () => {
        if (field.input.classList.contains('invalid')) {
          validateField(key);
        }
      });
      field.input.addEventListener('blur', () => {
        validateField(key);
      });
    });

    // Validación al enviar el formulario
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successMsg.style.display = 'none';

      let isFormValid = true;
      let firstInvalidInput = null;

      Object.keys(fields).forEach((key) => {
        const isValid = validateField(key);
        if (!isValid) {
          isFormValid = false;
          if (!firstInvalidInput) {
            firstInvalidInput = fields[key].input;
          }
        }
      });

      if (isFormValid) {
        successMsg.style.display = 'block';
        form.reset();
        Object.keys(fields).forEach((key) => {
          fields[key].input.classList.remove('invalid');
          fields[key].error.textContent = '';
          fields[key].error.classList.remove('visible');
        });
      } else if (firstInvalidInput) {
        firstInvalidInput.focus();
      }
    });
  </script>
</body>
</html>
