<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire d'inscription</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      color: #1a1a1a;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #444;
    }

    .hint {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 6px;
    }

    input {
      padding: 10px 14px;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
      background-color: #fff8f8;
    }

    input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-message {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .success-alert {
      display: none;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 14px;
      border-radius: 6px;
      margin-top: 16px;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Créer un compte</h1>

    <form id="registration-form" novalidate>
      <div class="form-group">
        <label for="fullname">Nom complet</label>
        <input type="text" id="fullname" name="fullname" autocomplete="name" required>
        <span class="error-message" id="fullname-error"></span>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <span class="hint">Accepte les adresses internationales (ex. marie@société.fr)</span>
        <input type="text" id="email" name="email" inputmode="email" autocomplete="email" required>
        <span class="error-message" id="email-error"></span>
      </div>

      <div class="form-group">
        <label for="website">Site web</label>
        <span class="hint">Doit commencer par http:// ou https://</span>
        <input type="text" id="website" name="website" inputmode="url" placeholder="https://exemple.fr" required>
        <span class="error-message" id="website-error"></span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <span class="hint">8 caractères minimum</span>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <span class="error-message" id="password-error"></span>
      </div>

      <button type="submit">S'inscrire</button>
      <div class="success-alert" id="success-alert" role="status">Inscription validée avec succès !</div>
    </form>
  </main>

  <script>
    const form = document.getElementById('registration-form');
    const successAlert = document.getElementById('success-alert');

    const fields = {
      fullname: {
        input: document.getElementById('fullname'),
        error: document.getElementById('fullname-error'),
        validate: (val) => {
          if (!val.trim()) return "Le nom complet est obligatoire.";
          if (val.trim().length < 2) return "Le nom doit comporter au moins 2 caractères.";
          return "";
        }
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('email-error'),
        validate: (val) => {
          const email = val.trim();
          if (!email) return "L'adresse e-mail est obligatoire.";

          // Validation Universal Acceptance :
          // Local part non vide sans espaces, un seul @, labels de domaine séparés par des points,
          // TLD d'au moins 2 caractères (ou xn-- A-label).
          const atIndex = email.indexOf('@');
          if (atIndex <= 0 || atIndex !== email.lastIndexOf('@')) {
            return "L'adresse doit comporter un unique caractère '@'.";
          }

          const localPart = email.slice(0, atIndex);
          const domainPart = email.slice(atIndex + 1);

          if (/\s/.test(localPart) || /\s/.test(domainPart)) {
            return "L'adresse e-mail ne peut pas contenir d'espaces.";
          }

          const labels = domainPart.split('.');
          if (labels.length < 2) {
            return "Le domaine doit comporter un nom et une extension (TLD).";
          }

          for (const label of labels) {
            if (!label || label.startsWith('-') || label.endsWith('-')) {
              return "Les étiquettes du domaine sont invalides.";
            }
          }

          const tld = labels[labels.length - 1];
          if (tld.length < 2 || /^\d+$/.test(tld)) {
            return "L'extension du domaine (TLD) est invalide.";
          }

          return "";
        }
      },
      website: {
        input: document.getElementById('website'),
        error: document.getElementById('website-error'),
        validate: (val) => {
          const urlStr = val.trim();
          if (!urlStr) return "Le site web est obligatoire.";

          try {
            const parsed = new URL(urlStr);
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
              return "L'URL doit utiliser le protocole http ou https.";
            }
            if (!parsed.hostname.includes('.')) {
              return "L'adresse du site web doit inclure une extension valide.";
            }
          } catch (e) {
            return "Veuillez entrer une URL valide (ex. https://société.fr).";
          }

          return "";
        }
      },
      password: {
        input: document.getElementById('password'),
        error: document.getElementById('password-error'),
        validate: (val) => {
          if (!val) return "Le mot de passe est obligatoire.";
          if (val.length < 8) return "Le mot de passe doit comporter au moins 8 caractères.";
          return "";
        }
      }
    };

    function validateField(key) {
      const field = fields[key];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.input.classList.add('invalid');
        field.error.textContent = errorMessage;
        field.error.classList.add('visible');
        return false;
      } else {
        field.input.classList.remove('invalid');
        field.error.textContent = '';
        field.error.classList.remove('visible');
        return true;
      }
    }

    Object.keys(fields).forEach((key) => {
      const input = fields[key].input;
      input.addEventListener('input', () => {
        if (input.classList.contains('invalid')) {
          validateField(key);
        }
      });
      input.addEventListener('blur', () => {
        validateField(key);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successAlert.style.display = 'none';

      let isValid = true;
      let firstInvalidInput = null;

      Object.keys(fields).forEach((key) => {
        const fieldValid = validateField(key);
        if (!fieldValid) {
          isValid = false;
          if (!firstInvalidInput) {
            firstInvalidInput = fields[key].input;
          }
        }
      });

      if (isValid) {
        successAlert.style.display = 'block';
        form.reset();
      } else if (firstInvalidInput) {
        firstInvalidInput.focus();
      }
    });
  </script>
</body>
</html>
