<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111827;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input.invalid {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-message {
      display: none;
      font-size: 0.8125rem;
      color: #dc2626;
      margin-top: 0.375rem;
      line-height: 1.3;
    }

    .error-message.visible {
      display: block;
    }

    button[type="submit"] {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background-color 0.15s ease;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .success-banner {
      display: none;
      padding: 1rem;
      background-color: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      border-radius: 0.375rem;
      margin-bottom: 1.25rem;
      font-size: 0.925rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Please fill in your details to get started.</p>

    <div id="success-banner" class="success-banner" role="status">
      Registration successful! Welcome aboard.
    </div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Jane Doe" 
          autocomplete="name"
          aria-describedby="fullName-error"
        >
        <div id="fullName-error" class="error-message" role="alert"></div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <!-- type="text" with inputmode="email" supports internationalized email addresses (RFC 6531) -->
        <input 
          type="text" 
          id="email" 
          name="email" 
          inputmode="email"
          placeholder="jane@example.com or josé@société.fr" 
          autocomplete="email"
          aria-describedby="email-error"
        >
        <div id="email-error" class="error-message" role="alert"></div>
      </div>

      <div class="form-group">
        <label for="website">Website</label>
        <input 
          type="text" 
          id="website" 
          name="website" 
          placeholder="https://example.com or https://société.fr" 
          autocomplete="url"
          aria-describedby="website-error"
        >
        <div id="website-error" class="error-message" role="alert"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="At least 8 characters" 
          autocomplete="new-password"
          aria-describedby="password-error"
        >
        <div id="password-error" class="error-message" role="alert"></div>
      </div>

      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const successBanner = document.getElementById('success-banner');

    const fields = {
      fullName: {
        input: document.getElementById('fullName'),
        error: document.getElementById('fullName-error'),
        validate(value) {
          if (!value.trim()) {
            return 'Please enter your full name.';
          }
          if (value.trim().length < 2) {
            return 'Full name must be at least 2 characters.';
          }
          return '';
        }
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('email-error'),
        validate(value) {
          const trimmed = value.trim();
          if (!trimmed) {
            return 'Please enter your email address.';
          }

          // Universal Acceptance: supports internationalized local parts and domains (IDNs / Punycode)
          const atIndex = trimmed.lastIndexOf('@');
          if (atIndex <= 0 || atIndex !== trimmed.indexOf('@')) {
            return 'Email must contain exactly one "@" separating user and domain.';
          }

          const localPart = trimmed.slice(0, atIndex);
          const domainPart = trimmed.slice(atIndex + 1);

          if (!localPart || /\s/.test(localPart)) {
            return 'The email username cannot be empty or contain spaces.';
          }

          if (!domainPart || /\s/.test(domainPart)) {
            return 'The email domain cannot be empty or contain spaces.';
          }

          const labels = domainPart.split('.');
          if (labels.length < 2) {
            return 'The email domain must include a top-level domain (e.g. .com, .org, .fr).';
          }

          for (const label of labels) {
            if (!label || label.startsWith('-') || label.endsWith('-')) {
              return 'Domain labels cannot be empty or start/end with a hyphen.';
            }
          }

          const tld = labels[labels.length - 1];
          // TLD must be at least 2 characters (supports U-labels and A-labels like xn--)
          if (tld.length < 2) {
            return 'The top-level domain must be at least 2 characters long.';
          }

          return '';
        }
      },
      website: {
        input: document.getElementById('website'),
        error: document.getElementById('website-error'),
        validate(value) {
          const trimmed = value.trim();
          if (!trimmed) {
            return 'Please enter your website URL.';
          }

          try {
            const url = new URL(trimmed);
            if (url.protocol !== 'http:' && url.protocol !== 'https:') {
              return 'Website URL must use http:// or https://.';
            }
            if (!url.hostname || !url.hostname.includes('.')) {
              return 'Please enter a valid domain name with a TLD.';
            }
          } catch {
            return 'Please enter a valid URL (including https://).';
          }

          return '';
        }
      },
      password: {
        input: document.getElementById('password'),
        error: document.getElementById('password-error'),
        validate(value) {
          if (!value) {
            return 'Please enter a password.';
          }
          if (value.length < 8) {
            return 'Password must be at least 8 characters long.';
          }
          return '';
        }
      }
    };

    function validateField(name) {
      const field = fields[name];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.input.classList.add('invalid');
        field.input.setAttribute('aria-invalid', 'true');
        field.error.textContent = errorMessage;
        field.error.classList.add('visible');
        return false;
      } else {
        field.input.classList.remove('invalid');
        field.input.removeAttribute('aria-invalid');
        field.error.textContent = '';
        field.error.classList.remove('visible');
        return true;
      }
    }

    Object.keys(fields).forEach((name) => {
      const field = fields[name];
      field.input.addEventListener('input', () => {
        if (field.input.classList.contains('invalid')) {
          validateField(name);
        }
      });
      field.input.addEventListener('blur', () => {
        validateField(name);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successBanner.style.display = 'none';

      let isFormValid = true;
      let firstInvalidInput = null;

      Object.keys(fields).forEach((name) => {
        const isValid = validateField(name);
        if (!isValid) {
          isFormValid = false;
          if (!firstInvalidInput) {
            firstInvalidInput = fields[name].input;
          }
        }
      });

      if (!isFormValid) {
        firstInvalidInput.focus();
      } else {
        successBanner.style.display = 'block';
        form.reset();
      }
    });
  </script>
</body>
</html>
