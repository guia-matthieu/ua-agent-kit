<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .signup-card {
      background: #ffffff;
      padding: 36px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }

    .signup-card h2 {
      margin-bottom: 8px;
      color: #1a1a1a;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .signup-card p.subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1.5px solid #dcdfe6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .form-group.invalid input {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    .form-group.invalid input:focus {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .error-message {
      color: #dc2626;
      font-size: 12px;
      margin-top: 5px;
      min-height: 16px;
      visibility: hidden;
    }

    .form-group.invalid .error-message {
      visibility: visible;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #4338ca;
    }

    .btn-submit:active {
      background-color: #3730a3;
    }

    .success-banner {
      display: none;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="signup-card">
    <h2>Create Account</h2>
    <p class="subtitle">Please fill out the form below</p>

    <div id="successBanner" class="success-banner">
      Registration successful! Welcome aboard.
    </div>

    <form id="signupForm" novalidate>
      <div class="form-group" id="group-fullname">
        <label for="fullname">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="fullname" name="fullname" placeholder="John Doe">
        </div>
        <span class="error-message" id="error-fullname"></span>
      </div>

      <div class="form-group" id="group-email">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="john.doe@example.com">
        </div>
        <span class="error-message" id="error-email"></span>
      </div>

      <div class="form-group" id="group-website">
        <label for="website">Website</label>
        <div class="input-wrapper">
          <input type="url" id="website" name="website" placeholder="https://example.com">
        </div>
        <span class="error-message" id="error-website"></span>
      </div>

      <div class="form-group" id="group-password">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="At least 8 characters">
        </div>
        <span class="error-message" id="error-password"></span>
      </div>

      <button type="submit" class="btn-submit">Sign Up</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const successBanner = document.getElementById('successBanner');

    const fields = {
      fullname: {
        input: document.getElementById('fullname'),
        group: document.getElementById('group-fullname'),
        error: document.getElementById('error-fullname'),
        validate: (value) => {
          if (!value.trim()) return 'Full name is required.';
          if (value.trim().length < 2) return 'Full name must be at least 2 characters.';
          if (!/^[a-zA-Z\s'-]+$/.test(value.trim())) {
            return 'Full name can only contain letters, spaces, hyphens, and apostrophes.';
          }
          return null;
        }
      },
      email: {
        input: document.getElementById('email'),
        group: document.getElementById('group-email'),
        error: document.getElementById('error-email'),
        validate: (value) => {
          if (!value.trim()) return 'Email address is required.';
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
          if (!emailRegex.test(value.trim())) {
            return 'Please enter a valid email address.';
          }
          return null;
        }
      },
      website: {
        input: document.getElementById('website'),
        group: document.getElementById('group-website'),
        error: document.getElementById('error-website'),
        validate: (value) => {
          if (!value.trim()) return 'Website URL is required.';
          try {
            const url = new URL(value.trim());
            if (url.protocol !== 'http:' && url.protocol !== 'https:') {
              return 'Website URL must begin with http:// or https://.';
            }
            if (!url.hostname.includes('.')) {
              return 'Please enter a valid domain name.';
            }
          } catch (_) {
            return 'Please enter a valid URL (e.g., https://example.com).';
          }
          return null;
        }
      },
      password: {
        input: document.getElementById('password'),
        group: document.getElementById('group-password'),
        error: document.getElementById('error-password'),
        validate: (value) => {
          if (!value) return 'Password is required.';
          if (value.length < 8) return 'Password must be at least 8 characters long.';
          if (!/[A-Za-z]/.test(value) || !/\d/.test(value)) {
            return 'Password must contain at least one letter and one number.';
          }
          return null;
        }
      }
    };

    function validateField(fieldName) {
      const field = fields[fieldName];
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.group.classList.add('invalid');
        field.error.textContent = errorMessage;
        return false;
      } else {
        field.group.classList.remove('invalid');
        field.error.textContent = '';
        return true;
      }
    }

    Object.keys(fields).forEach((key) => {
      const field = fields[key];
      field.input.addEventListener('input', () => {
        if (field.group.classList.contains('invalid')) {
          validateField(key);
        }
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successBanner.style.display = 'none';

      let isFormValid = true;

      Object.keys(fields).forEach((key) => {
        const isValid = validateField(key);
        if (!isValid) {
          isFormValid = false;
        }
      });

      if (isFormValid) {
        successBanner.style.display = 'block';
        form.reset();
        Object.keys(fields).forEach((key) => {
          fields[key].group.classList.remove('invalid');
          fields[key].error.textContent = '';
        });
      }
    });
  </script>
</body>
</html>
