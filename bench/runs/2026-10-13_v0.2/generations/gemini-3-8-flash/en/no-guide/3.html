<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-card {
      background: #ffffff;
      padding: 35px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }

    .form-card h2 {
      margin-bottom: 25px;
      color: #1a202c;
      font-size: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
    }

    .error-message {
      font-size: 12px;
      color: #e53e3e;
      display: none;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    .form-group.invalid input {
      border-color: #e53e3e;
      background-color: #fff5f5;
    }

    .form-group.invalid .error-message {
      display: inline-block;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #3182ce;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background-color: #2b6cb0;
    }

    .success-alert {
      display: none;
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Create an Account</h2>
    <div id="successMessage" class="success-alert">Account created successfully!</div>
    
    <form id="signupForm" novalidate>
      <div class="form-group" id="group-fullname">
        <div class="label-wrapper">
          <label for="fullname">Full Name</label>
          <span class="error-message"></span>
        </div>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe">
      </div>

      <div class="form-group" id="group-email">
        <div class="label-wrapper">
          <label for="email">Email Address</label>
          <span class="error-message"></span>
        </div>
        <input type="email" id="email" name="email" placeholder="john@example.com">
      </div>

      <div class="form-group" id="group-website">
        <div class="label-wrapper">
          <label for="website">Website</label>
          <span class="error-message"></span>
        </div>
        <input type="url" id="website" name="website" placeholder="https://example.com">
      </div>

      <div class="form-group" id="group-password">
        <div class="label-wrapper">
          <label for="password">Password</label>
          <span class="error-message"></span>
        </div>
        <input type="password" id="password" name="password" placeholder="At least 8 characters">
      </div>

      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const successMsg = document.getElementById('successMessage');

    const fields = {
      fullname: {
        input: document.getElementById('fullname'),
        group: document.getElementById('group-fullname'),
        validate: (value) => {
          if (!value.trim()) return 'Name is required';
          if (value.trim().length < 2) return 'Must be at least 2 characters';
          return '';
        }
      },
      email: {
        input: document.getElementById('email'),
        group: document.getElementById('group-email'),
        validate: (value) => {
          if (!value.trim()) return 'Email is required';
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(value.trim())) return 'Invalid email address';
          return '';
        }
      },
      website: {
        input: document.getElementById('website'),
        group: document.getElementById('group-website'),
        validate: (value) => {
          if (!value.trim()) return 'Website is required';
          const urlRegex = /^(https?:\/\/)([\da-z.-]+)\.([a-z.]{2,6})([/\w .-]*)*\/?$/i;
          if (!urlRegex.test(value.trim())) return 'Must include http:// or https://';
          return '';
        }
      },
      password: {
        input: document.getElementById('password'),
        group: document.getElementById('group-password'),
        validate: (value) => {
          if (!value) return 'Password is required';
          if (value.length < 8) return 'Must be at least 8 characters';
          return '';
        }
      }
    };

    function validateField(fieldName) {
      const field = fields[fieldName];
      const errorSpan = field.group.querySelector('.error-message');
      const errorMessage = field.validate(field.input.value);

      if (errorMessage) {
        field.group.classList.add('invalid');
        errorSpan.textContent = errorMessage;
        return false;
      } else {
        field.group.classList.remove('invalid');
        errorSpan.textContent = '';
        return true;
      }
    }

    Object.keys(fields).forEach(key => {
      fields[key].input.addEventListener('input', () => {
        if (fields[key].group.classList.contains('invalid')) {
          validateField(key);
        }
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      successMsg.style.display = 'none';

      let isValid = true;
      for (const key of Object.keys(fields)) {
        const fieldValid = validateField(key);
        if (!fieldValid) {
          isValid = false;
        }
      }

      if (isValid) {
        successMsg.style.display = 'block';
        form.reset();
      }
    });
  </script>
</body>
</html>
