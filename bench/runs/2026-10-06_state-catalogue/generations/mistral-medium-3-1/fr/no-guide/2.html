<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
            display: none;
        }
        input.invalid {
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Inscription</h1>
    <form id="registrationForm" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="fullName">Nom complet :</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error">Veuillez entrer un nom complet valide (au moins 2 caractères)</div>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error">Veuillez entrer une adresse e-mail valide</div>
        </div>

        <div class="form-group">
            <label for="website">Site web :</label>
            <input type="url" id="website" name="website">
            <div id="websiteError" class="error">Veuillez entrer une URL valide (ex: https://exemple.com)</div>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error">Le mot de passe doit contenir au moins 8 caractères, une majuscule, une minuscule et un chiffre</div>
        </div>

        <button type="submit">S'inscrire</button>
    </form>

    <script>
        function validateForm() {
            let isValid = true;

            // Validation du nom complet
            const fullName = document.getElementById('fullName').value.trim();
            const fullNameError = document.getElementById('fullNameError');
            if (fullName.length < 2) {
                fullNameError.style.display = 'block';
                document.getElementById('fullName').classList.add('invalid');
                isValid = false;
            } else {
                fullNameError.style.display = 'none';
                document.getElementById('fullName').classList.remove('invalid');
            }

            // Validation de l'email
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                emailError.style.display = 'block';
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else {
                emailError.style.display = 'none';
                document.getElementById('email').classList.remove('invalid');
            }

            // Validation du site web (optionnel)
            const website = document.getElementById('website').value.trim();
            const websiteError = document.getElementById('websiteError');
            if (website && !/^https?:\/\/.+\..+/.test(website)) {
                websiteError.style.display = 'block';
                document.getElementById('website').classList.add('invalid');
                isValid = false;
            } else {
                websiteError.style.display = 'none';
                document.getElementById('website').classList.remove('invalid');
            }

            // Validation du mot de passe
            const password = document.getElementById('password').value;
            const passwordError = document.getElementById('passwordError');
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!passwordRegex.test(password)) {
                passwordError.style.display = 'block';
                document.getElementById('password').classList.add('invalid');
                isValid = false;
            } else {
                passwordError.style.display = 'none';
                document.getElementById('password').classList.remove('invalid');
            }

            if (isValid) {
                alert('Formulaire valide ! Envoi en cours...');
                // Ici vous pourriez soumettre le formulaire à un serveur
                // document.getElementById('registrationForm').submit();
            }

            return false; // Empêche l'envoi réel pour cette démonstration
        }

        // Validation en temps réel (optionnel)
        document.getElementById('fullName').addEventListener('input', function() {
            if (this.value.trim().length >= 2) {
                document.getElementById('fullNameError').style.display = 'none';
                this.classList.remove('invalid');
            }
        });

        document.getElementById('email').addEventListener('input', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(this.value.trim())) {
                document.getElementById('emailError').style.display = 'none';
                this.classList.remove('invalid');
            }
        });

        document.getElementById('website').addEventListener('input', function() {
            if (!this.value.trim() || /^https?:\/\/.+\..+/.test(this.value.trim())) {
                document.getElementById('websiteError').style.display = 'none';
                this.classList.remove('invalid');
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (passwordRegex.test(this.value)) {
                document.getElementById('passwordError').style.display = 'none';
                this.classList.remove('invalid');
            }
        });
    </script>
</body>
</html>
