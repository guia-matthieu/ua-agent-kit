<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Registro</h1>
    <form id="registrationForm" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="fullName">Nombre completo:</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="website">Sitio web:</label>
            <input type="url" id="website" name="website">
            <div id="websiteError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required minlength="8">
            <div id="passwordError" class="error"></div>
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <script>
        function validateForm() {
            let isValid = true;

            // Validar nombre completo
            const fullName = document.getElementById('fullName').value.trim();
            if (fullName === '') {
                document.getElementById('fullNameError').textContent = 'El nombre completo es obligatorio';
                isValid = false;
            } else {
                document.getElementById('fullNameError').textContent = '';
            }

            // Validar correo electrónico
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '') {
                document.getElementById('emailError').textContent = 'El correo electrónico es obligatorio';
                isValid = false;
            } else if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Ingrese un correo electrónico válido';
                isValid = false;
            } else {
                document.getElementById('emailError').textContent = '';
            }

            // Validar sitio web (opcional)
            const website = document.getElementById('website').value.trim();
            if (website !== '') {
                const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
                if (!urlRegex.test(website)) {
                    document.getElementById('websiteError').textContent = 'Ingrese una URL válida (ej: https://ejemplo.com)';
                    isValid = false;
                } else {
                    document.getElementById('websiteError').textContent = '';
                }
            }

            // Validar contraseña
            const password = document.getElementById('password').value;
            if (password === '') {
                document.getElementById('passwordError').textContent = 'La contraseña es obligatoria';
                isValid = false;
            } else if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'La contraseña debe tener al menos 8 caracteres';
                isValid = false;
            } else {
                document.getElementById('passwordError').textContent = '';
            }

            return isValid;
        }
    </script>
</body>
</html>
