<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal-Acceptance Signup</title>
<style>
  body{font-family:sans-serif;margin:2rem}
  label{display:block;margin-top:1rem}
  input{width:24rem;padding:.4rem;margin-top:.2rem}
  .error{color:red;font-size:.8rem;margin-top:.2rem}
  button{margin-top:1rem;padding:.6rem 1.2rem}
</style>
</head>
<body>
<h1>Sign up</h1>
<form id="signup">
  <label>Full name*
    <input type="text" id="name" required>
    <span id="nameErr" class="error"></span>
  </label>

  <label>Email address*
    <input type="text" id="email" required>
    <span id="emailErr" class="error"></span>
  </label>

  <label>Website
    <input type="text" id="website">
    <span id="websiteErr" class="error"></span>
  </label>

  <label>Password*
    <input type="password" id="password" required>
    <span id="passwordErr" class="error"></span>
  </label>

  <button type="submit">Create account</button>
</form>

<script>
/* ---------- Validation helpers ---------- */

// Minimal UA-compliant email check: one @, non-empty local, domain of labels
function isValidEmail(str){
  if(!str) return false;
  const at = str.indexOf('@');
  if(at < 1 || at === str.length-1) return false;
  const local = str.slice(0,at);
  if(!local.trim()) return false;
  const domain = str.slice(at+1);
  if(!domain) return false;
  // Split domain into labels
  const labels = domain.split('.');
  if(labels.length < 2) return false;
  // Each label must be 1-63 octets (A-label form)
  for(const lbl of labels){
    if(!lbl || lbl.length > 63) return false;
    // Allow A-labels (xn--...) and regular ASCII labels
    if(!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(lbl) &&
       !/^xn--[a-z0-9-]{0,59}$/i.test(lbl)) return false;
  }
  return true;
}

// Minimal UA-compliant URL check: scheme://host or host
function isValidWebsite(str){
  if(!str) return true; // optional field
  try{
    const url = new URL(str.startsWith('http') ? str : 'https://'+str);
    const host = url.hostname;
    if(!host) return false;
    // Check each label in host
    const labels = host.split('.');
    if(labels.length < 2) return false;
    for(const lbl of labels){
      if(!lbl || lbl.length > 63) return false;
      if(!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(lbl) &&
         !/^xn--[a-z0-9-]{0,59}$/i.test(lbl)) return false;
    }
    return true;
  }catch(_){
    return false;
  }
}

/* ---------- Form handling ---------- */

const form = document.getElementById('signup');
const fields = {
  name:   { el: document.getElementById('name'),   err: document.getElementById('nameErr')   },
  email:  { el: document.getElementById('email'),  err: document.getElementById('emailErr')  },
  website:{ el: document.getElementById('website'),err: document.getElementById('websiteErr')},
  password:{el:document.getElementById('password'),err:document.getElementById('passwordErr')}
};

function showError(field, msg){
  fields[field].err.textContent = msg;
}
function clearError(field){
  fields[field].err.textContent = '';
}

function validate(){
  let ok = true;
  // Name: at least 2 chars
  if(fields.name.el.value.trim().length < 2){
    showError('name','Full name must be at least 2 characters');
    ok = false;
  }else clearError('name');

  // Email
  if(!isValidEmail(fields.email.el.value.trim())){
    showError('email','Please enter a valid email address');
    ok = false;
  }else clearError('email');

  // Website (optional)
  if(fields.website.el.value && !isValidWebsite(fields.website.el.value.trim())){
    showError('website','Please enter a valid website URL');
    ok = false;
  }else clearError('website');

  // Password: at least 8 chars
  if(fields.password.el.value.length < 8){
    showError('password','Password must be at least 8 characters');
    ok = false;
  }else clearError('password');

  return ok;
}

form.addEventListener('submit', e=>{
  e.preventDefault();
  if(validate()){
    // In a real app you would send the data to the server here
    alert('Form is valid and would be submitted.');
  }
});
</script>
</body>
</html>
