<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 5px;
            height: 1em;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Inscription</h2>
    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="fullName">Nom complet</label>
            <input type="text" id="fullName" placeholder="Jean Dupont">
            <div id="nameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" placeholder="exemple@mail.com">
            <div id="emailError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="website">Site web</label>
            <input type="url" id="website" placeholder="https://www.monsite.com">
            <div id="webError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="Minimum 6 caractères">
            <div id="passError" class="error-message"></div>
        </div>

        <button type="submit">S'inscrire</button>
    </form>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
        event.preventDefault();

        // Initialisation des erreurs
        const errors = {
            fullName: "",
            email: "",
            website: "",
            password: ""
        };

        // Récupération des valeurs
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const website = document.getElementById('website').value.trim();
        const password = document.getElementById('password').value.trim();

        // Validation Nom Complet
        if (fullName === "") {
            errors.fullName = "Le nom complet est obligatoire.";
        }

        // Validation Email (Regex simple)
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === "") {
            errors.email = "L'adresse e-mail est obligatoire.";
        } else if (!emailRegex.test(email)) {
            errors.email = "L'adresse e-mail n'est pas valide.";
        }

        // Validation Site Web (Regex simple)
        const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
        if (website === "") {
            errors.website = "Le site web est obligatoire.";
        } else if (!urlRegex.test(website)) {
            errors.website = "L'URL du site web n'est pas valide.";
        }

        // Validation Mot de passe
        if (password === "") {
            errors.password = "Le mot de passe est obligatoire.";
        } else if (password.length < 6) {
            errors.password = "Le mot de passe doit contenir au moins 6 caractères.";
        }

        // Affichage des messages d'erreur
        document.getElementById('nameError').textContent = errors.fullName;
        document.getElementById('emailError').textContent = errors.email;
        document.getElementById('webError').textContent = errors.website;
        document.getElementById('passError').textContent = errors.password;

        // Vérification si le formulaire est valide
        const formIsValid = Object.values(errors).every(error => error === "");

        if (formIsValid) {
            alert("Inscription réussie !");
            this.reset(); // Réinitialise le formulaire
        }
    });
</script>

</body>
</html>
