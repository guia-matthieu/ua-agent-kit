<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input.invalid {
            border-color: #dc3545;
            background-color: #fff8f8;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: none;
        }
        .error-message.visible {
            display: block;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Crear Cuenta</h2>
    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="fullName">Nombre Completo</label>
            <input type="text" id="fullName" name="fullName" placeholder="Ej. María García">
            <div class="error-message" id="error-fullName">El nombre es obligatorio.</div>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <!-- Use type="text" to ensure full support for internationalized email local parts (RFC 6531) -->
            <input type="text" id="email" name="email" placeholder="usuario@ejemplo.com">
            <div class="error-message" id="error-email">Por favor, introduce un correo electrónico válido.</div>
        </div>

        <div class="form-group">
            <label for="website">Sitio Web</label>
            <input type="url" id="website" name="website" placeholder="https://ejemplo.com">
            <div class="error-message" id="error-website">Por favor, introduce una URL válida.</div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
            <div class="error-message" id="error-password">La contraseña debe tener al menos 8 caracteres.</div>
        </div>

        <button type="submit">Registrarse</button>
    </form>
</div>

<script>
    const form = document.getElementById('registrationForm');

    /**
     * Validación basada en los principios de Aceptación Universal.
     * Evita restricciones de longitud de TLD y permite caracteres Unicode.
     */
    const validators = {
        fullName: (val) => val.trim().length > 0,
        
        email: (val) => {
            if (!val) return false;
            // Minimal check: 1 '@', non-empty local part, domain with dot-separated labels and valid TLD/A-label.
            // Regex allows Unicode characters in local part and domain.
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}|^[^\s@]+@[^\s@]+\.xn--[a-z0-9]+$/i;
            return emailRegex.test(val);
        },

        website: (val) => {
            if (!val) return true; // Optional field
            try {
                new URL(val);
                return true;
            } catch (_) {
                return false;
            }
        },

        password: (val) => val.length >= 8
    };

    function toggleError(fieldId, isValid) {
        const input = document.getElementById(fieldId);
        const errorDiv = document.getElementById(`error-${fieldId}`);
        
        if (isValid) {
            input.classList.remove('invalid');
            errorDiv.classList.remove('visible');
        } else {
            input.classList.add('invalid');
            errorDiv.classList.add('visible');
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let isFormValid = true;

        // Validate all fields
        for (const field in validators) {
            const input = document.getElementById(field);
            const isValid = validators[field](input.value);
            toggleError(field, isValid);
            if (!isValid) isFormValid = false;
        }

        if (isFormValid) {
            alert('¡Formulario enviado con éxito!');
            form.reset();
            // Clear all error states after reset
            Object.keys(validators).forEach(field => toggleError(field, true));
        }
    });

    // Real-time validation as user types
    Object.keys(validators).forEach(field => {
        const input = document.getElementById(field);
        input.addEventListener('input', () => {
            if (input.classList.contains('invalid')) {
                toggleError(field, validators[field](input.value));
            }
        });
    });
</script>

</body>
</html>
