<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .field-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .error-message {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            height: 1rem;
            visibility: hidden;
        }
        .error-message.visible {
            visibility: visible;
        }
        input.invalid {
            border-color: #d32f2f;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Crear Cuenta</h2>
    <form id="registrationForm" novalidate>
        <div class="field-group">
            <label for="fullName">Nombre Completo</label>
            <input type="text" id="fullName" name="fullName" placeholder="Ej. Juan Pérez">
            <span class="error-message" id="fullNameError">El nombre es obligatorio.</span>
        </div>

        <div class="field-group">
            <label for="email">Correo Electrónico</label>
            <!-- Usamos type="text" para evitar que el navegador bloquee caracteres Unicode en el local-part -->
            <input type="text" id="email" name="email" placeholder="usuario@dominio.com">
            <span class="error-message" id="emailError">Introduce un correo electrónico válido.</span>
        </div>

        <div class="field-group">
            <label for="website">Sitio Web</label>
            <input type="text" id="website" name="website" placeholder="https://ejemplo.com">
            <span class="error-message" id="websiteError">Introduce una URL válida.</span>
        </div>

        <div class="field-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
            <span class="error-message" id="passwordError">La contraseña debe tener al menos 8 caracteres.</span>
        </div>

        <button type="submit">Registrarse</button>
    </form>
</div>

<script>
    const form = document.getElementById('registrationForm');

    /**
     * Validación siguiendo los principios de Aceptación Universal:
     * - No limita la longitud del TLD.
     * - Permite caracteres Unicode en la parte local y el dominio.
     * - Permite A-labels (xn--).
     * - Verificación mínima de sintaxis.
     */
    function validateEmail(email) {
        if (!email) return false;
        // Regex mínima: un '@', parte local no vacía, dominio con etiquetas separadas por puntos 
        // y un TLD de al menos 2 letras o un A-label.
        const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}|[^@\s]+@xn--[a-z0-9-]+$/i;
        return emailRegex.test(email);
    }

    function validateURL(url) {
        if (!url) return true; // Opcional
        try {
            new URL(url);
            return true;
        } catch (_) {
            return false;
        }
    }

    function setError(id, isValid) {
        const input = document.getElementById(id);
        const error = document.getElementById(id + 'Error');
        if (isValid) {
            input.classList.remove('invalid');
            error.classList.remove('visible');
        } else {
            input.classList.add('invalid');
            error.classList.add('visible');
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const data = {
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            website: document.getElementById('website').value.trim(),
            password: document.getElementById('password').value
        };

        const validations = {
            fullName: data.fullName.length > 0,
            email: validateEmail(data.email),
            website: validateURL(data.website),
            password: data.password.length >= 8
        };

        // Aplicar estados visuales
        Object.keys(validations).forEach(key => {
            setError(key, validations[key]);
        });

        const isFormValid = Object.values(validations).every(val => val === true);

        if (isFormValid) {
            alert('¡Formulario enviado con éxito!');
            form.reset();
            // Aquí se procedería al envío vía fetch/xhr
        }
    });
</script>

</body>
</html>
