<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .form-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .field-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        input.invalid {
            border-color: #d32f2f;
            background-color: #fff8f8;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            height: 1rem;
            visibility: hidden;
        }
        .error-msg.visible {
            visibility: visible;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Create Account</h2>
        <form id="signupForm" novalidate>
            <div class="field-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Jane Doe">
                <div class="error-msg" id="fullName-error">Name is required</div>
            </div>

            <div class="field-group">
                <label for="email">Email Address</label>
                <!-- Using type="text" to ensure Universal Acceptance for Unicode local parts -->
                <input type="text" id="email" name="email" placeholder="user@example.com">
                <div class="error-msg" id="email-error">Please enter a valid email address</div>
            </div>

            <div class="field-group">
                <label for="website">Website</label>
                <input type="url" id="website" name="website" placeholder="https://example.com">
                <div class="error-msg" id="website-error">Please enter a valid URL</div>
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters">
                <div class="error-msg" id="password-error">Password must be at least 8 characters</div>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('signupForm');

        /**
         * Universal Acceptance Email Validation
         * Complies with guidelines: 
         * 1. One '@'
         * 2. Non-empty local part (no spaces)
         * 3. Domain consists of dot-separated labels
         * 4. TLD is 2+ letters OR an xn-- A-label
         * 5. Allows Unicode in local and domain parts
         */
        function isValidEmail(email) {
            if (!email || email.includes(' ')) return false;
            const parts = email.split('@');
            if (parts.length !== 2) return false;

            const [local, domain] = parts;
            if (!local) return false;
            if (!domain) return false;

            const domainParts = domain.split('.');
            if (domainParts.length < 2) return false;

            const tld = domainParts[domainParts.length - 1];
            // TLD must be at least 2 chars OR start with xn-- (punycode)
            const isAlabelTLD = tld.startsWith('xn--');
            if (tld.length < 2 && !isAlabelTLD) return false;

            return true;
        }

        function isValidUrl(url) {
            try {
                new URL(url);
                return true;
            } catch {
                return false;
            }
        }

        function setError(id, isValid) {
            const input = document.getElementById(id);
            const error = document.getElementById(`${id}-error`);
            if (isValid) {
                input.classList.remove('invalid');
                error.classList.remove('visible');
            } else {
                input.classList.add('invalid');
                error.classList.add('visible');
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const data = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                website: document.getElementById('website').value.trim(),
                password: document.getElementById('password').value
            };

            const validations = {
                fullName: data.fullName.length > 0,
                email: isValidEmail(data.email),
                website: data.website === '' || isValidUrl(data.website), // Website optional, but must be valid if provided
                password: data.password.length >= 8
            };

            let formIsValid = true;
            for (const [id, isValid] of Object.entries(validations)) {
                setError(id, isValid);
                if (!isValid) formIsValid = false;
            }

            if (formIsValid) {
                alert('Form submitted successfully!');
                form.reset();
                // Clear error states after reset
                ['fullName', 'email', 'website', 'password'].forEach(id => setError(id, true));
            }
        });
    </script>
</body>
</html>
