<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
        }
        .submit-btn {
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .success {
            color: #4caf50;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form id="registrationForm">
        <div class="form-group">
            <label for="fullName">Nombre completo:</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="website">Sitio web:</label>
            <input type="url" id="website" name="website">
            <div id="websiteError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error"></div>
        </div>

        <button type="submit" class="submit-btn">Registrarse</button>
    </form>
    <div id="successMessage" class="success" style="display: none;">
        ¡Registro completado con éxito!
    </div>

    <script>
        // Función para validar correo electrónico (Universal Acceptance)
        function validateEmail(email) {
            // Expresión regular más estricta para correo electrónico
            // Se usa el dominio como referencia para validar U-labels/A-labels
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                return false;
            }
            
            // Capturar partes del correo
            const [localPart, domain] = email.split('@');
            
            // Validar caracteres permitidos en local part
            // Permite Unicode, símbolos especiales y caracteres internacionales
            const localRegex = /^[^<>()[\]\\.,;:\s@"]+[^\s]*$/;
            if (!localRegex.test(localPart)) {
                return false;
            }
            
            // Validar dominio
            if (!isValidDomain(domain)) {
                return false;
            }
            
            return true;
        }

        // Función para validar dominios con soporte Unicode
        function isValidDomain(domain) {
            // Las etiquetas de dominio deben tener entre 1 y 63 caracteres
            // El nombre completo debe tener máximo 253 caracteres (RFC 1035)
            if (domain.length > 253) return false;
            
            const labels = domain.split('.');
            for (let label of labels) {
                if (label.length === 0 || label.length > 63) return false;
                
                // Verificar que el label no comience ni termine con guion
                if (label.startsWith('-') || label.endsWith('-')) return false;
                
                // Verificar que solo contenga caracteres válidos
                const labelRegex = /^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?$/;
                // Si no cumple con la regex simple, intentar con IDNA para forma A-label
                if (!labelRegex.test(label)) {
                    // Para Unicode, verificar con regex más general (validación simplificada)
                    const unicodeLabelRegex = /^[\w\-\.]+$/;
                    if (!unicodeLabelRegex.test(label)) {
                        return false;
                    }
                }
            }
            
            // El TLD debe tener al menos 2 caracteres o ser IDNA
            if (labels.length === 0) return false;
            const tld = labels[labels.length - 1];
            // Si comienza con xn-- es un A-label IDNA
            if (tld.startsWith('xn--') && tld.length >= 5) {
                // Validar formato A-label básico
                return /^[a-zA-Z0-9\-\.]+$/.test(tld);
            } else {
                // TLD normal debe tener al menos 2 caracteres
                return tld.length >= 2;
            }
        }

        // Validar URL (más estricto para Universal Acceptance)
        function validateUrl(url) {
            if (!url) return true; // Vacío es válido
            
            try {
                // Mesclar con validación de dominios
                const urlObj = new URL(url);
                const domain = urlObj.hostname;
                
                if (!isValidDomain(domain)) {
                    return false;
                }
                
                // RegEx más estricta para URL
                const urlRegex = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\s]+$/;
                return urlRegex.test(url);
            } catch (e) {
                return false;
            }
        }

        // Validar contraseña
        function validatePassword(password) {
            // Al menos 8 caracteres, incluyendo letras y números
            return password.length >= 8 && 
                   /[a-zA-Z]/.test(password) && 
                   /[0-9]/.test(password);
        }

        // Validar nombre completo
        function validateFullName(name) {
            // Al menos 2 palabras
            const words = name.trim().split(/\s+/);
            return words.length >= 2 && name.length >= 3;
        }

        // Función para mostrar errores
        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            errorElement.textContent = message;
        }

        // Función para limpiar errores
        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            errorElement.textContent = '';
        }

        // Manejar el envío del formulario
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Obtener valores de los campos
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();
            const password = document.getElementById('password').value;
            
            let isValid = true;
            
            // Validar nombre completo
            if (!validateFullName(fullName)) {
                showError('fullName', 'Nombre completo inválido. Debe tener al menos 2 palabras.');
                isValid = false;
            } else {
                clearError('fullName');
            }
            
            // Validar correo electrónico
            if (!validateEmail(email)) {
                showError('email', 'Correo electrónico inválido.');
                isValid = false;
            } else {
                clearError('email');
            }
            
            // Validar sitio web
            if (website && !validateUrl(website)) {
                showError('website', 'URL del sitio web inválida.');
                isValid = false;
            } else {
                clearError('website');
            }
            
            // Validar contraseña
            if (!validatePassword(password)) {
                showError('password', 'Contraseña inválida. Debe tener al menos 8 caracteres, incluyendo letras y números.');
                isValid = false;
            } else {
                clearError('password');
            }
            
            // Mostrar mensaje de éxito si todo es válido
            if (isValid) {
                document.getElementById('successMessage').style.display = 'block';
                // Resetear formulario
                this.reset();
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
