<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        form {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h2 {
            text-align: center;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        input.error {
            border-color: #ff0000;
        }
        
        .error-message {
            color: #ff0000;
            font-size: 14px;
            margin-top: 5px;
        }
        
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <form id="registroForm">
        <h2>Formulario de Registro</h2>
        
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
            <div class="error-message" id="nombreError"></div>
        </div>
        
        <div class="form-group">
            <label for="email">Dirección de correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div class="error-message" id="emailError"></div>
        </div>
        
        <div class="form-group">
            <label for="website">Sitio web:</label>
            <input type="url" id="website" name="website">
            <div class="error-message" id="websiteError"></div>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div class="error-message" id="passwordError"></div>
        </div>
        
        <input type="submit" value="Registrarse">
    </form>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let isValid = true;
            
            // Limpiar errores anteriores
            clearErrors();
            
            // Validar nombre completo
            const nombre = document.getElementById('nombre').value.trim();
            if (nombre === '') {
                showError('nombre', 'El nombre completo es obligatorio.');
                isValid = false;
            } else if (nombre.length < 3) {
                showError('nombre', 'El nombre debe tener al menos 3 caracteres.');
                isValid = false;
            }
            
            // Validar correo electrónico
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '') {
                showError('email', 'La dirección de correo es obligatoria.');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                showError('email', 'El formato del correo electrónico no es válido.');
                isValid = false;
            }
            
            // Validar sitio web (opcional, pero si se introduce debe ser válido)
            const website = document.getElementById('website').value.trim();
            if (website !== '') {
                const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
                if (!urlRegex.test(website)) {
                    showError('website', 'El formato del sitio web no es válido.');
                    isValid = false;
                }
            }
            
            // Validar contraseña
            const password = document.getElementById('password').value;
            if (password === '') {
                showError('password', 'La contraseña es obligatoria.');
                isValid = false;
            } else if (password.length < 6) {
                showError('password', 'La contraseña debe tener al menos 6 caracteres.');
                isValid = false;
            } else if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
                showError('password', 'La contraseña debe contener al menos una mayúscula, una minúscula y un número.');
                isValid = false;
            }
            
            // Si todos los campos son válidos, mostrar mensaje de éxito
            if (isValid) {
                alert('¡Registro completado con éxito!');
                // Aquí iría el código para enviar los datos al servidor
                // this.submit(); // Descomentar si se desea enviar realmente el formulario
            }
        });
        
        function showError(field, message) {
            const input = document.getElementById(field);
            const errorElement = document.getElementById(field + 'Error');
            
            input.classList.add('error');
            errorElement.textContent = message;
        }
        
        function clearErrors() {
            const inputs = document.querySelectorAll('input');
            const errorMessages = document.querySelectorAll('.error-message');
            
            inputs.forEach(input => input.classList.remove('error'));
            errorMessages.forEach(message => message.textContent = '');
        }
        
        // Validación en tiempo real (opcional)
        document.getElementById('nombre').addEventListener('blur', validateNombre);
        document.getElementById('email').addEventListener('blur', validateEmail);
        document.getElementById('website').addEventListener('blur', validateWebsite);
        document.getElementById('password').addEventListener('blur', validatePassword);
        
        function validateNombre() {
            const nombre = document.getElementById('nombre').value.trim();
            if (nombre !== '' && nombre.length >= 3) {
                clearFieldError('nombre');
            }
        }
        
        function validateEmail() {
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '' || emailRegex.test(email)) {
                clearFieldError('email');
            }
        }
        
        function validateWebsite() {
            const website = document.getElementById('website').value.trim();
            if (website === '' || /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/.test(website)) {
                clearFieldError('website');
            }
        }
        
        function validatePassword() {
            const password = document.getElementById('password').value;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d@$!%*?&]{6,}$/;
            if (password === '' || passwordRegex.test(password)) {
                clearFieldError('password');
            }
        }
        
        function clearFieldError(field) {
            const input = document.getElementById(field);
            const errorElement = document.getElementById(field + 'Error');
            
            input.classList.remove('error');
            errorElement.textContent = '';
        }
    </script>
</body>
</html>
