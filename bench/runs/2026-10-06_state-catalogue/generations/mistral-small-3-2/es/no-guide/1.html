<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: #d9534f;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }
        button {
            background-color: #5cb85c;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registro</h1>
        <form id="registroForm" onsubmit="return validarFormulario()">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
                <div id="errorNombre" class="error">El nombre debe tener al menos 3 caracteres</div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
                <div id="errorEmail" class="error">Por favor ingresa un correo electrónico válido</div>
            </div>

            <div class="form-group">
                <label for="website">Sitio web (opcional):</label>
                <input type="url" id="website" name="website">
                <div id="errorWebsite" class="error">Por favor ingresa una URL válida</div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <div id="errorPassword" class="error">La contraseña debe tener al menos 6 caracteres</div>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <script>
        function validarFormulario() {
            // Obtener valores de los campos
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();
            const password = document.getElementById('password').value;

            // Obtener elementos de error
            const errorNombre = document.getElementById('errorNombre');
            const errorEmail = document.getElementById('errorEmail');
            const errorWebsite = document.getElementById('errorWebsite');
            const errorPassword = document.getElementById('errorPassword');

            // Resetear mensajes de error
            errorNombre.style.display = 'none';
            errorEmail.style.display = 'none';
            errorWebsite.style.display = 'none';
            errorPassword.style.display = 'none';

            let esValido = true;

            // Validar nombre
            if (nombre.length < 3) {
                errorNombre.style.display = 'block';
                esValido = false;
            }

            // Validar email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorEmail.style.display = 'block';
                esValido = false;
            }

            // Validar website (opcional)
            if (website && !website.startsWith('http://') && !website.startsWith('https://')) {
                website = 'http://' + website;
                if (!/^https?:\/\/[^\s]+\.[^\s]+$/.test(website)) {
                    errorWebsite.style.display = 'block';
                    esValido = false;
                }
            }

            // Validar contraseña
            if (password.length < 6) {
                errorPassword.style.display = 'block';
                esValido = false;
            }

            // Si todo es válido, mostrar mensaje de éxito
            if (esValido) {
                alert('¡Registro exitoso!');
                // Aquí podrías enviar el formulario al servidor
                // document.getElementById('registroForm').submit();
                return true;
            }

            return false;
        }
    </script>
</body>
</html>
