<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
            display: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Registro de Usuario</h1>
    <form id="registroForm" onsubmit="return validarFormulario()">
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
            <div id="errorNombre" class="error">El nombre debe contener al menos 3 caracteres</div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div id="errorEmail" class="error">Por favor ingresa un correo electrónico válido</div>
        </div>

        <div class="form-group">
            <label for="web">Sitio web (opcional):</label>
            <input type="url" id="web" name="web" placeholder="https://ejemplo.com">
            <div id="errorWeb" class="error">Por favor ingresa una URL válida</div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div id="errorPassword" class="error">La contraseña debe tener al menos 8 caracteres</div>
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <script>
        function validarFormulario() {
            // Obtener valores de los campos
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const web = document.getElementById('web').value.trim();
            const password = document.getElementById('password').value;

            // Limpiar mensajes de error anteriores
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

            let esValido = true;

            // Validar nombre
            if (nombre.length < 3) {
                document.getElementById('errorNombre').style.display = 'block';
                esValido = false;
            }

            // Validar email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('errorEmail').style.display = 'block';
                esValido = false;
            }

            // Validar web (si se proporcionó)
            if (web && !web.startsWith('http://') && !web.startsWith('https://')) {
                document.getElementById('errorWeb').style.display = 'block';
                esValido = false;
            }

            // Validar contraseña
            if (password.length < 8) {
                document.getElementById('errorPassword').style.display = 'block';
                esValido = false;
            }

            // Si todo es válido, mostrar mensaje de éxito
            if (esValido) {
                alert('Formulario enviado correctamente. ¡Gracias por registrarte!');
                // Aquí podrías enviar el formulario al servidor
                // document.getElementById('registroForm').submit();
                return true;
            }

            return false;
        }
    </script>
</body>
</html>
