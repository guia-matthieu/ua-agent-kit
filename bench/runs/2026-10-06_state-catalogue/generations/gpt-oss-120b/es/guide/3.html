<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de usuario</title>
<style>
    body {font-family:Arial,sans-serif; max-width:600px; margin:2rem auto;}
    .field {margin-bottom:1rem;}
    label {display:block;margin-bottom:0.25rem;}
    input {width:100%;padding:0.4rem;box-sizing:border-box;}
    .error {color:#d00;font-size:0.875rem;margin-top:0.25rem;display:block;}
    .success {color:#090;font-size:1rem;margin-top:1rem;}
</style>
</head>
<body>

<h1>Registro</h1>

<form id="registerForm" novalidate>
    <div class="field">
        <label for="fullName">Nombre completo</label>
        <input type="text" id="fullName" name="fullName" required>
        <span class="error" aria-live="polite"></span>
    </div>

    <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
        <span class="error" aria-live="polite"></span>
    </div>

    <div class="field">
        <label for="website">Sitio web</label>
        <input type="url" id="website" name="website" required placeholder="https://ejemplo.com">
        <span class="error" aria-live="polite"></span>
    </div>

    <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        <span class="error" aria-live="polite"></span>
    </div>

    <button type="submit">Registrarse</button>
    <div id="result" class="success" aria-live="polite"></div>
</form>

<script>
(function () {
    const form = document.getElementById('registerForm');
    const result = document.getElementById('result');

    const validators = {
        fullName(value) {
            if (!value.trim()) return 'El nombre completo no puede estar vacío.';
            return '';
        },
        email(value) {
            // 1. exactly one '@' and no spaces
            if (!value) return 'El correo electrónico es obligatorio.';
            if (/\s/.test(value)) return 'El correo electrónico no puede contener espacios.';
            const parts = value.split('@');
            if (parts.length !== 2) return 'El correo electrónico debe contener un solo "@"';
            const [local, domain] = parts;
            if (!local) return 'La parte local del correo no puede estar vacía.';
            if (!domain) return 'El dominio del correo no puede estar vacío.';

            // 2. validate domain via URL (which performs IDNA2008 conversion)
            try {
                // The URL constructor will throw for illegal hostnames.
                // Prepend a dummy scheme because URL needs it.
                const url = new URL('http://' + domain);
                // Hostname must contain at least one dot (to have a TLD)
                if (!url.hostname.includes('.')) return 'El dominio debe contener al menos un punto.';
                // TLD must be at least two characters after IDNA conversion
                const tld = url.hostname.split('.').pop();
                if (tld.length < 2) return 'El TLD parece demasiado corto.';
            } catch (e) {
                return 'El dominio del correo no es válido.';
            }
            return '';
        },
        website(value) {
            if (!value) return 'El sitio web es obligatorio.';
            try {
                const url = new URL(value);
                if (!['http:', 'https:'].includes(url.protocol))
                    return 'Solo se permiten URLs HTTP/HTTPS.';
                // Optional: ensure hostname has a dot
                if (!url.hostname.includes('.')) return 'El dominio del sitio web debe contener un punto.';
            } catch (e) {
                return 'La URL del sitio web no es válida.';
            }
            return '';
        },
        password(value) {
            if (!value) return 'La contraseña es obligatoria.';
            if (value.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
            if (!/[A-Za-z]/.test(value) || !/[0-9]/.test(value))
                return 'La contraseña debe contener letras y números.';
            return '';
        }
    };

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        result.textContent = '';
        let hasError = false;

        // Clear previous errors
        form.querySelectorAll('.error').forEach(span => span.textContent = '');

        // Iterate over each input
        for (const [name, validator] of Object.entries(validators)) {
            const input = form.elements[name];
            const errorMsg = validator(input.value);
            if (errorMsg) {
                const errorSpan = input.parentElement.querySelector('.error');
                errorSpan.textContent = errorMsg;
                hasError = true;
            }
        }

        if (!hasError) {
            result.textContent = '¡Registro completado con éxito!';
            // Aquí podrías enviar los datos al servidor con fetch/AJAX.
            // form.submit(); // Si deseas seguir la acción tradicional.
        }
    });
})();
</script>

</body>
</html>
