<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario de registro</title>
<style>
  body {font-family:Arial,Helvetica,sans-serif; max-width:600px; margin:2rem auto; padding:0 1rem;}
  form {display:flex; flex-direction:column; gap:1rem;}
  label {font-weight:bold;}
  input {padding:0.4rem; font-size:1rem;}
  .error {color:#c00; font-size:0.9rem; margin-top:0.2rem;}
  .field {display:flex; flex-direction:column;}
</style>
</head>
<body>

<h1>Registro</h1>

<form id="registerForm" novalidate>
  <div class="field">
    <label for="fullName">Nombre completo</label>
    <input type="text" id="fullName" name="fullName" required>
    <span class="error" id="fullNameError"></span>
  </div>

  <div class="field">
    <label for="email">Correo electrónico</label>
    <input type="text" id="email" name="email" required>
    <span class="error" id="emailError"></span>
  </div>

  <div class="field">
    <label for="website">Sitio web</label>
    <input type="text" id="website" name="website" placeholder="https://ejemplo.com">
    <span class="error" id="websiteError"></span>
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>
    <span class="error" id="passwordError"></span>
  </div>

  <button type="submit">Registrarse</button>
</form>

<script>
(() => {
  const form = document.getElementById('registerForm');

  const $ = (id) => document.getElementById(id);

  const clearErrors = () => {
    ['fullName','email','website','password'].forEach(id => $(id + 'Error').textContent = '');
  };

  // ----------- validators -------------------------------------------------
  const isNonEmpty = (s) => s.trim().length > 0;

  // Email validator (EAI‑compatible, minimal syntax)
  const validateEmail = (addr) => {
    // Must contain exactly one @
    const parts = addr.split('@');
    if (parts.length !== 2) return false;
    const [local, domain] = parts;
    if (!isNonEmpty(local) || /\s/.test(local)) return false;

    // Domain part: dot‑separated labels
    try {
      // Use URL to get punycode (IDNA2008) representation of the host.
      // Adding a dummy protocol allows the constructor to parse it.
      const url = new URL('http://' + domain);
      const asciiHost = url.hostname;               // already punycode when needed
      const labels = asciiHost.split('.');
      if (labels.some(l => l.length === 0 || l.length > 63)) return false;

      // TLD check: at least 2 characters OR starts with xn--
      const tld = labels[labels.length - 1];
      const tldOk = /^[A-Za-z]{2,}$/u.test(tld) || /^xn--[A-Za-z0-9-]+$/i.test(tld);
      return tldOk;
    } catch (e) {
      return false; // malformed domain
    }
  };

  // URL validator (allows Unicode domain, requires scheme)
  const validateURL = (txt) => {
    if (txt.trim() === '') return true; // optional field
    try {
      const url = new URL(txt);
      // The host part must be a valid IDN; URL constructor already normalises it.
      const host = url.hostname;
      const labels = host.split('.');
      if (labels.some(l => l.length === 0 || l.length > 63)) return false;
      return true;
    } catch (e) {
      return false;
    }
  };

  const validatePassword = (pw) => {
    // Minimum 8 characters, at least one letter and one number
    return pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw);
  };
  // -----------------------------------------------------------------------

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clearErrors();

    let valid = true;

    // Nombre completo
    const nameVal = $('fullName').value;
    if (!isNonEmpty(nameVal)) {
      $('fullNameError').textContent = 'El nombre no puede estar vacío.';
      valid = false;
    }

    // Email
    const emailVal = $('email').value;
    if (!validateEmail(emailVal)) {
      $('emailError').textContent = 'Dirección de correo no válida.';
      valid = false;
    }

    // Sitio web
    const websiteVal = $('website').value;
    if (!validateURL(websiteVal)) {
      $('websiteError').textContent = 'URL no válida (debe incluir http:// o https://).';
      valid = false;
    }

    // Contraseña
    const passVal = $('password').value;
    if (!validatePassword(passVal)) {
      $('passwordError').textContent = 'Mínimo 8 caracteres, al menos una letra y un número.';
      valid = false;
    }

    if (valid) {
      // Aquí iría la lógica de envío (AJAX, submit normal, etc.)
      alert('¡Registro completado con éxito!');
      form.reset();
    }
  });
})();
</script>

</body>
</html>
