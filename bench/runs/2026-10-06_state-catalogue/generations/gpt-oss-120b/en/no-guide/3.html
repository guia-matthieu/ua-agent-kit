<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        background: #f9f9f9;
    }
    form {
        max-width: 400px;
        padding: 1.5rem;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    .form-group {
        margin-bottom: 1rem;
        position: relative;
    }
    label {
        display: block;
        margin-bottom: .3rem;
        font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    input[type="url"],
    input[type="password"] {
        width: 100%;
        padding: .5rem;
        border: 1px solid #ccc;
        border-radius: 3px;
        box-sizing: border-box;
    }
    .error {
        color: #d00;
        font-size: .85rem;
        position: absolute;
        right: 0;
        top: 0;
    }
    button {
        padding: .6rem 1.2rem;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }
    button:hover {
        background: #218838;
    }
</style>
</head>
<body>

<h2>Signup</h2>
<form id="signupForm" novalidate>
    <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>
        <span class="error" id="fullNameError"></span>
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="emailError"></span>
    </div>

    <div class="form-group">
        <label for="website">Website (e.g. https://example.com)</label>
        <input type="url" id="website" name="website" required>
        <span class="error" id="websiteError"></span>
    </div>

    <div class="form-group">
        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" name="password" required>
        <span class="error" id="passwordError"></span>
    </div>

    <button type="submit">Sign Up</button>
</form>

<script>
(function() {
    const form = document.getElementById('signupForm');

    const fields = [
        {
            id: 'fullName',
            validator: value => value.trim().length > 0,
            message: 'Full name is required.'
        },
        {
            id: 'email',
            validator: value => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
            message: 'Enter a valid email address.'
        },
        {
            id: 'website',
            validator: value => {
                // Simple URL validation – must start with http:// or https://
                try {
                    const url = new URL(value);
                    return url.protocol === 'http:' || url.protocol === 'https:';
                } catch (e) {
                    return false;
                }
            },
            message: 'Enter a valid website URL.'
        },
        {
            id: 'password',
            validator: value => value.length >= 6,
            message: 'Password must be at least 6 characters.'
        }
    ];

    // Clear error when user starts typing
    fields.forEach(f => {
        const input = document.getElementById(f.id);
        input.addEventListener('input', () => {
            document.getElementById(f.id + 'Error').textContent = '';
        });
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // stop default submission
        let isValid = true;

        fields.forEach(f => {
            const input = document.getElementById(f.id);
            const errorEl = document.getElementById(f.id + 'Error');
            if (!f.validator(input.value)) {
                errorEl.textContent = f.message;
                isValid = false;
            } else {
                errorEl.textContent = '';
            }
        });

        if (isValid) {
            // In a real scenario you would submit the form here.
            alert('Form submitted successfully!');
            form.reset();
        }
    });
})();
</script>

</body>
</html>
