<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    form > div {
        margin-bottom: 1rem;
    }
    label {
        display: block;
        margin-bottom: .3rem;
        font-weight: bold;
    }
    input[type=text],
    input[type=email],
    input[type=url],
    input[type=password] {
        width: 100%;
        padding: .4rem;
        box-sizing: border-box;
        font-size: 1rem;
    }
    .error {
        color: #d00;
        font-size: .9rem;
        margin-top: .2rem;
        display: block;
    }
    button {
        padding: .6rem 1.2rem;
        font-size: 1rem;
    }
</style>
</head>
<body>

<h1>Formulaire d'inscription</h1>

<form id="signupForm" novalidate>
    <div>
        <label for="fullname">Nom complet *</label>
        <input type="text" id="fullname" name="fullname" required>
        <span class="error" id="err-fullname"></span>
    </div>

    <div>
        <label for="email">Adresse e‑mail *</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="err-email"></span>
    </div>

    <div>
        <label for="website">Site web *</label>
        <input type="url" id="website" name="website" placeholder="https://exemple.com" required>
        <span class="error" id="err-website"></span>
    </div>

    <div>
        <label for="password">Mot de passe *</label>
        <input type="password" id="password" name="password" required minlength="8">
        <span class="error" id="err-password"></span>
    </div>

    <button type="submit">S'inscrire</button>
</form>

<script>
(function () {
    const form = document.getElementById('signupForm');

    // Regex that accepts Unicode characters in local‑part and domain.
    //   - no whitespace, no '@' inside the local part
    //   - at least one dot in the domain part
    //   - TLD length ≥ 2 (Unicode characters allowed)
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/u;

    // Helper to set an error message
    function setError(id, message) {
        document.getElementById(id).textContent = message;
    }

    // Helper to clear all errors
    function clearErrors() {
        ['fullname', 'email', 'website', 'password'].forEach(fn => setError('err-' + fn, ''));
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();          // we’ll submit only if everything is OK
        clearErrors();

        let ok = true;

        // ----- Nom complet -----
        const fullname = form.fullname.value.trim();
        if (fullname === '') {
            ok = false;
            setError('err-fullname', 'Le nom complet est requis.');
        }

        // ----- Adresse e‑mail -----
        const email = form.email.value.trim();
        if (email === '') {
            ok = false;
            setError('err-email', 'L’adresse e‑mail est requise.');
        } else if (!emailPattern.test(email)) {
            ok = false;
            setError('err-email', 'Format d’adresse e‑mail invalide.');
        }

        // ----- Site web -----
        const website = form.website.value.trim();
        if (website === '') {
            ok = false;
            setError('err-website', 'L’URL du site web est requise.');
        } else {
            try {
                // new URL accepts Unicode domains (e.g. https://exemple.中国)
                // It also forces a scheme (http/https) which we require.
                const url = new URL(website);
                if (!/^https?:$/i.test(url.protocol)) {
                    throw new Error('Protocol not http/https');
                }
            } catch (_) {
                ok = false;
                setError('err-website', 'URL du site web invalide (ex. https://exemple.com).');
            }
        }

        // ----- Mot de passe -----
        const password = form.password.value;
        if (password.length < 8) {
            ok = false;
            setError('err-password', 'Le mot de passe doit contenir au moins 8 caractères.');
        }

        if (ok) {
            // Ici vous pourriez envoyer le formulaire via fetch/ajax.
            // Pour la démonstration on montre simplement un message.
            alert('Inscription réussie ! Vous pouvez maintenant envoyer le formulaire.');
            form.submit(); // ou laisser le formulaire se soumettre naturellement
        }
    });
})();
</script>

</body>
</html>
