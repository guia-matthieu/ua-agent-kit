<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .success {
            color: green;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Signup Form</h1>
    <form id="signupForm">
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="website">Website (optional):</label>
            <input type="url" id="website" name="website">
            <div id="websiteError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error"></div>
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <div id="successMessage" class="success"></div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Clear previous errors
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
            document.getElementById('successMessage').textContent = '';

            let isValid = true;

            // Validate Full Name
            const fullName = document.getElementById('fullName').value.trim();
            if (fullName === '') {
                document.getElementById('fullNameError').textContent = 'Full name is required';
                isValid = false;
            } else if (fullName.length < 2) {
                document.getElementById('fullNameError').textContent = 'Full name must be at least 2 characters';
                isValid = false;
            }

            // Validate Email
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '') {
                document.getElementById('emailError').textContent = 'Email is required';
                isValid = false;
            } else if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                isValid = false;
            }

            // Validate Website (if provided)
            const website = document.getElementById('website').value.trim();
            if (website && !website.startsWith('http://') && !website.startsWith('https://')) {
                document.getElementById('website').value = 'https://' + website;
            }

            // Validate Password
            const password = document.getElementById('password').value;
            if (password === '') {
                document.getElementById('passwordError').textContent = 'Password is required';
                isValid = false;
            } else if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                isValid = false;
            }

            // If all validations pass
            if (isValid) {
                // Here you would typically send the data to a server
                document.getElementById('successMessage').textContent =
                    'Form submitted successfully! (This is a demo - no actual submission)';

                // For demo purposes, we'll just show a success message
                // In a real application, you would submit the form data to a server
                console.log('Form data:', {
                    fullName: fullName,
                    email: email,
                    website: website || '',
                    password: password // Note: In a real app, you would never log the password
                });
            }
        });

        // Add real-time validation for better UX
        document.getElementById('email').addEventListener('input', function() {
            const email = this.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const errorElement = document.getElementById('emailError');

            if (email === '') {
                errorElement.textContent = '';
            } else if (!emailRegex.test(email)) {
                errorElement.textContent = 'Please enter a valid email address';
            } else {
                errorElement.textContent = '';
            }
        });
    </script>
</body>
</html>
