<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .success {
            color: green;
            font-size: 16px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form id="registroForm">
        <div class="form-group">
            <label for="nombreCompleto">Nombre completo:</label>
            <input type="text" id="nombreCompleto" name="nombreCompleto" required>
            <div id="errorNombreCompleto" class="error">Por favor ingresa tu nombre completo</div>
        </div>

        <div class="form-group">
            <label for="correoElectronico">Dirección de correo electrónico:</label>
            <input type="email" id="correoElectronico" name="correoElectronico" required>
            <div id="errorCorreoElectronico" class="error">Por favor ingresa un correo electrónico válido</div>
        </div>

        <div class="form-group">
            <label for="sitioWeb">Sitio web (opcional):</label>
            <input type="url" id="sitioWeb" name="sitioWeb">
            <div id="errorSitioWeb" class="error">Por favor ingresa una URL válida</div>
        </div>

        <div class="form-group">
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" required>
            <div id="errorContraseña" class="error">La contraseña debe tener al menos 8 caracteres</div>
        </div>

        <button type="submit">Registrarse</button>
        <div id="mensajeExito" class="success">¡Registro exitoso!</div>
    </form>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Limpiar errores previos
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

            // Obtener valores de los campos
            const nombreCompleto = document.getElementById('nombreCompleto').value.trim();
            const correoElectronico = document.getElementById('correoElectronico').value.trim();
            const sitioWeb = document.getElementById('sitioWeb').value.trim();
            const contraseña = document.getElementById('contraseña').value;

            // Validar campos
            let esValido = true;

            // Validar nombre completo
            if (nombreCompleto === '') {
                document.getElementById('errorNombreCompleto').style.display = 'block';
                esValido = false;
            }

            // Validar correo electrónico
            const correoRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (correoElectronico === '' || !correoRegex.test(correoElectronico)) {
                document.getElementById('errorCorreoElectronico').style.display = 'block';
                esValido = false;
            }

            // Validar sitio web (solo si está presente)
            if (sitioWeb !== '' && (sitioWeb.startsWith('http://') || sitioWeb.startsWith('https://'))) {
                // Validar formato URL básico
                const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
                if (!urlRegex.test(sitioWeb)) {
                    document.getElementById('errorSitioWeb').style.display = 'block';
                    esValido = false;
                }
            }

            // Validar contraseña
            if (contraseña === '' || contraseña.length < 8) {
                document.getElementById('errorContraseña').style.display = 'block';
                esValido = false;
            }

            // Si todo es válido, mostrar mensaje de éxito
            if (esValido) {
                document.getElementById('mensajeExito').style.display = 'block';
                // Aquí podrías agregar el código para enviar los datos al servidor
                console.log('Formulario válido:', {
                    nombreCompleto,
                    correoElectronico,
                    sitioWeb: sitioWeb || '',
                    contraseña
                });

                // Reiniciar el formulario
                this.reset();
            }
        });
    </script>
</body>
</html>
