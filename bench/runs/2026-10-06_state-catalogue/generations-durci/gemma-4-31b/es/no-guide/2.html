<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input.invalid {
            border-color: #e74c3c;
            background-color: #fffefe;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            height: 1rem;
            display: block;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Crear Cuenta</h2>
    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="fullname">Nombre Completo</label>
            <input type="text" id="fullname" name="fullname" placeholder="Ej. Juan Pérez">
            <span id="error-fullname" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
            <span id="error-email" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="website">Sitio Web</label>
            <input type="url" id="website" name="website" placeholder="https://misitio.com">
            <span id="error-website" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
            <span id="error-password" class="error-message"></span>
        </div>

        <button type="submit">Registrarse</button>
    </form>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const inputs = this.querySelectorAll('input');
        const errors = this.querySelectorAll('.error-message');
        inputs.forEach(input => input.classList.remove('invalid'));
        errors.forEach(error => error.textContent = '');

        let isValid = true;

        const data = {
            fullname: document.getElementById('fullname'),
            email: document.getElementById('email'),
            website: document.getElementById('website'),
            password: document.getElementById('password')
        };

        // 1. Validación Nombre Completo
        if (data.fullname.value.trim().length < 3) {
            showError('fullname', 'El nombre debe tener al menos 3 caracteres.');
            isValid = false;
        }

        // 2. Validación Email (Soporta RFC 5322 simplificado, prohíbe puntos consecutivos y espacios)
        // Regex: No espacios, no puntos consecutivos, formato usuario@dominio.tld
        const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
        if (!emailRegex.test(data.email.value) || data.email.value.includes('..')) {
            showError('email', 'Ingrese un correo electrónico válido.');
            isValid = false;
        }

        // 3. Validación Sitio Web (Prohíbe espacios y requiere protocolo válido)
        // Regex: Debe empezar con http o https, no permitir espacios, validar estructura de dominio
        const urlRegex = /^https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#多的]*\.[a-zA-Z0-9 (.)]{2,6}\b(?:[-a-zA-Z0-9@:%_\+.~#?&\/=]*)$/;
        const websiteValue = data.website.value.trim();
        
        if (websiteValue === "") {
            showError('website', 'El sitio web es obligatorio.');
            isValid = false;
        } else if (/\s/.test(websiteValue) || !urlRegex.test(websiteValue)) {
            showError('website', 'Ingrese una URL válida (ej: https://google.com).');
            isValid = false;
        }

        // 4. Validación Contraseña
        if (data.password.value.length < 6) {
            showError('password', 'La contraseña debe tener al menos 6 caracteres.');
            isValid = false;
        }

        if (isValid) {
            alert('¡Formulario enviado con éxito!');
            this.reset();
        }
    });

    function showError(fieldId, message) {
        const inputField = document.getElementById(fieldId);
        const errorSpan = document.getElementById('error-' + fieldId);
        inputField.classList.add('invalid');
        errorSpan.textContent = message;
    }
</script>

</body>
</html>
