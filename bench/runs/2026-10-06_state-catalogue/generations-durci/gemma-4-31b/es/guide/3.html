<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .field-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .error-message {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            height: 1rem;
            visibility: hidden;
        }
        .error-message.visible {
            visibility: visible;
        }
        input.invalid {
            border-color: #d32f2f;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Crear Cuenta</h2>
    <form id="registrationForm" novalidate>
        <div class="field-group">
            <label for="fullName">Nombre Completo</label>
            <input type="text" id="fullName" name="fullName" placeholder="Ej. Juan Pérez">
            <span class="error-message" id="fullNameError">El nombre es obligatorio.</span>
        </div>

        <div class="field-group">
            <label for="email">Correo Electrónico</label>
            <input type="text" id="email" name="email" placeholder="usuario@dominio.com">
            <span class="error-message" id="emailError">Introduce un correo electrónico válido.</span>
        </div>

        <div class="field-group">
            <label for="website">Sitio Web</label>
            <input type="text" id="website" name="website" placeholder="https://ejemplo.com">
            <span class="error-message" id="websiteError">Introduce una URL válida.</span>
        </div>

        <div class="field-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
            <span class="error-message" id="passwordError">La contraseña debe tener al menos 8 caracteres.</span>
        </div>

        <button type="submit">Registrarse</button>
    </form>
</div>

<script>
    const form = document.getElementById('registrationForm');

    /**
     * Validación de Email basada en Universal Acceptance:
     * 1. No permite espacios.
     * 2. Parte local no vacía.
     * 3. El dominio no puede tener puntos consecutivos (..).
     * 4. TLD de 2+ letras o A-label (xn--).
     */
    function validateEmail(email) {
        if (!email || email.includes(' ')) return false;
        
        // Estructura básica: local-part@domain
        const parts = email.split('@');
        if (parts.length !== 2) return false;

        const localPart = parts[0];
        const domain = parts[1];

        if (!localPart) return false;
        if (!domain) return false;

        // Prohibir puntos consecutivos en el dominio (RFC 1035)
        if (domain.includes('..')) return false;

        // Validación de dominio: debe tener al menos un punto y el TLD debe ser válido
        // Permitimos Unicode y A-labels (xn--)
        const domainRegex = /^[^.]+\.[^.]{2,}|[^.]+\.xn--[a-z0-9-]+$/i;
        return domainRegex.test(domain);
    }

    /**
     * Validación de URL:
     * El constructor URL de JS rechaza espacios y formatos inválidos.
     */
    function validateURL(url) {
        if (!url) return true; // Campo opcional
        if (url.includes(' ')) return false; // URLs no pueden contener espacios sin codificación
        try {
            const parsed = new URL(url);
            // Asegurar que tenga protocolo http o https
            return ['http:', 'https:'].includes(parsed.protocol);
        } catch (_) {
            return false;
        }
    }

    function setError(id, isValid) {
        const input = document.getElementById(id);
        const error = document.getElementById(id + 'Error');
        if (isValid) {
            input.classList.remove('invalid');
            error.classList.remove('visible');
        } else {
            input.classList.add('invalid');
            error.classList.add('visible');
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const data = {
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            website: document.getElementById('website').value.trim(),
            password: document.getElementById('password').value
        };

        const validations = {
            fullName: data.fullName.length > 0,
            email: validateEmail(data.email),
            website: validateURL(data.website),
            password: data.password.length >= 8
        };

        Object.keys(validations).forEach(key => {
            setError(key, validations[key]);
        });

        const isFormValid = Object.values(validations).every(val => val === true);

        if (isFormValid) {
            alert('¡Formulario enviado con éxito!');
            form.reset();
        }
    });
</script>

</body>
</html>
