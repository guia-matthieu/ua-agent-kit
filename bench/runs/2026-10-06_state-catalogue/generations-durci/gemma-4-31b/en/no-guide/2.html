<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #666;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input.error-border {
            border-color: #ff4d4d;
        }
        .error-message {
            color: #ff4d4d;
            font-size: 0.75rem;
            margin-top: 4px;
            height: 1rem;
            display: block;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Create Account</h2>
        <form id="signupForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe">
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="url" id="website" placeholder="https://example.com">
                <span class="error-message" id="websiteError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 8 characters">
                <span class="error-message" id="passwordError"></span>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const errors = document.querySelectorAll('.error-message');
            const inputs = document.querySelectorAll('input');
            errors.forEach(el => el.innerText = '');
            inputs.forEach(el => el.classList.remove('error-border'));

            let isValid = true;

            // Full Name Validation
            const fullName = document.getElementById('fullName');
            if (fullName.value.trim().length < 2) {
                setError('nameError', fullName, 'Please enter your full name.');
                isValid = false;
            }

            // Email Validation: Strict RFC-like check to prevent double dots and invalid chars
            const email = document.getElementById('email');
            const emailValue = email.value.trim();
            const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
            
            if (!emailRegex.test(emailValue) || emailValue.includes('..')) {
                setError('emailError', email, 'Please enter a valid email address.');
                isValid = false;
            }

            // Website Validation: Must be valid URL and contain no spaces
            const website = document.getElementById('website');
            const websiteValue = website.value.trim();
            if (websiteValue !== '') {
                try {
                    // The URL constructor accepts spaces (encoding them), so we manually check for whitespace
                    if (/\s/.test(websiteValue)) {
                        throw new Error('Space detected');
                    }
                    const url = new URL(websiteValue);
                    if (!url.protocol.startsWith('http')) {
                        throw new Error('Invalid protocol');
                    }
                } catch (e) {
                    setError('websiteError', website, 'Please enter a valid URL (e.g., https://site.com).');
                    isValid = false;
                }
            }

            // Password Validation
            const password = document.getElementById('password');
            if (password.value.length < 8) {
                setError('passwordError', password, 'Password must be at least 8 characters long.');
                isValid = false;
            }

            if (isValid) {
                alert('Form submitted successfully!');
                this.reset();
            }
        });

        function setError(id, inputEl, message) {
            document.getElementById(id).innerText = message;
            inputEl.classList.add('error-border');
        }
    </script>
</body>
</html>
