<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input.error-border {
            border-color: #ff4d4d;
        }
        .error-message {
            color: #ff4d4d;
            font-size: 0.8rem;
            margin-top: 4px;
            height: 1em;
            display: block;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Create Account</h2>
        <form id="signupForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe">
                <span id="fullNameError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com">
                <span id="emailError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="url" id="website" placeholder="https://www.example.com">
                <span id="websiteError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
                <span id="passwordError" class="error-message"></span>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('input');
            const errorSpans = document.querySelectorAll('.error-message');
            inputs.forEach(input => input.classList.remove('error-border'));
            errorSpans.forEach(span => span.textContent = '');

            let isValid = true;

            // Full Name Validation
            const fullName = document.getElementById('fullName');
            if (fullName.value.trim().length < 2) {
                setError(fullName, 'fullNameError', 'Please enter your full name.');
                isValid = false;
            }

            // Email Validation: Stricter Regex to prevent double dots and invalid placements
            const email = document.getElementById('email');
            const emailValue = email.value.trim();
            const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
            
            // Additional check for double dots in the domain part which regexes sometimes miss
            if (!emailRegex.test(emailValue) || emailValue.includes('..')) {
                setError(email, 'emailError', 'Please enter a valid email address.');
                isValid = false;
            }

            // Website Validation: Strict URL validation
            const website = document.getElementById('website');
            const websiteValue = website.value.trim();
            try {
                // Use built-in URL constructor for robust validation
                const url = new URL(websiteValue);
                // Ensure the protocol is http or https
                if (url.protocol !== 'http:' && url.protocol !== 'https:') {
                    throw new Error();
                }
            } catch (_) {
                setError(website, 'websiteError', 'Please enter a valid URL (e.g., https://example.com).');
                isValid = false;
            }

            // Password Validation
            const password = document.getElementById('password');
            if (password.value.length < 8) {
                setError(password, 'passwordError', 'Password must be at least 8 characters.');
                isValid = false;
            }

            if (isValid) {
                alert('Form submitted successfully!');
                this.reset();
            }
        });

        function setError(inputElement, errorId, message) {
            inputElement.classList.add('error-border');
            document.getElementById(errorId).textContent = message;
        }
    </script>
</body>
</html>
