<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input.invalid {
            border-color: #d93025;
        }
        .error-message {
            color: #d93025;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            min-height: 1em;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Créer un compte</h2>
    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="fullName">Nom complet</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <!-- type="text" pour supporter les emails internationalisés (EAI) sans blocage navigateur -->
            <input type="text" id="email" name="email" required>
            <div id="emailError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="website">Site web</label>
            <input type="text" id="website" name="website">
            <div id="websiteError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error-message"></div>
        </div>

        <button type="submit">S'inscrire</button>
    </form>
</div>

<script>
    const form = document.getElementById('registrationForm');

    const validators = {
        fullName: (val) => val.trim().length > 0 ? '' : 'Le nom complet est requis.',
        
        email: (val) => {
            if (!val) return 'L\'adresse e-mail est requise.';
            
            const parts = val.split('@');
            if (parts.length !== 2) return 'L\'e-mail doit contenir exactement un "@".';
            
            const [local, domain] = parts;
            if (!local || local.includes(' ')) return 'La partie locale est invalide.';
            
            // Validation du domaine (UA friendly)
            if (!domain || domain.includes(' ')) return 'Le domaine est invalide.';
            if (domain.startsWith('.') || domain.endsWith('.')) return 'Le domaine ne peut pas commencer ou finir par un point.';
            if (domain.includes('..')) return 'Le domaine ne peut pas contenir de points consécutifs.';
            
            const domainParts = domain.split('.');
            if (domainParts.length < 2) return 'Le domaine doit contenir un TLD (ex: .fr, .com).';
            
            // Vérification que chaque label n'est pas vide
            if (domainParts.some(label => label.length === 0)) return 'Le domaine contient des segments vides.';
            
            const tld = domainParts[domainParts.length - 1];
            const isALabel = tld.startsWith('xn--');
            if (!isALabel && tld.length < 2) return 'Le TLD est trop court.';
            
            return '';
        },

        website: (val) => {
            if (!val) return ''; // Optionnel
            
            // L'objet URL rejette nativement les espaces et les formats invalides
            try {
                const url = new URL(val);
                // On s'assure qu'il y a un protocole web standard
                if (!['http:', 'https:'].includes(url.protocol)) {
                    return 'Veuillez utiliser http:// ou https://.';
                }
                return '';
            } catch (_) {
                return 'Veuillez entrer une URL valide (ex: https://exemple.fr).';
            }
        },

        password: (val) => val.length >= 8 ? '' : 'Le mot de passe doit contenir au moins 8 caractères.'
    };

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let isFormValid = true;

        for (const field in validators) {
            const input = document.getElementById(field);
            const errorDiv = document.getElementById(`${field}Error`);
            const errorMessage = validators[field](input.value);

            if (errorMessage) {
                input.classList.add('invalid');
                errorDiv.textContent = errorMessage;
                isFormValid = false;
            } else {
                input.classList.remove('invalid');
                errorDiv.textContent = '';
            }
        }

        if (isFormValid) {
            alert('Formulaire valide ! Envoi en cours...');
        }
    });

    form.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', () => {
            if (input.classList.contains('invalid')) {
                const error = validators[input.id](input.value);
                const errorDiv = document.getElementById(`${input.id}Error`);
                if (!error) {
                    input.classList.remove('invalid');
                    errorDiv.textContent = '';
                } else {
                    errorDiv.textContent = error;
                }
            }
        });
    });
</script>

</body>
</html>
