<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Universal Acceptance</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input.invalid {
            border-color: #d32f2f;
            background-color: #fff8f8;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            min-height: 1.2em;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Créer un compte</h2>
    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="fullName">Nom complet</label>
            <input type="text" id="fullName" name="fullName" required>
            <div class="error-msg" id="fullNameError"></div>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="text" id="email" name="email" required>
            <div class="error-msg" id="emailError"></div>
        </div>

        <div class="form-group">
            <label for="website">Site web</label>
            <input type="url" id="website" name="website">
            <div class="error-msg" id="websiteError"></div>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
            <div class="error-msg" id="passwordError"></div>
        </div>

        <button type="submit">S'inscrire</button>
    </form>
</div>

<script>
    const form = document.getElementById('registrationForm');

    const validators = {
        fullName: (val) => val.trim().length >= 2 || "Le nom est trop court.",
        
        email: (val) => {
            if (!val) return "L'e-mail est requis.";
            
            // UA principles: no space, one @, local part non-empty
            if (val.includes(' ')) return "L'adresse e-mail ne peut pas contenir d'espaces.";
            
            const parts = val.split('@');
            if (parts.length !== 2) return "L'adresse doit contenir un seul symbole '@'.";
            
            const [local, domain] = parts;
            if (!local) return "La partie locale est requise.";
            if (!domain) return "Le domaine est requis.";

            // Domain validation: No double dots, TLD must be 2+ chars or xn--
            if (domain.includes('..')) return "Le domaine ne peut pas contenir de points consécutifs.";
            if (domain.startsWith('.') || domain.endsWith('.')) return "Le domaine ne peut pas commencer ou finir par un point.";
            
            const labels = domain.split('.');
            if (labels.length < 2) return "Le domaine doit contenir au moins un point.";
            
            const tld = labels[labels.length - 1];
            if (tld.length < 2 && !tld.startsWith('xn--')) {
                return "L'extension du domaine (TLD) est invalide.";
            }

            return true;
        },

        website: (val) => {
            if (!val) return true; // Optional
            
            //- Space check
            if (val.includes(' ')) return "L'URL ne peut pas contenir d'espaces.";
            
            try {
                const url = new URL(val);
                // Basic protocol check
                if (!['http:', 'https:'].includes(url.protocol)) return "Le protocole doit être http ou https.";
                
                const hostname = url.hostname;
                if (!hostname) return "L'hôte est requis.";
                
                // UA check for domain in URL
                if (hostname.includes('..')) return "Le domaine ne peut pas contenir de points consécutifs.";
                
                const labels = hostname.split('.');
                if (labels.length < 2) return "L'URL doit contenir un domaine valide.";
                
                const tld = labels[labels.length - 1];
                if (tld.length < 2 && !tld.startsWith('xn--')) {
                    return "L'extension du domaine est invalide.";
                }
                
                return true;
            } catch (_) {
                return "L'URL doit être complète (ex: https://exemple.fr).";
            }
        },

        password: (val) => val.length >= 8 || "Le mot de passe doit contenir au moins 8 caractères."
    };

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let isFormValid = true;

        for (const [fieldId, validate] of Object.entries(validators)) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(`${fieldId}Error`);
            const result = validate(input.value);

            if (result === true) {
                input.classList.remove('invalid');
                errorDiv.textContent = '';
            } else {
                input.classList.add('invalid');
                errorDiv.textContent = result;
                isFormValid = false;
            }
        }

        if (isFormValid) {
            alert('Formulaire valide ! Envoi des données...');
            form.submit();
        }
    });
</script>

</body>
</html>
