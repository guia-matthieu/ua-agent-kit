<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
            display: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .success-message {
            color: green;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Signup Form</h1>
    <form id="signupForm">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error">Please enter a valid full name (at least 2 characters)</div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error">Please enter a valid email address</div>
        </div>

        <div class="form-group">
            <label for="website">Website (optional)</label>
            <input type="url" id="website" name="website">
            <div id="websiteError" class="error">Please enter a valid URL (e.g., https://example.com)</div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error">Password must be at least 8 characters long</div>
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <div id="successMessage" class="success-message">
        Signup successful! Thank you.
    </div>

    <script>
        function validateEmail(email) {
            // RFC 5322 compliant regex for email validation
            const re = /^(?:(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$/i;
            return re.test(email);
        }

        function validateWebsite(url) {
            if (!url) return true;

            // Add https:// if missing
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // RFC 3986 compliant URL regex
            const re = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
            return re.test(url);
        }

        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Reset error messages
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

            // Validate form fields
            let isValid = true;

            // Validate full name
            const fullName = document.getElementById('fullName').value.trim();
            if (fullName.length < 2) {
                document.getElementById('fullNameError').style.display = 'block';
                isValid = false;
            }

            // Validate email
            const email = document.getElementById('email').value.trim();
            if (!validateEmail(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            // Validate website
            const website = document.getElementById('website').value.trim();
            if (website && !validateWebsite(website)) {
                document.getElementById('websiteError').style.display = 'block';
                isValid = false;
            }

            // Validate password
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }

            // If form is valid, show success message
            if (isValid) {
                document.getElementById('signupForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            }
        });

        // Real-time validation for better user experience
        document.getElementById('fullName').addEventListener('input', function() {
            const fullName = this.value.trim();
            if (fullName.length < 2) {
                document.getElementById('fullNameError').style.display = 'block';
            } else {
                document.getElementById('fullNameError').style.display = 'none';
            }
        });

        document.getElementById('email').addEventListener('input', function() {
            const email = this.value.trim();
            if (!validateEmail(email)) {
                document.getElementById('emailError').style.display = email ? 'block' : 'none';
            } else {
                document.getElementById('emailError').style.display = 'none';
            }
        });

        document.getElementById('website').addEventListener('input', function() {
            const website = this.value.trim();
            if (website && !validateWebsite(website)) {
                document.getElementById('websiteError').style.display = 'block';
            } else {
                document.getElementById('websiteError').style.display = 'none';
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            if (password.length < 8) {
                document.getElementById('passwordError').style.display = 'block';
            } else {
                document.getElementById('passwordError').style.display = 'none';
            }
        });
    </script>
</body>
</html>
