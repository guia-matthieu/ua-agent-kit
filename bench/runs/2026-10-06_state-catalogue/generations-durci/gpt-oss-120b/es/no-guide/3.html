<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            margin:2rem;
            max-width:500px;
        }
        form{
            display:flex;
            flex-direction:column;
        }
        label{
            margin-top:1rem;
        }
        input{
            padding:0.4rem;
            font-size:1rem;
        }
        .error{
            color:#d00;
            font-size:0.9rem;
            margin-top:0.2rem;
        }
        button{
            margin-top:1.5rem;
            padding:0.6rem;
            font-size:1rem;
        }
    </style>
</head>
<body>
    <h1>Registro de Usuario</h1>

    <form id="registroForm" novalidate>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>
        <div class="error" id="error-nombre"></div>

        <label for="email">Dirección de correo electrónico</label>
        <input type="email" id="email" name="email" required>
        <div class="error" id="error-email"></div>

        <label for="sitio">Sitio web</label>
        <input type="url" id="sitio" name="sitio" required placeholder="https://ejemplo.com">
        <div class="error" id="error-sitio"></div>

        <label for="pass">Contraseña</label>
        <input type="password" id="pass" name="pass" required minlength="6">
        <div class="error" id="error-pass"></div>

        <button type="submit">Registrarse</button>
    </form>

    <script>
        (function(){
            const form = document.getElementById('registroForm');

            /* ---------- EXPRESIONES REGULARES RESTRICTIVAS ---------- */
            const regex = {
                // No permite dos puntos consecutivos, ni caracteres inválidos
                email: /^(?!.*\.\.)[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/,
                // Requiere http/https, sin espacios y sin ".."
                url:   /^(https?:\/\/)(?!.*\.\.)([A-Za-z0-9-]+\.)+[A-Za-z]{2,}(\/.*)?$/
            };

            const validators = {
                nombre: v => v.trim().length > 0,
                email:  v => regex.email.test(v.trim()),
                sitio:  v => regex.url.test(v.trim()),
                pass:   v => v.length >= 6
            };

            const messages = {
                nombre: "El nombre completo es obligatorio.",
                email:  "Introduce una dirección de correo válida (sin '..' ni espacios).",
                sitio:  "Introduce una URL válida (http/https, sin '..' ni espacios).",
                pass:   "La contraseña debe tener al menos 6 caracteres."
            };

            const showError = (id, msg) => {
                document.getElementById('error-' + id).textContent = msg;
            };
            const clearError = id => {
                document.getElementById('error-' + id).textContent = "";
            };

            form.addEventListener('submit', e => {
                e.preventDefault();               // evitar envío real
                let allValid = true;

                // validar cada campo
                Object.keys(validators).forEach(id => {
                    const field = document.getElementById(id);
                    const value = field.value;
                    if (!validators[id](value)) {
                        showError(id, messages[id]);
                        allValid = false;
                    } else {
                        clearError(id);
                    }
                });

                if (allValid) {
                    alert('¡Registro completado con éxito!');
                    form.reset();
                }
            });

            // validación en tiempo real (opcional)
            Object.keys(validators).forEach(id => {
                const field = document.getElementById(id);
                field.addEventListener('input', () => {
                    if (validators[id](field.value)) clearError(id);
                });
            });
        })();
    </script>
</body>
</html>
