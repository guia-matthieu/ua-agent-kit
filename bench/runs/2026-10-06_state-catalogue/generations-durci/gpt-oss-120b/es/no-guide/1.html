<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 500px;
            margin: 2rem auto;
            padding: 1rem;
            line-height: 1.5;
        }
        form > div {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: .3rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: .4rem;
            box-sizing: border-box;
        }
        .error {
            color: #d00;
            font-size: .9rem;
            margin-top: .2rem;
            display: none;
        }
        .error.active {
            display: block;
        }
        button {
            padding: .6rem 1.2rem;
            font-size: 1rem;
        }
        .success {
            color: #080;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<h2>Registro de usuario</h2>

<form id="registerForm" novalidate>
    <div>
        <label for="fullname">Nombre completo *</label>
        <input type="text" id="fullname" name="fullname" required>
        <span class="error" id="error-fullname"></span>
    </div>

    <div>
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="error-email"></span>
    </div>

    <div>
        <label for="website">Sitio web *</label>
        <input type="url" id="website" name="website" placeholder="https://ejemplo.com" required>
        <span class="error" id="error-website"></span>
    </div>

    <div>
        <label for="password">Contraseña *</label>
        <input type="password" id="password" name="password" required>
        <span class="error" id="error-password"></span>
    </div>

    <button type="submit">Registrarse</button>

    <div class="success" id="success-msg" style="display:none;">
        Registro exitoso.
    </div>
</form>

<script>
(function() {
    const form = document.getElementById('registerForm');
    const successMsg = document.getElementById('success-msg');

    const fields = [
        {
            id: 'fullname',
            validate: v => v.trim().length > 0,
            message: 'El nombre completo es obligatorio.'
        },
        {
            id: 'email',
            // Email sin espacios ni puntos seguidos
            validate: v => /^[^\s@]+(?:\.[^\s@]+)*@[^\s@]+(?:\.[^\s@]+)+$/.test(v),
            message: 'Introduce un correo electrónico válido (sin puntos consecutivos ni espacios).'
        },
        {
            id: 'website',
            // URL que empiece por http(s)://, sin espacios y sin ".."
            validate: v => /^(https?:\/\/)(?!.*\.\.)([^\s./]+\.)+[^\s./]{2,}(\/\S*)?$/.test(v),
            message: 'Introduce una URL válida (debe iniciar con http(s):// y no contener espacios ni "..").'
        },
        {
            id: 'password',
            validate: v => v.length >= 6,
            message: 'La contraseña debe tener al menos 6 caracteres.'
        }
    ];

    function showError(id, msg) {
        const el = document.getElementById('error-' + id);
        el.textContent = msg;
        el.classList.add('active');
    }

    function clearError(id) {
        const el = document.getElementById('error-' + id);
        el.textContent = '';
        el.classList.remove('active');
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        let hasError = false;

        fields.forEach(f => {
            const input = document.getElementById(f.id);
            const value = input.value.trim();

            if (!f.validate(value)) {
                showError(f.id, f.message);
                hasError = true;
            } else {
                clearError(f.id);
            }
        });

        if (!hasError) {
            successMsg.style.display = 'block';
            // Si quieres enviar a un servidor, quita e.preventDefault() y este bloque.
        } else {
            successMsg.style.display = 'none';
        }
    });

    // Limpiar errores al escribir
    fields.forEach(f => {
        const input = document.getElementById(f.id);
        input.addEventListener('input', () => clearError(f.id));
    });
})();
</script>

</body>
</html>
