<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire d'inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background: #f9f9f9;
        }
        form {
            max-width: 500px;
            background: #fff;
            padding: 1.5rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .field {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: .3rem;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: .5rem;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .error {
            color: #d00;
            font-size: .9rem;
            margin-top: .2rem;
            display: block;
            min-height: 1.2em;
        }
        button {
            padding: .6rem 1.2rem;
            background: #0069d9;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #0053b3;
        }
    </style>
</head>
<body>
    <h1>Inscription</h1>
    <form id="registerForm" novalidate>
        <div class="field">
            <label for="fullName">Nom complet</label>
            <input type="text" id="fullName" name="fullName" required>
            <span class="error" id="fullNameError"></span>
        </div>

        <div class="field">
            <label for="email">Adresse e‑mail</label>
            <input type="email" id="email" name="email" required>
            <span class="error" id="emailError"></span>
        </div>

        <div class="field">
            <label for="website">Site web</label>
            <input type="url" id="website" name="website" required>
            <span class="error" id="websiteError"></span>
        </div>

        <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
            <span class="error" id="passwordError"></span>
        </div>

        <button type="submit">S'inscrire</button>
    </form>

    <script>
        // Validation du formulaire
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Empêche l'envoi tant que la validation n'est pas passée

            // Réinitialiser les messages d'erreur
            const errorElems = {
                fullName: document.getElementById('fullNameError'),
                email: document.getElementById('emailError'),
                website: document.getElementById('websiteError'),
                password: document.getElementById('passwordError')
            };
            Object.values(errorElems).forEach(el => el.textContent = '');

            // Récupérer les valeurs
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();
            const password = document.getElementById('password').value;

            let hasError = false;

            // ---- Nom complet ----
            if (fullName === '') {
                errorElems.fullName.textContent = 'Veuillez entrer votre nom complet.';
                hasError = true;
            }

            // ---- E‑mail ----
            // Regex stricte + interdiction de ".."
            const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$/;
            if (!emailPattern.test(email) || email.includes('..')) {
                errorElems.email.textContent = 'L’adresse e‑mail n’est pas valide.';
                hasError = true;
            }

            // ---- Site web ----
            // Vérifier l'absence d'espaces et que l'URL est bien formée
            if (/\s/.test(website)) {
                errorElems.website.textContent = 'L’URL ne doit pas contenir d’espaces.';
                hasError = true;
            } else {
                try {
                    const url = new URL(website);
                    if (!['http:', 'https:'].includes(url.protocol)) {
                        errorElems.website.textContent = 'Le site web doit commencer par http:// ou https://';
                        hasError = true;
                    }
                } catch (_) {
                    errorElems.website.textContent = 'L’URL du site web n’est pas valide.';
                    hasError = true;
                }
            }

            // ---- Mot de passe ----
            if (password.length < 8) {
                errorElems.password.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
                hasError = true;
            }

            // Si tout est correct, on peut soumettre le formulaire (ici on simule)
            if (!hasError) {
                alert('Inscription réussie ! Vous pouvez maintenant envoyer le formulaire.');
                // this.submit(); // Décommentez pour un vrai envoi
            }
        });
    </script>
</body>
</html>
