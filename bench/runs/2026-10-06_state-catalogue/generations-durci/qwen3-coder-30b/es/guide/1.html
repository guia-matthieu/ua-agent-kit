<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
        }
        .submit-btn {
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .success {
            color: #4caf50;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form id="registrationForm">
        <div class="form-group">
            <label for="fullName">Nombre completo:</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="website">Sitio web:</label>
            <input type="url" id="website" name="website">
            <div id="websiteError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error"></div>
        </div>

        <button type="submit" class="submit-btn">Registrarse</button>
    </form>
    <div id="successMessage" class="success" style="display: none;">
        ¡Registro completado con éxito!
    </div>

    <script>
        // Validar correo electrónico siguiendo principios de Universal Acceptance
        function validateEmail(email) {
            // Validar estructura básica
            if (!email || email.indexOf('@') === -1) {
                return false;
            }
            
            // Dividir en parte local y dominio
            const parts = email.split('@');
            if (parts.length !== 2) {
                return false;
            }
            
            const [localPart, domain] = parts;
            
            // Validar partes
            if (!localPart || localPart.length > 64) {
                return false;
            }
            
            if (!domain || domain.length > 253) {
                return false;
            }
            
            // Validar caracteres en la parte local
            // Permitir: letras, números, puntos, guiones bajos, signos más, comillas
            if (!/^[a-zA-Z0-9._%+\-''"]+$/.test(localPart)) {
                return false;
            }
            
            // No permitir puntos al inicio o final del local part
            if (localPart.startsWith('.') || localPart.endsWith('.')) {
                return false;
            }
            
            // No permitir puntos consecutivos en el local part
            if (localPart.includes('..')) {
                return false;
            }
            
            // Validar dominio
            if (!isValidDomain(domain)) {
                return false;
            }
            
            return true;
        }

        // Validar dominio con soporte Unicode (IDNA)
        function isValidDomain(domain) {
            // Verificar caracteres válidos (RFC 1035)
            if (!/^[a-zA-Z0-9.-]+$/.test(domain)) {
                return false;
            }
            
            // Verificar que no comience ni termine con guion
            if (domain.startsWith('-') || domain.endsWith('-')) {
                return false;
            }
            
            // Verificar que no contenga guiones consecutivos
            if (domain.includes('--')) {
                return false;
            }
            
            // Verificar que no tenga puntos consecutivos
            if (domain.includes('..')) {
                return false;
            }
            
            // Verificar longitud total
            if (domain.length > 253) {
                return false;
            }
            
            // Separar etiquetas por puntos
            const labels = domain.split('.');
            
            // Verificar que no haya etiquetas vacías
            if (labels.some(label => label.length === 0)) {
                return false;
            }
            
            // Verificar cada etiqueta
            for (let i = 0; i < labels.length; i++) {
                const label = labels[i];
                // Longitud máxima de etiqueta
                if (label.length > 63) {
                    return false;
                }
                // Longitud mínima de etiqueta
                if (label.length === 0) {
                    return false;
                }
                // Verificar que la etiqueta no comience ni termine con guion
                if (label.startsWith('-') || label.endsWith('-')) {
                    return false;
                }
                // Verificar caracteres válidos
                if (!/^[a-zA-Z0-9-]+$/.test(label)) {
                    // Si es una etiqueta con caracteres Unicode (A-label), permitir puntos
                    if (!/^[a-zA-Z0-9.\-]+$/.test(label)) {
                        if (!/^[^\x00-\x7F]+$/.test(label)) {
                            // Para etiquetas Unicode puras, validar con expresión más estricta
                            if (!/^[a-zA-Z0-9\-]+[a-zA-Z0-9]$/.test(label)) {
                                return false;
                            }
                        }
                    }
                }
            }
            
            // Verificar que la última etiqueta (TLD) tenga al menos 2 caracteres
            const tld = labels[labels.length - 1];
            if (tld.length < 2 && !tld.startsWith('xn--')) {
                return false;
            }
            
            return true;
        }

        // Validar URL con Universal Acceptance
        function validateUrl(url) {
            if (!url) return true; // Vacío es válido
            
            // Usar la API URL de JavaScript para validación
            try {
                const urlObj = new URL(url);
                const domain = urlObj.hostname;
                
                // Validar dominio en la URL
                if (!isValidDomain(domain)) {
                    return false;
                }
                
                // Validar el scheme
                if (!['http:', 'https:'].includes(urlObj.protocol)) {
                    return false;
                }
                
                return true;
            } catch (e) {
                return false;
            }
        }

        // Validar contraseña
        function validatePassword(password) {
            // Al menos 8 caracteres, incluyendo letras y números
            return password.length >= 8 && 
                   /[a-zA-Z]/.test(password) && 
                   /[0-9]/.test(password);
        }

        // Validar nombre completo
        function validateFullName(name) {
            // Al menos 2 palabras
            const words = name.trim().split(/\s+/);
            return words.length >= 2 && name.length >= 3;
        }

        // Función para mostrar errores
        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            errorElement.textContent = message;
        }

        // Función para limpiar errores
        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            errorElement.textContent = '';
        }

        // Manejar el envío del formulario
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Obtener valores de los campos
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();
            const password = document.getElementById('password').value;
            
            let isValid = true;
            
            // Validar nombre completo
            if (!validateFullName(fullName)) {
                showError('fullName', 'Nombre completo inválido. Debe tener al menos 2 palabras.');
                isValid = false;
            } else {
                clearError('fullName');
            }
            
            // Validar correo electrónico
            if (!validateEmail(email)) {
                showError('email', 'Correo electrónico inválido. Ejemplo: usuario@dominio.com');
                isValid = false;
            } else {
                clearError('email');
            }
            
            // Validar sitio web
            if (website && !validateUrl(website)) {
                showError('website', 'URL del sitio web inválida. Ejemplo: https://www.ejemplo.com');
                isValid = false;
            } else {
                clearError('website');
            }
            
            // Validar contraseña
            if (!validatePassword(password)) {
                showError('password', 'Contraseña inválida. Debe tener al menos 8 caracteres, incluyendo letras y números.');
                isValid = false;
            } else {
                clearError('password');
            }
            
            // Mostrar mensaje de éxito si todo es válido
            if (isValid) {
                document.getElementById('successMessage').style.display = 'block';
                // Resetear formulario
                this.reset();
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
