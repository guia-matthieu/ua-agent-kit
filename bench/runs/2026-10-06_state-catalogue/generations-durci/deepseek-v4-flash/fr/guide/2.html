<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription – validation stricte</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #444;
        }
        input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 2px rgba(74,144,217,0.2);
        }
        input.error {
            border-color: #e74c3c;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: none;
        }
        .error-message.visible {
            display: block;
        }
        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: #4a90d9;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .submit-btn:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Créer un compte</h1>
        <form id="signup-form" novalidate>
            <div class="form-group">
                <label for="fullname">Nom complet</label>
                <input type="text" id="fullname" name="fullname" placeholder="Votre nom" autocomplete="name" required>
                <span class="error-message" id="fullname-error"></span>
            </div>
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="text" id="email" name="email" placeholder="exemple@domaine.fr" autocomplete="email" required>
                <span class="error-message" id="email-error"></span>
            </div>
            <div class="form-group">
                <label for="website">Site web</label>
                <input type="text" id="website" name="website" placeholder="https://exemple.fr" autocomplete="url">
                <span class="error-message" id="website-error"></span>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="8 caractères minimum" autocomplete="new-password" required>
                <span class="error-message" id="password-error"></span>
            </div>
            <button type="submit" class="submit-btn">S'inscrire</button>
        </form>
    </div>

    <script>
        (function() {
            const form = document.getElementById('signup-form');
            const fields = {
                fullname: { el: document.getElementById('fullname'), error: document.getElementById('fullname-error') },
                email: { el: document.getElementById('email'), error: document.getElementById('email-error') },
                website: { el: document.getElementById('website'), error: document.getElementById('website-error') },
                password: { el: document.getElementById('password'), error: document.getElementById('password-error') }
            };

            function setError(fieldId, message) {
                const field = fields[fieldId];
                field.error.textContent = message;
                field.error.classList.toggle('visible', message !== '');
                field.el.classList.toggle('error', message !== '');
            }

            function clearAllErrors() {
                Object.keys(fields).forEach(key => setError(key, ''));
            }

            // ---------- validation strictes ----------

            function validateFullName(name) {
                const trimmed = name.trim();
                if (!trimmed) {
                    return 'Le nom complet est obligatoire.';
                }
                return '';
            }

            function validateEmail(email) {
                const trimmed = email.trim();
                if (!trimmed) {
                    return 'L\'adresse e-mail est obligatoire.';
                }

                // présence d'un seul @
                const atIndex = trimmed.indexOf('@');
                if (atIndex === -1 || trimmed.lastIndexOf('@') !== atIndex) {
                    return 'L\'adresse e-mail doit contenir un seul @.';
                }

                const localPart = trimmed.slice(0, atIndex);
                const domainPart = trimmed.slice(atIndex + 1);

                // local part non vide, sans espaces
                if (!localPart) {
                    return 'La partie locale ne peut pas être vide.';
                }
                if (/\s/.test(localPart)) {
                    return 'La partie locale ne doit pas contenir d\'espaces.';
                }

                // domaine non vide
                if (!domainPart) {
                    return 'Le domaine ne peut pas être vide.';
                }

                // découpage en labels
                const labels = domainPart.split('.');
                if (labels.length < 2) {
                    return 'Le domaine doit comporter au moins deux parties (ex : domaine.tld).';
                }

                // chaque label valide : non vide, pas d'espaces, taille 1-63
                for (let i = 0; i < labels.length; i++) {
                    const label = labels[i];
                    if (!label) {
                        return 'Le domaine contient un label vide (double point).';
                    }
                    if (/\s/.test(label)) {
                        return 'Un label du domaine contient un espace.';
                    }
                    if (label.length > 63) {
                        return 'Un label du domaine est trop long (max 63 caractères).';
                    }
                }

                // TLD (dernier label) validation supplémentaire
                const tld = labels[labels.length - 1];
                if (tld.length < 2) {
                    return 'Le TLD doit comporter au moins 2 caractères.';
                }
                // TLD purement numérique interdit, sauf s'il commence par xn-- (cas des A‑labels)
                if (/^\d+$/.test(tld) && !tld.toLowerCase().startsWith('xn--')) {
                    return 'Le TLD ne peut pas être uniquement numérique.';
                }

                // vérification qu'il n'y a pas de double point dans le domaine complet
                if (domainPart.includes('..')) {
                    return 'Le domaine ne doit pas contenir deux points consécutifs.';
                }

                return '';
            }

            function validateWebsite(url) {
                const trimmed = url.trim();
                if (!trimmed) {
                    return ''; // champ optionnel
                }

                // doit commencer par http:// ou https://
                if (!/^https?:\/\//i.test(trimmed)) {
                    return 'L\'URL doit commencer par http:// ou https://.';
                }

                // test d'URL valide via URL constructor
                let parsed;
                try {
                    parsed = new URL(trimmed);
                } catch (e) {
                    return 'L\'URL saisie n\'est pas valide.';
                }

                // protocole http ou https
                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                    return 'Seuls les protocoles http et https sont acceptés.';
                }

                // hostname non vide
                const hostname = parsed.hostname;
                if (!hostname) {
                    return 'L\'URL doit contenir un nom de domaine.';
                }

                // le hostname ne doit pas contenir d'espace (normalement déjà rejeté par URL)
                if (/\s/.test(hostname)) {
                    return 'Le nom de domaine ne doit pas contenir d\'espaces.';
                }

                // découpage du hostname pour vérifier les labels (comme pour l'email)
                const labels = hostname.split('.');
                for (let i = 0; i < labels.length; i++) {
                    const label = labels[i];
                    if (!label) {
                        return 'Le domaine contient un label vide.';
                    }
                    if (label.length > 63) {
                        return 'Un label du domaine est trop long (max 63).';
                    }
                }
                // TLD d'au moins 2 caractères
                const tld = labels[labels.length - 1];
                if (tld.length < 2) {
                    return 'Le TLD doit comporter au moins 2 caractères.';
                }
                // pas de TLD purement numérique (sauf xn--)
                if (/^\d+$/.test(tld) && !tld.toLowerCase().startsWith('xn--')) {
                    return 'Le TLD ne peut pas être uniquement numérique.';
                }

                // pas de double point dans le hostname
                if (hostname.includes('..')) {
                    return 'Le domaine ne doit pas contenir deux points consécutifs.';
                }

                // interdit les espaces dans l'URL complète (path, etc.)
                if (/\s/.test(trimmed)) {
                    return 'L\'URL ne doit pas contenir d\'espace.';
                }

                return '';
            }

            function validatePassword(password) {
                if (!password) {
                    return 'Le mot de passe est obligatoire.';
                }
                if (password.length < 8) {
                    return 'Le mot de passe doit contenir au moins 8 caractères.';
                }
                return '';
            }

            // ---------- submit handler ----------
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                clearAllErrors();

                const nameValue = fields.fullname.el.value;
                const emailValue = fields.email.el.value;
                const websiteValue = fields.website.el.value;
                const passwordValue = fields.password.el.value;

                let hasError = false;

                const nameErr = validateFullName(nameValue);
                if (nameErr) {
                    setError('fullname', nameErr);
                    hasError = true;
                }

                const emailErr = validateEmail(emailValue);
                if (emailErr) {
                    setError('email', emailErr);
                    hasError = true;
                }

                const websiteErr = validateWebsite(websiteValue);
                if (websiteErr) {
                    setError('website', websiteErr);
                    hasError = true;
                }

                const passwordErr = validatePassword(passwordValue);
                if (passwordErr) {
                    setError('password', passwordErr);
                    hasError = true;
                }

                if (!hasError) {
                    alert('Inscription réussie (simulation).');
                } else {
                    const firstErrorField = document.querySelector('input.error');
                    if (firstErrorField) firstErrorField.focus();
                }
            });

            // ---------- blur validation ----------
            function addBlurValidation(fieldId, validator) {
                const field = fields[fieldId];
                field.el.addEventListener('blur', function() {
                    const err = validator(this.value);
                    setError(fieldId, err || '');
                });
            }

            addBlurValidation('fullname', validateFullName);
            addBlurValidation('email', validateEmail);
            addBlurValidation('website', validateWebsite);
            addBlurValidation('password', validatePassword);

            // clear error on input
            Object.keys(fields).forEach(key => {
                fields[key].el.addEventListener('input', function() {
                    if (fields[key].error.classList.contains('visible')) {
                        setError(key, '');
                        fields[key].el.classList.remove('error');
                    }
                });
            });
        })();
    </script>
</body>
</html>
