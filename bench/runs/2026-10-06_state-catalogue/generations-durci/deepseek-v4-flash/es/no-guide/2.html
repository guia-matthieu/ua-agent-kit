<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro con validación estricta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input.error-border {
            border-color: #e74c3c;
        }
        .error {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
            min-height: 1.2em;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        #successMessage {
            color: #27ae60;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Formulario de Registro</h2>
    <form id="registerForm" novalidate>
        <!-- Nombre completo -->
        <div class="field">
            <label for="fullname">Nombre Completo:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Ej: Juan Pérez">
            <span id="fullnameError" class="error"></span>
        </div>

        <!-- Correo electrónico -->
        <div class="field">
            <label for="email">Correo Electrónico:</label>
            <input type="text" id="email" name="email" placeholder="ejemplo@correo.com">
            <span id="emailError" class="error"></span>
        </div>

        <!-- Sitio web -->
        <div class="field">
            <label for="website">Sitio Web:</label>
            <input type="text" id="website" name="website" placeholder="https://ejemplo.com">
            <span id="websiteError" class="error"></span>
        </div>

        <!-- Contraseña -->
        <div class="field">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
            <span id="passwordError" class="error"></span>
        </div>

        <button type="submit">Registrarse</button>
        <div id="successMessage"></div>
    </form>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('registerForm');
            const fullname = document.getElementById('fullname');
            const email = document.getElementById('email');
            const website = document.getElementById('website');
            const password = document.getElementById('password');

            const fullnameError = document.getElementById('fullnameError');
            const emailError = document.getElementById('emailError');
            const websiteError = document.getElementById('websiteError');
            const passwordError = document.getElementById('passwordError');
            const successMessage = document.getElementById('successMessage');

            // Limpia errores y bordes rojos
            function clearErrors() {
                fullnameError.textContent = '';
                emailError.textContent = '';
                websiteError.textContent = '';
                passwordError.textContent = '';
                successMessage.textContent = '';
                [fullname, email, website, password].forEach(input => {
                    input.classList.remove('error-border');
                });
            }

            // Muestra error en un campo
            function showError(input, errorSpan, message) {
                input.classList.add('error-border');
                errorSpan.textContent = message;
            }

            // ---------- VALIDACIONES ESTRICTAS ----------

            // 1. Nombre completo: al menos dos palabras separadas por espacio,
            //    y cada palabra debe contener solo letras (incluyendo acentos y ñ)
            //    y debe tener al menos 2 caracteres por palabra.
            function validateFullname(value) {
                const trimmed = value.trim();
                if (!trimmed) {
                    return 'El nombre completo es obligatorio.';
                }
                // Dividir por uno o más espacios
                const parts = trimmed.split(/\s+/);
                if (parts.length < 2) {
                    return 'Debe ingresar al menos nombre y apellido.';
                }
                // Cada parte: solo letras (incluyendo acentos, ñ, ç, etc.) y guiones
                const palabraRegex = /^[A-Za-zÁÉÍÓÚáéíóúÑñÜü'\-]+$/;
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    if (p.length < 2) {
                        return 'Cada nombre o apellido debe tener al menos 2 letras.';
                    }
                    if (!palabraRegex.test(p)) {
                        return 'Solo se permiten letras, guiones o apóstrofes en el nombre.';
                    }
                }
                return '';
            }

            // 2. Correo electrónico: regex estricto basado en RFC 5322 simplificado
            //    Rechaza puntos consecutivos, dominios sin punto, etc.
            function validateEmail(value) {
                const trimmed = value.trim();
                if (!trimmed) {
                    return 'El correo electrónico es obligatorio.';
                }
                // Patrón más restrictivo:
                // - parte local: letras, números, puntos, guiones, _, +, %, pero no puede empezar ni terminar con punto
                // - sin puntos consecutivos
                // - dominio: letras, números, guiones, puntos (pero no consecutivos)
                // - TLD al menos 2 letras
                const emailRegex = /^(?!\.)(?!.*\.\.)[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@(?!\.)(?!.*\.\.)[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/;
                if (!emailRegex.test(trimmed)) {
                    return 'Ingrese un correo válido (sin puntos consecutivos, dominio con TLD).';
                }
                return '';
            }

            // 3. Sitio web: debe comenzar con http:// o https:// y tener un dominio válido
            //    Rechaza espacios, puntos consecutivos, y requiere al menos un punto en el dominio
            function validateWebsite(value) {
                const trimmed = value.trim();
                if (!trimmed) {
                    return 'El sitio web es obligatorio.';
                }
                // Regex más restrictiva:
                // - protocolo obligatorio http:// o https://
                // - dominio: letras, números, guiones, pero no puede empezar o terminar con guión
                // - al menos un punto, y TLD al menos 2 letras
                // - no espacios
                const urlRegex = /^https?:\/\/(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$/;
                if (!urlRegex.test(trimmed)) {
                    return 'Ingrese una URL válida (sin espacios, dominio con TLD, ej: https://ejemplo.com).';
                }
                return '';
            }

            // 4. Contraseña: al menos 8 caracteres, sin espacios
            function validatePassword(value) {
                const trimmed = value.trim();
                if (!trimmed) {
                    return 'La contraseña es obligatoria.';
                }
                if (trimmed.length < 8) {
                    return 'La contraseña debe tener al menos 8 caracteres.';
                }
                // Además, no permitir espacios internos (ya que el campo es password no debería tener espacios,
                // pero el usuario podría copiar con espacio)
                if (/\s/.test(value)) {
                    return 'La contraseña no debe contener espacios.';
                }
                return '';
            }

            // Manejador del submit
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                clearErrors();

                const fullnameVal = fullname.value;
                const emailVal = email.value;
                const websiteVal = website.value;
                const passwordVal = password.value;

                let hasError = false;

                const fullnameErr = validateFullname(fullnameVal);
                if (fullnameErr) {
                    showError(fullname, fullnameError, fullnameErr);
                    hasError = true;
                }

                const emailErr = validateEmail(emailVal);
                if (emailErr) {
                    showError(email, emailError, emailErr);
                    hasError = true;
                }

                const websiteErr = validateWebsite(websiteVal);
                if (websiteErr) {
                    showError(website, websiteError, websiteErr);
                    hasError = true;
                }

                const passwordErr = validatePassword(passwordVal);
                if (passwordErr) {
                    showError(password, passwordError, passwordErr);
                    hasError = true;
                }

                if (!hasError) {
                    successMessage.textContent = '✅ Registro exitoso. Todos los campos son válidos.';
                    // Aquí podrías enviar el formulario si existiera backend
                }
            });
        })();
    </script>
</body>
</html>
