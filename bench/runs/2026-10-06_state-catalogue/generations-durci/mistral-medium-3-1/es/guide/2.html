<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 0.8em; margin-top: 5px; display: none; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Registro</h1>
    <form id="registerForm">
        <div class="form-group">
            <label for="fullName">Nombre completo:</label>
            <input type="text" id="fullName" name="fullName" required>
            <div id="fullNameError" class="error">El nombre completo es obligatorio</div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="text" id="email" name="email" required>
            <div id="emailError" class="error">Correo electrónico no válido</div>
        </div>

        <div class="form-group">
            <label for="website">Sitio web:</label>
            <input type="text" id="website" name="website" required>
            <div id="websiteError" class="error">URL no válida</div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required minlength="8">
            <div id="passwordError" class="error">La contraseña debe tener al menos 8 caracteres</div>
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let isValid = true;

            // Validar nombre completo
            const fullName = document.getElementById('fullName').value.trim();
            if (fullName === '') {
                document.getElementById('fullNameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('fullNameError').style.display = 'none';
            }

            // Validar correo electrónico (soporta Unicode)
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@.]+(\.[^\s@.]+)*$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('emailError').style.display = 'none';
            }

            // Validar sitio web (soporta Unicode)
            const website = document.getElementById('website').value.trim();
            try {
                const url = new URL(website.startsWith('http') ? website : `https://${website}`);
                if (url.hostname.includes(' ')) {
                    throw new Error('Espacios no permitidos');
                }
                document.getElementById('websiteError').style.display = 'none';
            } catch (e) {
                document.getElementById('websiteError').style.display = 'block';
                isValid = false;
            }

            // Validar contraseña
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('passwordError').style.display = 'none';
            }

            if (isValid) {
                alert('Formulario válido. Enviando datos...');
            }
        });
    </script>
</body>
</html>
